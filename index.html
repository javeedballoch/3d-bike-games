<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Street Bike Racing 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#249b43;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100%;
    height:100vh;
    max-width:700px;
    margin:auto;
    overflow:hidden;
    background:#249b43;
}

/* ROAD */

#road{
    position:absolute;
    top:0;
    bottom:0;
    left:12%;
    right:12%;
    background:linear-gradient(
        90deg,
        #292929,
        #414141,
        #292929
    );
    border-left:15px solid white;
    border-right:15px solid white;
    overflow:hidden;
}

#roadLines{
    position:absolute;
    top:-200px;
    bottom:-200px;
    left:0;
    right:0;
    background:
    linear-gradient(
        90deg,
        transparent 0 32.5%,
        white 32.5% 33.5%,
        transparent 33.5% 65.5%,
        white 65.5% 66.5%,
        transparent 66.5%
    );
    background-size:100% 150px;
}

/* HUD */

#hud{
    position:absolute;
    z-index:100;
    top:8px;
    left:0;
    right:0;
    display:flex;
    justify-content:space-around;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

/* TREES */

.tree{
    position:absolute;
    z-index:8;
    font-size:48px;
    filter:drop-shadow(2px 4px 3px #222);
}

.t1{left:1%;top:14%}
.t2{left:1%;top:43%}
.t3{right:1%;top:22%}
.t4{right:1%;top:54%}
.t5{left:1%;top:73%}
.t6{right:1%;top:78%}

/* BIKE */

#bike{
    position:absolute;
    z-index:50;
    width:85px;
    height:150px;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
}

.wheel{
    position:absolute;
    left:28px;
    width:29px;
    height:46px;
    border-radius:50%;
    background:#111;
    border:5px solid #777;
    box-shadow:inset 0 0 0 3px #222;
}

.frontWheel{
    top:0;
}

.backWheel{
    bottom:0;
}

.bikeBody{
    position:absolute;
    left:21px;
    top:42px;
    width:43px;
    height:73px;
    border-radius:20px;
    background:linear-gradient(
        90deg,
        #650000,
        #ff2020,
        #800000
    );
    box-shadow:0 4px 8px #111;
}

.tank{
    position:absolute;
    left:14px;
    top:47px;
    width:55px;
    height:34px;
    border-radius:18px;
    background:linear-gradient(
        #ff5555,
        #a00000
    );
}

.seat{
    position:absolute;
    left:18px;
    top:79px;
    width:49px;
    height:14px;
    border-radius:9px;
    background:#111;
}

.handle{
    position:absolute;
    left:10px;
    top:32px;
    width:64px;
    height:7px;
    border-radius:5px;
    background:#aaa;
    transform:rotate(-7deg);
}

.headlight{
    position:absolute;
    left:33px;
    top:35px;
    width:18px;
    height:12px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 15px white;
}

.rider{
    position:absolute;
    left:28px;
    top:55px;
    width:29px;
    height:39px;
    border-radius:15px;
    background:#111;
    z-index:5;
}

.helmet{
    position:absolute;
    left:27px;
    top:36px;
    width:31px;
    height:27px;
    border-radius:50%;
    background:#222;
    border:3px solid #555;
    z-index:6;
}

/* CARS */

.car{
    position:absolute;
    z-index:35;
    width:68px;
    height:108px;
    border-radius:14px;
    box-shadow:0 5px 10px #111;
}

.red{
    background:linear-gradient(
        90deg,
        #750000,
        #ef1b24,
        #750000
    );
}

.blue{
    background:linear-gradient(
        90deg,
        #003b80,
        #168cff,
        #003b80
    );
}

.yellow{
    background:linear-gradient(
        90deg,
        #a36b00,
        #ffd21c,
        #a36b00
    );
}

.car:before{
    content:"";
    position:absolute;
    left:9px;
    right:9px;
    top:12px;
    height:30px;
    border-radius:7px;
    background:#b8dfed;
}

.car:after{
    content:"";
    position:absolute;
    left:27px;
    bottom:9px;
    width:14px;
    height:8px;
    border-radius:50%;
    background:#fff4a0;
}

/* COIN */

.coin{
    position:absolute;
    z-index:35;
    width:36px;
    height:36px;
    border-radius:50%;
    background:#ffd21a;
    border:4px solid #fff2a0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    box-shadow:0 3px 8px #111;
}

/* NITRO */

#nitro{
    position:absolute;
    z-index:200;
    right:3%;
    bottom:130px;
    border:0;
    border-radius:30px;
    padding:17px 25px;
    background:#ff5900;
    color:white;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 5px 12px #222;
}

/* CONTROLS */

#controls{
    position:absolute;
    z-index:200;
    left:4%;
    right:4%;
    bottom:18px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.control{
    pointer-events:auto;
    width:90px;
    height:65px;
    border:2px solid #aaa;
    border-radius:20px;
    background:rgba(0,0,0,.75);
    color:white;
    font-size:34px;
    font-weight:bold;
    touch-action:none;
    user-select:none;
}

/* SPEED */

#speedBox{
    position:absolute;
    z-index:100;
    left:4%;
    bottom:105px;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

/* START */

.screen{
    position:absolute;
    z-index:500;
    inset:0;
    background:rgba(0,0,0,.78);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.panel{
    background:#222;
    color:white;
    padding:30px;
    border-radius:22px;
    box-shadow:0 8px 30px #000;
}

.panel h1{
    margin:0 0 10px;
    font-size:32px;
}

.panel p{
    line-height:1.6;
}

.play{
    border:0;
    border-radius:28px;
    padding:15px 28px;
    background:#16b957;
    color:white;
    font-size:20px;
    font-weight:bold;
}

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<div id="game">

    <div id="road">
        <div id="roadLines"></div>
    </div>

    <div class="tree t1">🌳</div>
    <div class="tree t2">🌲</div>
    <div class="tree t3">🌳</div>
    <div class="tree t4">🌲</div>
    <div class="tree t5">🌳</div>
    <div class="tree t6">🌲</div>

    <div id="hud">
        <span>🏆 <b id="score">0</b></span>
        <span>❤️ <b id="lives">3</b></span>
        <span>🪙 <b id="coins">0</b></span>
        <span>BEST <b id="best">0</b></span>
    </div>

    <div id="bike">

        <div class="wheel frontWheel"></div>
        <div class="wheel backWheel"></div>

        <div class="handle"></div>
        <div class="bikeBody"></div>
        <div class="tank"></div>
        <div class="seat"></div>
        <div class="headlight"></div>
        <div class="rider"></div>
        <div class="helmet"></div>

    </div>

    <div id="speedBox">
        ⚡ SPEED <b id="speed">4</b>
    </div>

    <button id="nitro">
        🔥 NITRO
    </button>

    <div id="controls">

        <button class="control" id="left">
            ⬅
        </button>

        <button class="control" id="right">
            ➡
        </button>

    </div>

    <div id="startScreen" class="screen">

        <div class="panel">

            <h1>🏍️ STREET BIKE</h1>

            <h2>RACING 3D</h2>

            <p>
                ⬅ ➡ Bike control<br>
                🪙 Coins collect karo<br>
                🚗 Cars se bacho<br>
                🔥 Nitro use karo
            </p>

            <button class="play" id="startButton">
                START RACE
            </button>

        </div>

    </div>

    <div id="gameOver" class="screen hidden">

        <div class="panel">

            <h1>💥 CRASH!</h1>

            <p>
                Score: <b id="finalScore">0</b>
            </p>

            <p>
                Coins: <b id="finalCoins">0</b>
            </p>

            <p>
                Best: <b id="finalBest">0</b>
            </p>

            <button class="play" id="restart">
                🏍️ RACE AGAIN
            </button>

        </div>

    </div>

</div>

<script>
(function(){

"use strict";

var game = document.getElementById("game");
var bike = document.getElementById("bike");

var playing = false;

var bikeX = 50;

var score = 0;
var lives = 3;
var coins = 0;

var speed = 4;

var turbo = false;

var objects = [];

var timer = 0;

var best = 0;

var leftHeld = false;
var rightHeld = false;

try{

    best = parseInt(
        localStorage.getItem("streetBikeBest") || "0",
        10
    );

    if(isNaN(best)){
        best = 0;
    }

}catch(error){

    best = 0;

}

document.getElementById("best").textContent = best;


/* HUD */

function updateHUD(){

    document.getElementById("score").textContent = score;

    document.getElementById("lives").textContent = lives;

    document.getElementById("coins").textContent = coins;

    document.getElementById("best").textContent = best;

}


/* BIKE MOVEMENT */

function moveBike(direction){

    if(!playing){
        return;
    }

    bikeX += direction * 1.2;

    if(bikeX < 20){
        bikeX = 20;
    }

    if(bikeX > 80){
        bikeX = 80;
    }

    bike.style.left = bikeX + "%";

}


/* CONTINUOUS LEFT / RIGHT */

function controlLoop(){

    if(playing){

        if(leftHeld){
            moveBike(-1);
        }

        if(rightHeld){
            moveBike(1);
        }

    }

    requestAnimationFrame(controlLoop);

}

controlLoop();


/* LEFT BUTTON */

var leftButton = document.getElementById("left");

leftButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        leftHeld = true;

        moveBike(-1);

    }
);

leftButton.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();

        leftHeld = false;

    }
);

leftButton.addEventListener(
    "pointercancel",
    function(){

        leftHeld = false;

    }
);

leftButton.addEventListener(
    "pointerleave",
    function(){

        leftHeld = false;

    }
);


/* RIGHT BUTTON */

var rightButton = document.getElementById("right");

rightButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        rightHeld = true;

        moveBike(1);

    }
);

rightButton.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();

        rightHeld = false;

    }
);

rightButton.addEventListener(
    "pointercancel",
    function(){

        rightHeld = false;

    }
);

rightButton.addEventListener(
    "pointerleave",
    function(){

        rightHeld = false;

    }
);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowLeft"){
            leftHeld = true;
        }

        if(e.key === "ArrowRight"){
            rightHeld = true;
        }

    }
);

document.addEventListener(
    "keyup",
    function(e){

        if(e.key === "ArrowLeft"){
            leftHeld = false;
        }

        if(e.key === "ArrowRight"){
            rightHeld = false;
        }

    }
);


/* NITRO */

document.getElementById("nitro")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        if(!playing){
            return;
        }

        turbo = true;

        setTimeout(
            function(){
                turbo = false;
            },
            1500
        );

    }
);


/* START */

function startGame(){

    var old =
        document.querySelectorAll(".car,.coin");

    for(
        var i=0;
        i<old.length;
        i++
    ){

        old[i].remove();

    }

    objects = [];

    playing = true;

    bikeX = 50;

    score = 0;
    lives = 3;
    coins = 0;

    speed = 4;

    timer = 0;

    turbo = false;

    leftHeld = false;
    rightHeld = false;

    bike.style.left = "50%";

    document
    .getElementById("startScreen")
    .classList.add("hidden");

    document
    .getElementById("gameOver")
    .classList.add("hidden");

    updateHUD();

}


/* SPAWN */

function spawnObject(){

    var positions = [
        28,
        50,
        72
    ];

    var lane =
        Math.floor(
            Math.random() * positions.length
        );

    var element =
        document.createElement("div");

    if(Math.random() < 0.72){

        element.className =
            "car " +
            ["red","blue","yellow"]
            [
                Math.floor(
                    Math.random()*3
                )
            ];

    }else{

        element.className = "coin";

        element.textContent = "🪙";

    }

    element.style.left =
        positions[lane] + "%";

    element.style.top =
        "-130px";

    game.appendChild(element);

    objects.push({

        element:element,

        y:-130,

        type:
        element.classList.contains("coin")
        ? "coin"
        : "car"

    });

}


/* COLLISION */

function collision(a,b){

    var A =
        a.getBoundingClientRect();

    var B =
        b.getBoundingClientRect();

    return !(
        A.right < B.left + 8 ||
        A.left > B.right - 8 ||
        A.bottom < B.top + 8 ||
        A.top > B.bottom - 8
    );

}


/* GAME OVER */

function endGame(){

    playing = false;

    leftHeld = false;
    rightHeld = false;

    if(score > best){

        best = score;

        try{

            localStorage.setItem(
                "streetBikeBest",
                String(best)
            );

        }catch(error){}

    }

    document.getElementById(
        "finalScore"
    ).textContent = score;

    document.getElementById(
        "finalCoins"
    ).textContent = coins;

    document.getElementById(
        "finalBest"
    ).textContent = best;

    document
    .getElementById("gameOver")
    .classList.remove("hidden");

    updateHUD();

}


/* GAME LOOP */

function gameLoop(){

    if(playing){

        timer++;

        if(timer > 40){

            timer = 0;

            spawnObject();

        }

        var movement =
            turbo ? 8 : speed;

        for(
            var i=objects.length-1;
            i>=0;
            i--
        ){

            var object = objects[i];

            object.y += movement;

            object.element.style.top =
                object.y + "px";


            /* COLLISION */

            if(
                collision(
                    bike,
                    object.element
                )
            ){

                if(object.type === "coin"){

                    coins++;

                    score += 10;

                }else{

                    lives--;

                }

                object.element.remove();

                objects.splice(i,1);

                updateHUD();


                if(lives <= 0){

                    endGame();

                    return;

                }

                continue;

            }


            /* REMOVE */

            if(
                object.y >
                game.clientHeight + 130
            ){

                object.element.remove();

                objects.splice(i,1);

                if(object.type === "car"){

                    score++;

                    updateHUD();

                }

            }

        }


        speed += 0.002;

        if(speed > 8){
            speed = 8;
        }

        document.getElementById(
            "speed"
        ).textContent =
            turbo
            ? "BOOST!"
            : speed.toFixed(1);

    }

    requestAnimationFrame(gameLoop);

}


/* BUTTONS */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("restart")
.addEventListener(
    "click",
    startGame
);


updateHUD();

requestAnimationFrame(gameLoop);

})();
</script>

</body>
</html>
