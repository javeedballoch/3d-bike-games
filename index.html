<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mountain Highway Bike Racing</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#10151b;font-family:Arial,sans-serif
}
#game{
 position:fixed;inset:0;overflow:hidden;
 background:#78a7c4
}
.scene{
 position:absolute;inset:0;
 background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Mountain_highway_(Unsplash).jpg?width=1600");
 background-size:cover;
 background-position:center 42%;
 filter:saturate(1.08) contrast(1.04)
}
.shade{
 position:absolute;inset:0;
 background:linear-gradient(
  to bottom,
  rgba(5,20,30,.08),
  rgba(5,10,15,.12) 48%,
  rgba(5,8,10,.72) 100%
 )
}
.road{
 position:absolute;
 left:50%;bottom:-10%;
 width:82%;height:75%;
 transform:translateX(-50%) perspective(500px) rotateX(8deg);
 background:linear-gradient(90deg,#202328,#4a4d50 48%,#202328);
 clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
 box-shadow:0 -10px 30px rgba(0,0,0,.2)
}
.road:before{
 content:"";
 position:absolute;inset:0;
 background:repeating-linear-gradient(
  to bottom,
  transparent 0 11%,
  rgba(255,255,255,.9) 11.5% 13%,
  transparent 13.5% 24%
 );
 clip-path:polygon(48.8% 0,51.2% 0,55% 100%,45% 100%)
}
.rail{
 position:absolute;bottom:31%;
 width:48%;height:7px;
 background:#b9c0c3;
 box-shadow:0 0 5px #fff
}
.rail.l{left:-5%;transform:rotate(-10deg)}
.rail.r{right:-5%;transform:rotate(10deg)}

.hud{
 position:absolute;top:12px;left:10px;right:10px;
 display:flex;justify-content:space-between;
 gap:7px;z-index:8
}
.box{
 background:rgba(10,15,21,.78);
 border:1px solid rgba(255,255,255,.18);
 border-radius:9px;
 padding:7px 10px;color:#fff;
 font-weight:800;min-width:72px;
 text-align:center;
 backdrop-filter:blur(5px)
}
.box small{
 display:block;font-size:9px;color:#b8c5ce
}
.box b{font-size:17px}

.center{
 position:absolute;top:77px;left:50%;
 transform:translateX(-50%);
 color:white;font-weight:900;
 text-shadow:0 2px 5px #000;
 font-size:15px;z-index:8
}

.bike{
 position:absolute;z-index:7;
 left:50%;bottom:4%;
 width:155px;height:255px;
 transform:translateX(-50%);
 filter:drop-shadow(0 18px 10px rgba(0,0,0,.65));
 transition:left .08s linear
}
.wheel{
 position:absolute;left:50%;
 transform:translateX(-50%);
 width:48px;height:86px;
 border-radius:50%;
 background:radial-gradient(
  circle,#555 0 15%,#111 17% 34%,
  #444 36% 43%,#090909 45%
 );
 border:4px solid #070707
}
.wheel.back{bottom:0}
.wheel.front{top:28px}

.body{
 position:absolute;left:50%;top:68px;
 transform:translateX(-50%);
 width:78px;height:126px;
 border-radius:35px 35px 18px 18px;
 background:linear-gradient(
  90deg,#65000b,#e00018 42%,#79000b
 );
 box-shadow:
  inset -8px 0 12px rgba(255,255,255,.18),
  inset 7px 0 10px rgba(0,0,0,.35)
}
.tail{
 position:absolute;left:50%;top:70px;
 transform:translateX(-50%);
 width:88px;height:35px;
 background:linear-gradient(#c80014,#5c0008);
 border-radius:50% 50% 35% 35%
}
.seat{
 position:absolute;left:50%;top:105px;
 transform:translateX(-50%);
 width:50px;height:65px;
 border-radius:45%;background:#15171a
}
.head{
 position:absolute;left:50%;top:8px;
 transform:translateX(-50%);
 width:34px;height:28px;
 border-radius:50%;background:#111
}
.visor{
 position:absolute;left:50%;top:13px;
 transform:translateX(-50%);
 width:25px;height:10px;
 border-radius:8px;background:#172c36
}
.handle{
 position:absolute;left:50%;top:54px;
 transform:translateX(-50%);
 width:105px;height:8px;
 background:#16191b;border-radius:5px
}
.light{
 position:absolute;left:50%;top:77px;
 transform:translateX(-50%);
 width:18px;height:11px;
 border-radius:50%;
 background:#fff6a0;
 box-shadow:0 0 12px #fff
}

.car{
 position:absolute;z-index:6;
 width:58px;height:95px;
 border-radius:15px 15px 8px 8px;
 background:linear-gradient(90deg,#222,#aaa 45%,#333);
 box-shadow:0 12px 9px rgba(0,0,0,.45)
}
.car:before{
 content:"";
 position:absolute;
 left:9px;right:9px;top:16px;
 height:27px;border-radius:7px;
 background:linear-gradient(#26343b,#9caeb4)
}
.car:after{
 content:"";
 position:absolute;
 left:12px;right:12px;bottom:8px;
 height:10px;background:#d22;
 border-radius:4px;
 box-shadow:0 0 8px #f22
}

.coin{
 position:absolute;z-index:5;
 width:22px;height:22px;
 border-radius:50%;
 border:4px solid #ffd21a;
 background:#ffec70;
 box-shadow:0 0 18px #ffb300;
 animation:spin .6s linear infinite
}
@keyframes spin{
 to{transform:rotateY(360deg)}
}

.controls{
 position:absolute;z-index:10;
 left:0;right:0;bottom:20px;
 display:flex;justify-content:space-between;
 padding:0 18px
}
.btn{
 width:88px;height:88px;
 border-radius:50%;
 border:2px solid rgba(255,255,255,.45);
 background:rgba(10,15,20,.55);
 color:#fff;font-size:38px;
 font-weight:900;
 box-shadow:0 5px 20px rgba(0,0,0,.35);
 touch-action:none
}
.nitro{
 position:absolute;z-index:10;
 right:24px;bottom:122px;
 border:0;border-radius:50%;
 width:82px;height:82px;
 background:linear-gradient(#ff8b21,#d52300);
 color:#fff;font-weight:900;
 box-shadow:0 0 22px rgba(255,75,0,.55);
 touch-action:none
}

.start{
 position:absolute;z-index:20;inset:0;
 display:flex;align-items:center;
 justify-content:center;
 background:rgba(0,0,0,.38)
}
.panel{
 background:rgba(7,12,17,.9);
 color:#fff;padding:24px;
 border-radius:18px;text-align:center;
 border:1px solid rgba(255,255,255,.2);
 width:min(90%,340px)
}
.panel h1{
 margin:0 0 8px;font-size:27px
}
.panel p{
 color:#c9d3d9;font-size:13px
}
.startBtn{
 border:0;border-radius:12px;
 padding:13px 30px;
 background:#e53935;color:#fff;
 font-weight:900;font-size:18px
}
.hidden{display:none!important}
</style>
</head>

<body>

<div id="game">

<div class="scene"></div>
<div class="shade"></div>
<div class="road"></div>

<div class="rail l"></div>
<div class="rail r"></div>

<div class="hud">
 <div class="box">
  <small>SCORE</small>
  <b id="score">0</b>
 </div>

 <div class="box">
  <small>COINS</small>
  <b id="coins">0</b>
 </div>

 <div class="box">
  <small>LIVES</small>
  <b id="lives">3</b>
 </div>

 <div class="box">
  <small>BEST</small>
  <b id="best">0</b>
 </div>
</div>

<div class="center" id="speed">0 KM/H</div>

<div class="bike" id="bike">
 <div class="wheel front"></div>
 <div class="wheel back"></div>
 <div class="handle"></div>
 <div class="head"></div>
 <div class="visor"></div>
 <div class="tail"></div>
 <div class="seat"></div>
 <div class="body"></div>
 <div class="light"></div>
</div>

<button class="nitro" id="nitro">NITRO</button>

<div class="controls">
 <button class="btn" id="left">‹</button>
 <button class="btn" id="right">›</button>
</div>

<div class="start" id="start">
 <div class="panel">
  <h1>🏍️ Mountain Highway</h1>
  <p>
   Realistic mountain-road bike racing.
   Collect coins, avoid traffic and use Nitro.
  </p>
  <button class="startBtn" id="startBtn">
   START RACE
  </button>
 </div>
</div>

</div>

<script>

const bike = document.getElementById("bike");
const scoreEl = document.getElementById("score");
const coinsEl = document.getElementById("coins");
const livesEl = document.getElementById("lives");
const bestEl = document.getElementById("best");
const speedEl = document.getElementById("speed");

let x = 50;
let score = 0;
let coins = 0;
let lives = 3;
let best = +localStorage.mhrBest || 0;

let running = false;
let nitro = false;
let last = 0;
let spawn = 0;
let coinSpawn = 0;

let cars = [];
let coinObjs = [];

bestEl.textContent = best;

function move(dir){

 if(!running) return;

 x += dir * 5;

 x = Math.max(24, Math.min(76, x));

 bike.style.left = x + "%";
}

function addCar(){

 const e = document.createElement("div");

 e.className = "car";

 const lanes = [34,50,66];

 const lane =
 lanes[Math.floor(Math.random()*lanes.length)];

 e.style.left = lane + "%";
 e.style.top = "18%";

 e.style.transform = "scale(.45)";

 document.getElementById("game").appendChild(e);

 cars.push({
  e:e,
  y:18,
  lane:lane
 });
}

function addCoin(){

 const e = document.createElement("div");

 e.className = "coin";

 const lanes = [39,50,61];

 const lane =
 lanes[Math.floor(Math.random()*lanes.length)];

 e.style.left = lane + "%";
 e.style.top = "24%";

 e.style.transform = "scale(.55)";

 document.getElementById("game").appendChild(e);

 coinObjs.push({
  e:e,
  y:24,
  lane:lane
 });
}

function hit(a,b){

 return Math.abs(parseFloat(a)-parseFloat(b)) < 7;
}

function loop(t){

 if(!running) return;

 let dt = Math.min(
  .035,
  (t-last)/1000 || 0
 );

 last = t;

 let mult = nitro ? 1.75 : 1;

 score += dt * 110 * mult;

 scoreEl.textContent =
  Math.floor(score);

 speedEl.textContent =
  Math.floor(105*mult) + " KM/H";

 spawn -= dt * mult;
 coinSpawn -= dt * mult;

 if(spawn <= 0){

  addCar();

  spawn = .85 +
  Math.random()*.7;
 }

 if(coinSpawn <= 0){

  addCoin();

  coinSpawn = .65 +
  Math.random()*.65;
 }

 cars.forEach(o => {

  o.y +=
   dt*(18+Math.random()*2)*mult;

  o.e.style.top =
   o.y + "%";

  o.e.style.transform =
   "translateX(-50%) scale(" +
   (0.45+o.y/120) + ")";

  if(o.y > 70 && hit(o.lane,x)){

   o.y = 120;

   lives--;

   livesEl.textContent =
    lives;

   bike.animate(
    [
     {transform:"translateX(-50%) rotate(-8deg)"},
     {transform:"translateX(-50%) rotate(8deg)"},
     {transform:"translateX(-50%) rotate(0)"}
    ],
    {duration:300}
   );

   if(lives <= 0){

    gameOver();
   }
  }

 });

 cars = cars.filter(o => {

  if(o.y > 110){

   o.e.remove();

   return false;
  }

  return true;
 });

 coinObjs.forEach(o => {

  o.y +=
   dt*20*mult;

  o.e.style.top =
   o.y + "%";

  o.e.style.transform =
   "scale(" +
   (0.55+o.y/140) +
   ")";

  if(o.y > 70 && hit(o.lane,x)){

   coins++;

   coinsEl.textContent =
    coins;

   score += 250;

   o.y = 120;
  }

 });

 coinObjs = coinObjs.filter(o => {

  if(o.y > 110){

   o.e.remove();

   return false;
  }

  return true;
 });

 requestAnimationFrame(loop);
}

function start(){

 score = 0;
 coins = 0;
 lives = 3;
 x = 50;

 cars.forEach(o => o.e.remove());
 coinObjs.forEach(o => o.e.remove());

 cars = [];
 coinObjs = [];

 scoreEl.textContent = "0";
 coinsEl.textContent = "0";
 livesEl.textContent = "3";

 bike.style.left = "50%";

 running = true;

 document
  .getElementById("start")
  .classList.add("hidden");

 last = performance.now();

 requestAnimationFrame(loop);
}

function gameOver(){

 running = false;

 best =
  Math.max(best,Math.floor(score));

 localStorage.mhrBest =
  best;

 bestEl.textContent =
  best;

 document.querySelector(".panel h1")
  .textContent = "🏁 RACE OVER";

 document.querySelector(".panel p")
  .textContent =
   "Score: " +
   Math.floor(score) +
   " • Coins: " +
   coins;

 document.getElementById("startBtn")
  .textContent = "PLAY AGAIN";

 document.getElementById("start")
  .classList.remove("hidden");
}

document
 .getElementById("startBtn")
 .onclick = start;

document
 .getElementById("left")
 .onpointerdown = () => move(-1);

document
 .getElementById("right")
 .onpointerdown = () => move(1);

document
 .getElementById("nitro")
 .onpointerdown = () => {
  nitro = true;
 };

document
 .getElementById("nitro")
 .onpointerup = () => {
  nitro = false;
 };

document
 .getElementById("nitro")
 .onpointercancel = () => {
  nitro = false;
 };

addEventListener("keydown",e => {

 if(
  e.key === "ArrowLeft" ||
  e.key.toLowerCase() === "a"
 ){
  move(-1);
 }

 if(
  e.key === "ArrowRight" ||
  e.key.toLowerCase() === "d"
 ){
  move(1);
 }

 if(
  e.key === " " ||
  e.key.toLowerCase() === "n"
 ){
  nitro = true;
 }

});

addEventListener("keyup",e => {

 if(
  e.key === " " ||
  e.key.toLowerCase() === "n"
 ){
  nitro = false;
 }

});

</script>

</body>
</html>
