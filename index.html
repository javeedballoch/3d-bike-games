<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mountain Bike Racing 3D</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#8fb8c7;font-family:Arial,sans-serif;
  touch-action:none
}
#game{position:fixed;inset:0;overflow:hidden}

#scene{
  position:absolute;
  inset:0
}

#hud{
  position:absolute;
  top:14px;
  left:12px;
  right:12px;
  z-index:20;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px
}

.h{
  background:rgba(8,25,36,.92);
  border:1px solid #ffffff55;
  border-radius:14px;
  color:white;
  text-align:center;
  padding:7px 2px;
  box-shadow:0 4px 12px #0008
}

.h small{
  display:block;
  color:#bdc9cf;
  font-size:10px
}

.h b{
  font-size:24px
}

#speed{
  position:absolute;
  top:137px;
  width:100%;
  z-index:20;
  text-align:center;
  color:white;
  font-size:34px;
  font-weight:900;
  text-shadow:0 3px 8px #000
}

#nitro{
  position:absolute;
  right:22px;
  bottom:184px;
  width:120px;
  height:64px;
  border:2px solid #ffbd6b;
  border-radius:20px;
  background:linear-gradient(#ff9c16,#ed4a00);
  color:white;
  font-size:19px;
  font-weight:900;
  z-index:30;
  box-shadow:0 5px 14px #0009
}

#bar{
  position:absolute;
  right:22px;
  bottom:173px;
  width:120px;
  height:8px;
  border-radius:8px;
  background:#202020;
  overflow:hidden;
  z-index:30
}

#fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#ff4d00,#ffd000)
}

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:18px;
  z-index:30;
  display:flex;
  justify-content:space-between;
  padding:0 25px
}

.c{
  width:108px;
  height:108px;
  border-radius:50%;
  border:3px solid white;
  background:#071827e8;
  color:white;
  font-size:64px;
  line-height:92px;
  text-align:center
}

#loading{
  position:absolute;
  inset:0;
  z-index:100;
  background:#0c1820;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:20px;
  text-align:center
}

#msg{
  display:none;
  position:absolute;
  inset:0;
  z-index:100;
  background:#000b;
  color:white;
  text-align:center;
  padding-top:40vh;
  font-size:31px;
  font-weight:900
}

#msg small{
  font-size:14px
}

@media(max-width:430px){
  .h b{font-size:23px}
}
</style>
</head>

<body>

<div id="game">

<div id="scene"></div>

<div id="hud">

<div class="h">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="h">
<small>COINS</small>
<b id="coins">0</b>
</div>

<div class="h">
<small>LIVES</small>
<b id="lives">3</b>
</div>

<div class="h">
<small>BEST</small>
<b id="best">0</b>
</div>

</div>

<div id="speed">100 KM/H</div>

<button id="nitro">NITRO</button>

<div id="bar">
<div id="fill"></div>
</div>

<div id="controls">

<button class="c" id="left">‹</button>

<button class="c" id="right">›</button>

</div>

<div id="loading">
Loading 3D Bike...
</div>

<div id="msg">
GAME OVER
<br>
<small>Tap screen to restart</small>
</div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";

import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/loaders/GLTFLoader.js";

import {DRACOLoader} from
"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/loaders/DRACOLoader.js";


/* =========================
   THREE.JS
========================= */

const scene =
new THREE.Scene();

scene.fog =
new THREE.Fog(
  0x9bbbc4,
  35,
  260
);


const camera =
new THREE.PerspectiveCamera(
  58,
  innerWidth/innerHeight,
  .05,
  500
);

camera.position.set(
  0,
  4.1,
  9.5
);


const renderer =
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.7)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.shadowMap.enabled=true;

document
.getElementById("scene")
.appendChild(renderer.domElement);


/* LIGHT */

scene.background =
new THREE.Color(0x9bbbc4);

const hemi =
new THREE.HemisphereLight(
  0xeaf8ff,
  0x4b5541,
  2
);

scene.add(hemi);


const sun =
new THREE.DirectionalLight(
  0xfff1d2,
  3
);

sun.position.set(
  -35,
  55,
  25
);

sun.castShadow=true;

scene.add(sun);


/* =========================
   MOUNTAIN BACKGROUND
========================= */

const textureLoader =
new THREE.TextureLoader();

textureLoader.load(
"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Mountain_highway_%28Unsplash%29.jpg/1280px-Mountain_highway_%28Unsplash%29.jpg",

texture=>{

texture.colorSpace =
THREE.SRGBColorSpace;

const geometry =
new THREE.SphereGeometry(
  170,
  48,
  24
);

geometry.scale(
  -1,
  1,
  1
);

const material =
new THREE.MeshBasicMaterial({
  map:texture
});

const sky =
new THREE.Mesh(
  geometry,
  material
);

scene.add(sky);

}
);


/* =========================
   ROAD
========================= */

const road =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    15,
    700
  ),
  new THREE.MeshStandardMaterial({
    color:0x30363a,
    roughness:.92
  })
);

road.rotation.x =
-Math.PI/2;

road.position.y =
-.04;

scene.add(road);


/* GRASS */

const grassMaterial =
new THREE.MeshStandardMaterial({
  color:0x405a3a,
  roughness:1
});

const grass1 =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    80,
    700
  ),
  grassMaterial
);

grass1.rotation.x =
-Math.PI/2;

grass1.position.set(
  -47,
  0,
  -250
);

scene.add(grass1);


const grass2 =
grass1.clone();

grass2.position.x=47;

scene.add(grass2);


/* ROAD LINES */

const lineMaterial =
new THREE.MeshBasicMaterial({
  color:0xffffff
});

for(
let z=-320;
z<40;
z+=10
){

const line =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .18,
    .025,
    4.2
  ),
  lineMaterial
);

line.position.set(
  0,
  .015,
  z
);

scene.add(line);

}


/* =========================
   GUARD RAILS
========================= */

const railMaterial =
new THREE.MeshStandardMaterial({
  color:0xbcc2c3,
  metalness:.7,
  roughness:.35
});

for(
const x of [-8.2,8.2]
){

const rail =
new THREE.Mesh(
  new THREE.CylinderGeometry(
    .08,
    .08,
    680,
    8
  ),
  railMaterial
);

rail.rotation.x =
Math.PI/2;

rail.position.set(
  x,
  1,
  -300
);

scene.add(rail);


for(
let z=-330;
z<30;
z+=12
){

const post =
new THREE.Mesh(
  new THREE.CylinderGeometry(
    .06,
    .06,
    1.7,
    7
  ),
  railMaterial
);

post.position.set(
  x,
  .45,
  z
);

scene.add(post);

}

}


/* =========================
   ROCKS
========================= */

const rockMaterial =
new THREE.MeshStandardMaterial({
  color:0x5d6650,
  roughness:1
});

for(
let i=0;
i<80;
i++
){

const side =
i%2 ? -1 : 1;

const rock =
new THREE.Mesh(
  new THREE.DodecahedronGeometry(
    .7+Math.random()*2.2
  ),
  rockMaterial
);

rock.position.set(
  side*(10+Math.random()*14),
  .5,
  -20-i*7
);

rock.scale.y =
1.3+Math.random()*2;

scene.add(rock);

}


/* =========================
   3D BIKE
========================= */

const loader =
new GLTFLoader();

const draco =
new DRACOLoader();

draco.setDecoderPath(
"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/libs/draco/"
);

loader.setDRACOLoader(draco);


const bike =
new THREE.Group();

bike.position.set(
  0,
  .05,
  5
);

scene.add(bike);


function fitModel(
model,
height
){

const box =
new THREE.Box3()
.setFromObject(model);

const size =
box.getSize(
  new THREE.Vector3()
);

const scale =
height /
Math.max(
  size.y,
  .001
);

model.scale.setScalar(
  scale
);

model.traverse(
object=>{

if(object.isMesh){

object.castShadow=true;
object.receiveShadow=true;

}

}
);

}


/* BIKE MODEL */

loader.load(

"https://raw.githubusercontent.com/Vyom-26/Dune_racer/main/public/assets/mesh/bike.glb",

g=>{

const model =
g.scene;

fitModel(
  model,
  2.05
);

model.rotation.y =
Math.PI;

bike.add(model);

document
.getElementById("loading")
.style.display="none";

},

undefined,

()=>{

document
.getElementById("loading")
.innerHTML=
"3D bike load nahi hui.<br>Internet check karke refresh karein.";

}

);


/* RIDER */

loader.load(

"https://raw.githubusercontent.com/Vyom-26/Dune_racer/main/public/assets/mesh/rider_bike.glb",

g=>{

const rider =
g.scene;

fitModel(
  rider,
  2
);

rider.rotation.y =
Math.PI;

rider.position.set(
  0,
  .48,
  .02
);

bike.add(rider);

}

);


/* =========================
   TRAFFIC CARS
========================= */

const traffic=[];


function createCar(
z,
lane
){

const car =
new THREE.Group();


const colors=[
  0x17242d,
  0x9b1b1b,
  0xd8d8d8,
  0x263b68
];


const body =
new THREE.Mesh(
  new THREE.BoxGeometry(
    1.45,
    .72,
    2.4
  ),
  new THREE.MeshStandardMaterial({
    color:
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ],
    roughness:.45,
    metalness:.2
  })
);

body.position.y=.45;

car.add(body);


const glass =
new THREE.Mesh(
  new THREE.BoxGeometry(
    1.1,
    .34,
    .8
  ),
  new THREE.MeshStandardMaterial({
    color:0x5e8a99,
    roughness:.15
  })
);

glass.position.set(
  0,
  .85,
  .18
);

car.add(glass);


/* WHEELS */

for(
const x of [-.58,.58]
){

for(
const zz of [-.78,.78]
){

const wheel =
new THREE.Mesh(
  new THREE.CylinderGeometry(
    .22,
    .22,
    .16,
    16
  ),
  new THREE.MeshStandardMaterial({
    color:0x111111
  })
);

wheel.rotation.z =
Math.PI/2;

wheel.position.set(
  x,
  .23,
  zz
);

car.add(wheel);

}

}


car.position.set(
  lane*3,
  .02,
  z
);

scene.add(car);

traffic.push({
  object:car,
  z:z,
  lane:lane,
  speed:8+Math.random()*5
});

}


for(
let i=0;
i<5;
i++
){

createCar(
  -35-i*45,
  [-1,-.35,.35,1][i%4]
);

}


/* =========================
   COINS
========================= */

const coinMaterial =
new THREE.MeshStandardMaterial({
  color:0xffc400,
  emissive:0xff8a00,
  emissiveIntensity:1.7,
  metalness:.65,
  roughness:.2
});

const coinGeometry =
new THREE.TorusGeometry(
  .28,
  .09,
  12,
  24
);

const coins3D=[];


for(
let i=0;
i<12;
i++
){

const coin =
new THREE.Mesh(
  coinGeometry,
  coinMaterial
);

coin.position.set(
  (i%3-1)*2.2,
  .75,
  -18-i*18
);

coin.rotation.x =
Math.PI/2;

scene.add(coin);

coins3D.push(coin);

}


/* =========================
   GAME VARIABLES
========================= */

let score=0;
let coinCount=0;
let lives=3;
let nitro=100;

let steering=0;
let boosting=false;
let gameOver=false;

let best =
Number(
  localStorage.getItem(
    "mountainBikeBest"
  ) || 0
);

let last =
performance.now();


/* HUD */

const scoreEl =
document.getElementById("score");

const coinsEl =
document.getElementById("coins");

const livesEl =
document.getElementById("lives");

const bestEl =
document.getElementById("best");

const speedEl =
document.getElementById("speed");

const fill =
document.getElementById("fill");


function updateHUD(){

scoreEl.textContent =
Math.floor(score);

coinsEl.textContent =
coinCount;

livesEl.textContent =
lives;

bestEl.textContent =
best;

speedEl.textContent =
(
boosting && nitro>0
? 190
: 100
)
+" KM/H";

fill.style.width =
Math.max(
  0,
  nitro
)
+"%";

}


/* GAME OVER */

function finish(){

gameOver=true;

best=Math.max(
  best,
  Math.floor(score)
);

localStorage.setItem(
  "mountainBikeBest",
  best
);

document
.getElementById("msg")
.style.display="block";

}


/* =========================
   CONTROLS
========================= */

function buttonHold(
id,
value
){

const button =
document.getElementById(id);

button.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

steering=value;

}
);

[
"pointerup",
"pointercancel",
"pointerleave"
]
.forEach(
event=>{

button.addEventListener(
event,
()=>{

if(
  steering===value
){

steering=0;

}

}
);

});

}


buttonHold(
"left",
-1
);

buttonHold(
"right",
1
);


/* NITRO */

const nitroButton =
document.getElementById(
  "nitro"
);


nitroButton.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

boosting=true;

}
);


[
"pointerup",
"pointercancel",
"pointerleave"
]
.forEach(
event=>{

nitroButton.addEventListener(
event,
()=>boosting=false
);

});


/* KEYBOARD */

window.addEventListener(
"keydown",
e=>{

if(
e.key==="ArrowLeft" ||
e.key.toLowerCase()==="a"
){

steering=-1;

}

if(
e.key==="ArrowRight" ||
e.key.toLowerCase()==="d"
){

steering=1;

}

if(
e.code==="Space"
){

boosting=true;

}

}
);


window.addEventListener(
"keyup",
e=>{

if(
[
"ArrowLeft",
"ArrowRight",
"a",
"d"
].includes(e.key)
){

steering=0;

}

if(
e.code==="Space"
){

boosting=false;

}

}
);


/* TAP TO RESTART */

document
.getElementById("game")
.addEventListener(
"pointerdown",
()=>{

if(gameOver){

location.reload();

}

}
);


/* =========================
   GAME UPDATE
========================= */

function update(dt){

if(gameOver)
return;


const multiplier =
boosting && nitro>0
? 1.9
: 1;


/* NITRO */

if(
boosting &&
nitro>0
){

nitro -=
42*dt;

}else{

nitro =
Math.min(
  100,
  nitro+7*dt
);

}


/* BIKE STEERING */

bike.position.x +=
steering*6.2*dt;

bike.position.x =
THREE.MathUtils.clamp(
  bike.position.x,
  -4.1,
  4.1
);


/* LEAN */

bike.rotation.z =
THREE.MathUtils.lerp(
  bike.rotation.z,
  -steering*.12,
  .12
);


/* SCORE */

score +=
dt*20*multiplier;


/* TRAFFIC */

for(
const car of traffic
){

car.z +=
dt*
(
  car.speed+
  16*multiplier
);

car.object.position.z =
car.z;


if(
car.z>12
){

car.z =
-240-
Math.random()*120;

car.lane =
[-1,-.35,.35,1]
[
 Math.floor(
  Math.random()*4
 )
];

car.object.position.x =
car.lane*3;

}


/* COLLISION */

const dx =
Math.abs(
  car.object.position.x -
  bike.position.x
);

const dz =
Math.abs(
  car.object.position.z -
  bike.position.z
);


if(
dx<1.25 &&
dz<1.65
){

lives--;

score =
Math.max(
  0,
  score-100
);

car.z=-250;

if(
lives<=0
){

finish();

}

}

}


/* COINS */

for(
const coin of coins3D
){

coin.position.z +=
dt*28*multiplier;

coin.rotation.y +=
dt*4;


if(
coin.position.z>10
){

coin.position.z =
-220-
Math.random()*80;

coin.position.x =
(
 Math.floor(
  Math.random()*3
 )-1
)*2.2;

}


if(
coin.position.distanceTo(
  bike.position
)<1.7
){

coinCount++;

score+=100;

nitro =
Math.min(
  100,
  nitro+10
);

coin.position.z =
-220-
Math.random()*80;

}

}


/* CAMERA */

camera.position.x =
THREE.MathUtils.lerp(
  camera.position.x,
  bike.position.x*.42,
  .08
);

camera.lookAt(
  bike.position.x*.35,
  1,
  -18
);


/* BEST */

best=Math.max(
  best,
  Math.floor(score)
);

updateHUD();

}


/* =========================
   LOOP
========================= */

function loop(now){

const dt =
Math.min(
  .035,
  (now-last)/1000
);

last=now;

update(dt);

renderer.render(
  scene,
  camera
);

requestAnimationFrame(
  loop
);

}


/* RESIZE */

window.addEventListener(
"resize",
()=>{

camera.aspect =
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
  innerWidth,
  innerHeight
);

}
);


updateHUD();

requestAnimationFrame(
loop
);

})();
</script>

</body>
</html>
