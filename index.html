<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mountain Bike Racing</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial}
#game{width:100%;height:100%;position:relative;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}

#hud{
 position:absolute;top:10px;left:7px;right:7px;
 display:flex;justify-content:space-between;
 z-index:5;gap:5px
}
.box{
 background:#101b25e8;color:white;
 border:2px solid #ffffff44;border-radius:12px;
 padding:5px 8px;text-align:center;
 min-width:62px;font-weight:bold
}
.box small{display:block;font-size:9px}
.box b{font-size:19px}

#speed{
 position:absolute;left:16px;bottom:108px;
 width:115px;height:115px;border-radius:50%;
 background:#09151df0;border:7px solid #20dcff;
 color:white;z-index:5;text-align:center;
 padding-top:17px;box-shadow:0 0 20px #20dcff88
}
#speed small{font-size:11px}
#speed b{display:block;font-size:31px}
#speed span{font-size:10px}

#nitro{
 position:absolute;right:18px;bottom:135px;
 z-index:6;border:0;border-radius:35px;
 padding:17px 27px;
 background:linear-gradient(#ff9228,#ed4008);
 color:white;font-size:21px;font-weight:bold
}

#controls{
 position:absolute;left:18px;right:18px;bottom:12px;
 z-index:6;display:flex;justify-content:space-between
}
.control{
 width:110px;height:72px;border-radius:40px;
 border:3px solid white;background:#07121ddd;
 color:white;font-size:43px;font-weight:bold
}

#menu{
 position:absolute;inset:0;z-index:10;
 display:flex;align-items:center;justify-content:center;
 background:#03111acc
}
.panel{
 width:90%;max-width:420px;
 padding:28px;text-align:center;color:white;
 background:#101c26f5;
 border:2px solid #ffffff55;
 border-radius:28px
}
.panel h1{margin:0 0 15px;font-size:31px}
.panel p{font-size:17px;line-height:1.5}
.start{
 border:0;border-radius:30px;
 padding:16px 32px;
 background:#13c55d;color:white;
 font-size:21px;font-weight:bold
}
.hide{display:none!important}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
 <div class="box">
  🏆<small>SCORE</small>
  <b id="score">0</b>
 </div>

 <div class="box">
  ❤️<small>LIVES</small>
  <b id="lives">3</b>
 </div>

 <div class="box">
  🪙<small>COINS</small>
  <b id="coins">0</b>
 </div>

 <div class="box">
  <small>BEST</small>
  <b id="best">0</b>
 </div>
</div>

<div id="speed">
 <small>SPEED</small>
 <b id="speedValue">0</b>
 <span>KM/H</span>
</div>

<button id="nitro">🔥 NITRO</button>

<div id="controls">
 <button class="control" id="left">←</button>
 <button class="control" id="right">→</button>
</div>

<div id="menu">
 <div class="panel">
  <h1 id="title">🏍️ MOUNTAIN RACING</h1>

  <p id="info">
   🏔️ Mountain Highway<br>
   🚗 Traffic Cars<br>
   🪙 Collect Coins<br>
   🔥 Nitro Boost<br><br>
   Use LEFT / RIGHT buttons to drive.
  </p>

  <button class="start" id="start">
   START RACE
  </button>
 </div>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

 W=window.innerWidth;
 H=window.innerHeight;

 const d=Math.min(window.devicePixelRatio||1,2);

 canvas.width=W*d;
 canvas.height=H*d;

 ctx.setTransform(d,0,0,d,0,0);
}

window.addEventListener("resize",resize);
resize();

const $=id=>document.getElementById(id);

let running=false;

let score=0;
let coins=0;
let lives=3;

let best=Number(localStorage.getItem("bikeBest")||0);

let player=.5;
let speed=80;

let left=false;
let right=false;
let nitro=false;

let cars=[];
let coinList=[];

let carTimer=0;
let coinTimer=0;
let roadMove=0;

let lastTime=0;


/* START */

$("start").onclick=function(){

 score=0;
 coins=0;
 lives=3;
 player=.5;
 speed=80;

 cars=[];
 coinList=[];

 $("menu").classList.add("hide");

 running=true;

 updateHUD();

 lastTime=performance.now();

 requestAnimationFrame(loop);
};


/* CONTROLS */

function control(button,type){

 button.addEventListener("pointerdown",e=>{
  e.preventDefault();

  if(type==="left")left=true;
  if(type==="right")right=true;
 });

 button.addEventListener("pointerup",()=>{
  if(type==="left")left=false;
  if(type==="right")right=false;
 });

 button.addEventListener("pointercancel",()=>{
  left=false;
  right=false;
 });

 button.addEventListener("pointerleave",()=>{
  left=false;
  right=false;
 });
}

control($("left"),"left");
control($("right"),"right");


/* KEYBOARD */

document.addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft")left=true;

 if(e.key==="ArrowRight")right=true;

 if(e.code==="Space")nitro=true;

});

document.addEventListener("keyup",e=>{

 if(e.key==="ArrowLeft")left=false;

 if(e.key==="ArrowRight")right=false;

 if(e.code==="Space")nitro=false;

});


/* NITRO */

$("nitro").addEventListener("pointerdown",()=>{
 nitro=true;
});

$("nitro").addEventListener("pointerup",()=>{
 nitro=false;
});

$("nitro").addEventListener("pointercancel",()=>{
 nitro=false;
});


/* SWIPE */

let touchX=0;

canvas.addEventListener("touchstart",e=>{
 touchX=e.touches[0].clientX;
});

canvas.addEventListener("touchmove",e=>{

 const x=e.touches[0].clientX;
 const dx=x-touchX;

 player+=dx/W*.8;

 player=Math.max(.1,Math.min(.9,player));

 touchX=x;
});


/* HUD */

function updateHUD(){

 $("score").textContent=Math.floor(score);
 $("coins").textContent=coins;
 $("lives").textContent=lives;
 $("best").textContent=best;
 $("speedValue").textContent=Math.floor(speed);

}


/* BACKGROUND */

function background(){

 const horizon=H*.29;

 let sky=ctx.createLinearGradient(
  0,0,0,horizon
 );

 sky.addColorStop(0,"#42afe9");
 sky.addColorStop(1,"#e9f9ff");

 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,horizon);


 /* clouds */

 ctx.fillStyle="#ffffff99";

 for(let i=0;i<6;i++){

  let x=(i*190+60)%W;
  let y=50+(i%3)*45;

  ctx.beginPath();

  ctx.arc(x,y,17,0,Math.PI*2);
  ctx.arc(x+22,y,24,0,Math.PI*2);
  ctx.arc(x+45,y,15,0,Math.PI*2);

  ctx.fill();
 }


 /* mountains */

 ctx.fillStyle="#5e8195";

 ctx.beginPath();

 ctx.moveTo(0,horizon);

 for(let x=0;x<=W;x+=55){

  ctx.lineTo(
   x,
   horizon-25-
   Math.abs(Math.sin(x*.013))*105
  );

 }

 ctx.lineTo(W,horizon);
 ctx.fill();


 /* water */

 ctx.fillStyle="#4db7d3";

 ctx.fillRect(
 0,
 horizon,
 W,
 H*.12
 );


 /* grass */

 ctx.fillStyle="#43a94c";

 ctx.fillRect(
 0,
 horizon+H*.08,
 W,
 H
 );

}


/* ROAD */

function drawRoad(){

 background();

 const horizon=H*.29;

 const center=W/2;

 const top=W*.24;

 const bottom=W*.92;


 ctx.fillStyle="#303438";

 ctx.beginPath();

 ctx.moveTo(
  center-top/2,
  horizon
 );

 ctx.lineTo(
  center+top/2,
  horizon
 );

 ctx.lineTo(
  center+bottom/2,
  H
 );

 ctx.lineTo(
  center-bottom/2,
  H
 );

 ctx.closePath();

 ctx.fill();


 /* edges */

 ctx.strokeStyle="white";
 ctx.lineWidth=7;

 ctx.beginPath();

 ctx.moveTo(
  center-top/2-10,
  horizon
 );

 ctx.lineTo(
  center-bottom/2-15,
  H
 );

 ctx.moveTo(
  center+top/2+10,
  horizon
 );

 ctx.lineTo(
  center+bottom/2+15,
  H
 );

 ctx.stroke();


 /* lane lines */

 ctx.strokeStyle="white";
 ctx.lineWidth=5;
 ctx.setLineDash([45,45]);
 ctx.lineDashOffset=-roadMove;

 [-.33,.33].forEach(lane=>{

  ctx.beginPath();

  ctx.moveTo(
   center+lane*top,
   horizon
  );

  ctx.lineTo(
   center+lane*bottom,
   H
  );

  ctx.stroke();

 });

 ctx.setLineDash([]);


 /* trees */

 for(let i=0;i<10;i++){

  let t=
   (i*.13+roadMove/900)%1;

  let y=
   horizon+(H-horizon)*t;

  let side=i%2?-1:1;

  tree(
   center+side*(bottom*.53),
   y,
   25+35*t
  );
 }

}


/* TREE */

function tree(x,y,s){

 ctx.save();

 ctx.translate(x,y);

 ctx.fillStyle="#76503c";

 ctx.fillRect(
  -s*.07,
  0,
  s*.14,
  s*.65
 );

 ctx.fillStyle="#12652f";

 for(let i=0;i<3;i++){

  ctx.beginPath();

  ctx.moveTo(
   0,
   -s*.85+i*s*.25
  );

  ctx.lineTo(
   -s*.55,
   s*.06
  );

  ctx.lineTo(
   s*.55,
   s*.06
  );

  ctx.fill();

 }

 ctx.restore();

}


/* ROAD POSITION */

function project(lane,t){

 const horizon=H*.29;

 const top=W*.24;

 const bottom=W*.92;

 return{

  x:
   W/2+
   lane*(top+(bottom-top)*t),

  y:
   horizon+(H-horizon)*t,

  scale:
   .22+1.35*t
 };

}


/* CAR */

function drawCar(car){

 const p=project(
  car.lane,
  car.y
 );

 ctx.save();

 ctx.translate(
  p.x,
  p.y
 );

 ctx.scale(
  p.scale,
  p.scale
 );


 /* shadow */

 ctx.fillStyle="#0008";

 ctx.beginPath();

 ctx.ellipse(
 0,
 57,
 40,
 10,
 0,
 0,
 Math.PI*2
 );

 ctx.fill();


 /* body */

 ctx.fillStyle=car.color;

 round(
  -34,
  -60,
  68,
  110,
  17
 );


 /* glass */

 ctx.fillStyle="#bdefff";

 round(
  -23,
  -47,
  46,
  34,
  8
 );


 /* wheels */

 ctx.fillStyle="#111";

 ctx.fillRect(-32,18,8,27);
 ctx.fillRect(24,18,8,27);


 /* lights */

 ctx.fillStyle="#ffe77b";

 ctx.fillRect(-27,49,11,7);
 ctx.fillRect(16,49,11,7);

 ctx.restore();

}


/* COIN */

function drawCoin(c){

 const p=project(
  c.lane,
  c.y
 );

 const r=16*p.scale;

 ctx.save();

 ctx.translate(p.x,p.y);

 ctx.scale(
  .25+.75*Math.abs(Math.cos(c.rot)),
  1
 );

 ctx.fillStyle="#ffd21a";

 ctx.shadowBlur=15;
 ctx.shadowColor="#ffd21a";

 ctx.beginPath();

 ctx.arc(
 0,0,r,
 0,
 Math.PI*2
 );

 ctx.fill();

 ctx.shadowBlur=0;

 ctx.fillStyle="#8d6500";

 ctx.font=
  "bold "+Math.max(10,r*.8)+"px Arial";

 ctx.textAlign="center";
 ctx.textBaseline="middle";

 ctx.fillText("★",0,1);

 ctx.restore();

}


/* BIKE */

function drawBike(){

 const x=
  W/2+
  (player-.5)*W*.64;

 const y=H*.82;

 const s=Math.min(W/350,1.2);

 ctx.save();

 ctx.translate(x,y);

 ctx.scale(s,s);


 /* shadow */

 ctx.fillStyle="#0009";

 ctx.beginPath();

 ctx.ellipse(
 0,
 73,
 53,
 15,
 0,
 0,
 Math.PI*2
 );

 ctx.fill();


 /* wheel */

 ctx.fillStyle="#090b0d";

 ctx.beginPath();

 ctx.ellipse(
 0,
 -8,
 18,
 77,
 0,
 0,
 Math.PI*2
 );

 ctx.fill();


 /* wheel rim */

 ctx.strokeStyle="#666";
 ctx.lineWidth=5;

 ctx.beginPath();

 ctx.ellipse(
 0,
 -8,
 7,
 64,
 0,
 0,
 Math.PI*2
 );

 ctx.stroke();


 /* handle */

 ctx.strokeStyle="#aaa";
 ctx.lineWidth=7;

 ctx.beginPath();

 ctx.moveTo(-49,-17);
 ctx.lineTo(49,-17);

 ctx.stroke();


 /* rider */

 ctx.fillStyle="#111";

 round(
  -29,
  -5,
  58,
  43,
  15
 );


 /* bike body */

 ctx.fillStyle="#d8202d";

 round(
  -34,
  18,
  68,
  43,
  18
 );


 /* helmet */

 ctx.fillStyle="#171b20";

 round(
  -22,
  -60,
  44,
  43,
  18
 );


 /* visor */

 ctx.fillStyle="#71d9f5";

 round(
  -14,
  -48,
  28,
  11,
  4
 );


 /* brake */

 ctx.fillStyle="#ff2222";

 ctx.beginPath();

 ctx.arc(
 0,
 48,
 7,
 0,
 Math.PI*2
 );

 ctx.fill();


 /* nitro */

 if(nitro){

  ctx.fillStyle="#ff7100";

  ctx.beginPath();

  ctx.moveTo(-13,57);

  ctx.lineTo(
   0,
   115+Math.random()*15
  );

  ctx.lineTo(13,57);

  ctx.fill();


  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.moveTo(-5,60);
  ctx.lineTo(0,94);
  ctx.lineTo(5,60);

  ctx.fill();

 }

 ctx.restore();

}


/* ROUND */

function round(x,y,w,h,r){

 ctx.beginPath();

 ctx.roundRect(
  x,y,w,h,r
 );

 ctx.fill();

}


/* SPAWN */

function spawnCar(){

 const lanes=[
  -.34,
  0,
  .34
 ];

 cars.push({

  lane:
   lanes[
    Math.floor(
     Math.random()*lanes.length
    )
   ],

  y:.01,

  color:[
   "#e21b23",
   "#1976d2",
   "#f1c40f",
   "#eeeeee"
  ][Math.floor(Math.random()*4)]

 });

}


function spawnCoin(){

 const lanes=[
  -.34,
  0,
  .34
 ];

 coinList.push({

  lane:
   lanes[
    Math.floor(
     Math.random()*lanes.length
    )
   ],

  y:.01,

  rot:0

 });

}


/* UPDATE */

function update(dt){

 let direction=
  (right?1:0)-
  (left?1:0);

 player+=
  direction*
  dt*
  .65;

 player=Math.max(
  .1,
  Math.min(.9,player)
 );


 /* speed */

 if(nitro){

  speed=Math.min(
   240,
   speed+dt*45
  );

 }else{

  speed=Math.min(
   175,
   speed+dt*5
  );

 }


 const move=
  dt*
  (speed/120)*
  .28;

 roadMove=
  (roadMove+move*900)%90;


 /* score */

 score+=
  dt*
  speed*
  .075;


 /* timers */

 carTimer+=dt;
 coinTimer+=dt;


 if(carTimer>.75){

  carTimer=0;
  spawnCar();

 }


 if(coinTimer>.9){

  coinTimer=0;
  spawnCoin();

 }


 /* move */

 cars.forEach(c=>{
  c.y+=move;
 });

 coinList.forEach(c=>{
  c.y+=move;
  c.rot+=dt*7;
 });


 /* collision */

 const playerLane=
  (player-.5)*1.5;


 for(const car of cars){

  if(
   !car.hit &&
   car.y>.76 &&
   car.y<1.02 &&
   Math.abs(
    car.lane-playerLane
   )<.22
  ){

   car.hit=true;
   lives--;
   speed=Math.max(50,speed*.55);

   if(navigator.vibrate){
    navigator.vibrate(180);
   }

  }

 }


 /* coin collect */

 for(const coin of coinList){

  if(
   !coin.hit &&
   coin.y>.76 &&
   coin.y<1.02 &&
   Math.abs(
    coin.lane-playerLane
   )<.22
  ){

   coin.hit=true;

   coins++;

   score+=15;

  }

 }


 cars=
  cars.filter(c=>c.y<1.3);

 coinList=
  coinList.filter(c=>c.y<1.3);


 /* best */

 if(
  Math.floor(score)>best
 ){

  best=Math.floor(score);

  localStorage.setItem(
   "bikeBest",
   best
  );

 }


 updateHUD();


 if(lives<=0){

  gameOver();

 }

}


/* GAME OVER */

function gameOver(){

 running=false;

 $("title").textContent=
  "💥 GAME OVER";

 $("info").innerHTML=
  "🏆 Score: <b>"+
  Math.floor(score)+
  "</b><br>🪙 Coins: <b>"+
  coins+
  "</b><br>⭐ Best: <b>"+
  best+
  "</b><br><br>Ready for another race?";

 $("start").textContent=
  "🏍️ RACE AGAIN";

 $("menu").classList.remove("hide");

}


/* DRAW */

function draw(){

 drawRoad();

 cars.forEach(drawCar);

 coinList.forEach(drawCoin);

 drawBike();

}


/* LOOP */

function loop(time){

 if(!running)return;

 const dt=
  Math.min(
   .035,
   (time-lastTime)/1000
  );

 lastTime=time;

 update(dt);

 draw();

 requestAnimationFrame(loop);

}


/* FIRST SCREEN */

drawRoad();
drawBike();
updateHUD();

</script>

</body>
</html>
