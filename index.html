<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mountain Highway Racing</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#9abac4;
}

/* MOUNTAIN BACKGROUND */
#background{
  position:absolute;
  inset:0;
  background:
    linear-gradient(to bottom,rgba(210,235,245,.15),rgba(0,0,0,.15)),
    url("https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Mountain_highway_%28Unsplash%29.jpg/1280px-Mountain_highway_%28Unsplash%29.jpg")
    center/cover no-repeat;
}

/* ROAD */
#road{
  position:absolute;
  left:50%;
  bottom:-8%;
  width:65%;
  height:82%;
  transform:translateX(-50%);
  background:linear-gradient(
    90deg,
    #202428 0%,
    #444a4e 50%,
    #202428 100%
  );
  clip-path:polygon(
    39% 0,
    61% 0,
    100% 100%,
    0 100%
  );
  box-shadow:0 0 35px rgba(0,0,0,.55);
}

/* ROAD CENTER */
#roadLine{
  position:absolute;
  left:50%;
  top:0;
  width:8px;
  height:100%;
  transform:translateX(-50%);
  background:
    repeating-linear-gradient(
      to bottom,
      white 0 40px,
      transparent 40px 82px
    );
}

/* HUD */
#hud{
  position:absolute;
  top:18px;
  left:14px;
  right:14px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  z-index:50;
}

.hudBox{
  background:rgba(12,29,40,.9);
  border:1px solid rgba(255,255,255,.4);
  border-radius:15px;
  padding:9px 3px;
  text-align:center;
  color:white;
  box-shadow:0 5px 14px rgba(0,0,0,.5);
}

.hudTitle{
  font-size:11px;
  color:#b9c7cd;
}

.hudValue{
  font-size:26px;
  font-weight:bold;
}

/* SPEED */
#speed{
  position:absolute;
  top:145px;
  width:100%;
  text-align:center;
  color:white;
  font-size:36px;
  font-weight:900;
  text-shadow:0 3px 9px black;
  z-index:50;
}

/* OBJECTS */
#objects{
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none;
}

/* TRAFFIC CAR */
.car{
  position:absolute;
  width:60px;
  height:102px;
  border-radius:14px;
  background:
    linear-gradient(
      90deg,
      #17191b,
      #686f74 50%,
      #181a1c
    );
  border:2px solid #111;
  box-shadow:0 12px 18px rgba(0,0,0,.7);
}

.car::before{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  top:14px;
  height:34px;
  border-radius:8px;
  background:linear-gradient(#9ed0dc,#26383e);
  border:2px solid #16191b;
}

.car::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:10px;
  height:12px;
  border-radius:5px;
  background:
    linear-gradient(
      90deg,
      #ff1515 0 35%,
      transparent 35% 65%,
      #ff1515 65%
    );
  box-shadow:0 0 10px red;
}

/* COIN */
.coin{
  position:absolute;
  width:32px;
  height:32px;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      #fff7a0 0 20%,
      #ffd21b 25% 60%,
      #ff8500 65%
    );
  border:4px solid #ffae00;
  box-shadow:
    0 0 8px #ffcf00,
    0 0 20px #ff9000;
}

/* BIKE */
#bike{
  position:absolute;
  left:50%;
  bottom:55px;
  width:180px;
  height:300px;
  transform:translateX(-50%);
  z-index:40;
  filter:drop-shadow(0 16px 12px rgba(0,0,0,.8));
}

/* WHEELS */
.wheel{
  position:absolute;
  left:50%;
  width:55px;
  height:94px;
  transform:translateX(-50%);
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      #aaa 0 10%,
      #111 12% 42%,
      #555 44% 49%,
      #070707 52%
    );
  border:6px solid #111;
}

.frontWheel{
  top:4px;
}

.backWheel{
  bottom:0;
}

/* FORK */
.fork{
  position:absolute;
  left:50%;
  top:55px;
  width:11px;
  height:105px;
  background:linear-gradient(#aaa,#444);
  border-radius:8px;
  transform:translateX(-50%) rotate(7deg);
}

/* HANDLE */
.handle{
  position:absolute;
  left:50%;
  top:43px;
  width:105px;
  height:9px;
  transform:translateX(-50%);
  background:#111;
  border-radius:10px;
}

/* RIDER HEAD */
.head{
  position:absolute;
  left:50%;
  top:15px;
  width:31px;
  height:38px;
  transform:translateX(-50%);
  background:#101010;
  border-radius:50%;
}

/* SEAT */
.seat{
  position:absolute;
  left:50%;
  top:60px;
  width:68px;
  height:44px;
  transform:translateX(-50%);
  background:#111;
  border-radius:25px;
}

/* FUEL TANK */
.tank{
  position:absolute;
  left:50%;
  top:80px;
  width:108px;
  height:86px;
  transform:translateX(-50%);
  background:
    linear-gradient(
      105deg,
      #82000d,
      #ff203d 50%,
      #85000d
    );
  border-radius:48px 48px 22px 22px;
  box-shadow:
    inset -12px -8px 15px #470006,
    inset 10px 0 10px #ff5360;
}

/* BIKE BODY */
.body{
  position:absolute;
  left:50%;
  top:120px;
  width:95px;
  height:122px;
  transform:translateX(-50%);
  background:
    linear-gradient(
      100deg,
      #8e0012,
      #ff1837 50%,
      #8b0011
    );
  border-radius:35px 35px 24px 24px;
  box-shadow:
    inset -12px 0 14px #510009,
    inset 8px 0 10px #ff5968;
}

/* HEADLIGHT */
.light{
  position:absolute;
  left:50%;
  top:126px;
  width:31px;
  height:17px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#fff5a0;
  box-shadow:0 0 15px #fff;
}

/* NITRO BAR */
#nitroBar{
  position:absolute;
  right:22px;
  bottom:205px;
  width:140px;
  height:12px;
  background:#222;
  border-radius:20px;
  overflow:hidden;
  z-index:60;
}

#nitroFill{
  width:100%;
  height:100%;
  background:linear-gradient(
    90deg,
    #ff6200,
    #ffd000
  );
}

/* NITRO BUTTON */
#nitro{
  position:absolute;
  right:25px;
  bottom:55px;
  width:138px;
  height:138px;
  border:0;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #ffb72d,
      #ff6000 65%,
      #d63800
    );
  color:white;
  font-size:20px;
  font-weight:bold;
  z-index:60;
  box-shadow:0 6px 20px rgba(0,0,0,.7);
}

#nitro:active{
  transform:scale(.94);
}

/* CONTROLS */
#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:25px;
  display:flex;
  justify-content:space-between;
  padding:0 28px;
  z-index:60;
}

.control{
  width:126px;
  height:126px;
  border-radius:50%;
  border:3px solid white;
  background:rgba(8,22,32,.9);
  color:white;
  font-size:70px;
  line-height:105px;
  text-align:center;
  user-select:none;
}

.control:active{
  transform:scale(.94);
}

/* GAME OVER */
#gameOver{
  display:none;
  position:absolute;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.72);
  color:white;
  text-align:center;
  padding-top:43vh;
  font-size:32px;
  font-weight:bold;
}

#gameOver small{
  font-size:16px;
}

@media(max-width:430px){
  .hudValue{
    font-size:24px;
  }

  .speed{
    font-size:34px;
  }

  .control{
    width:120px;
    height:120px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="background"></div>

  <div id="road">
    <div id="roadLine"></div>
  </div>

  <div id="hud">

    <div class="hudBox">
      <div class="hudTitle">SCORE</div>
      <div id="score" class="hudValue">0</div>
    </div>

    <div class="hudBox">
      <div class="hudTitle">COINS</div>
      <div id="coins" class="hudValue">0</div>
    </div>

    <div class="hudBox">
      <div class="hudTitle">LIVES</div>
      <div id="lives" class="hudValue">3</div>
    </div>

    <div class="hudBox">
      <div class="hudTitle">BEST</div>
      <div id="best" class="hudValue">0</div>
    </div>

  </div>

  <div id="speed">100 KM/H</div>

  <div id="objects"></div>

  <!-- BIKE -->
  <div id="bike">

    <div class="wheel frontWheel"></div>

    <div class="wheel backWheel"></div>

    <div class="fork"></div>

    <div class="handle"></div>

    <div class="head"></div>

    <div class="seat"></div>

    <div class="tank"></div>

    <div class="body"></div>

    <div class="light"></div>

  </div>

  <!-- NITRO -->
  <div id="nitroBar">
    <div id="nitroFill"></div>
  </div>

  <button id="nitro">NITRO</button>

  <!-- CONTROLS -->
  <div id="controls">

    <button id="left" class="control">‹</button>

    <button id="right" class="control">›</button>

  </div>

  <div id="gameOver">
    GAME OVER
    <br>
    <small>Tap screen to restart</small>
  </div>

</div>

<script>
(() => {

  const objects = document.getElementById("objects");

  const scoreEl = document.getElementById("score");
  const coinsEl = document.getElementById("coins");
  const livesEl = document.getElementById("lives");
  const bestEl = document.getElementById("best");
  const speedEl = document.getElementById("speed");
  const nitroFill = document.getElementById("nitroFill");
  const gameOver = document.getElementById("gameOver");

  let score = 0;
  let coins = 0;
  let lives = 3;
  let nitro = 100;

  let playerX = 50;
  let direction = 0;
  let boosting = false;

  let best = Number(localStorage.getItem("mountainBest") || 0);

  let lastTime = performance.now();
  let carTimer = 0;
  let coinTimer = 0;

  let items = [];
  let ended = false;

  bestEl.textContent = best;

  function updateHUD(){

    scoreEl.textContent = Math.floor(score);

    coinsEl.textContent = coins;

    livesEl.textContent = lives;

    bestEl.textContent = best;

    let currentSpeed = boosting ? 190 : 100;

    speedEl.textContent = currentSpeed + " KM/H";

    nitroFill.style.width =
      Math.max(0,nitro) + "%";
  }

  function createObject(type){

    const element =
      document.createElement("div");

    element.className =
      "obj " + type;

    objects.appendChild(element);

    items.push({
      element:element,
      type:type,
      progress:0,
      lane:(Math.random() - .5) * 1.5,
      hit:false
    });
  }

  function restartGame(){

    items.forEach(item => {
      item.element.remove();
    });

    items = [];

    score = 0;
    coins = 0;
    lives = 3;
    nitro = 100;

    playerX = 50;
    direction = 0;
    boosting = false;

    ended = false;

    gameOver.style.display = "none";

    updateHUD();
  }

  function gameEnd(){

    ended = true;

    best = Math.max(
      best,
      Math.floor(score)
    );

    localStorage.setItem(
      "mountainBest",
      best
    );

    gameOver.style.display = "block";

    updateHUD();
  }

  function collision(a,b){

    return Math.abs(a-b) < 8;

  }

  function update(dt){

    if(ended) return;

    let multiplier =
      boosting && nitro > 0
      ? 1.9
      : 1;

    if(boosting && nitro > 0){

      nitro -= 38 * dt;

    }else{

      nitro =
        Math.min(
          100,
          nitro + 7 * dt
        );

    }

    playerX +=
      direction * 40 * dt;

    playerX =
      Math.max(
        28,
        Math.min(72,playerX)
      );

    score +=
      dt * 16 * multiplier;

    carTimer += dt;
    coinTimer += dt;

    if(carTimer > .8 / multiplier){

      carTimer = 0;

      createObject("car");
    }

    if(coinTimer > .65){

      coinTimer = 0;

      createObject("coin");
    }

    items.forEach((item,index) => {

      item.progress +=
        dt * (.24 + .28 * multiplier);

      const p = item.progress;

      const y =
        20 + p * 78;

      const x =
        50 +
        item.lane *
        (4 + p * 31);

      const scale =
        .25 + p * 1.25;

      item.element.style.left =
        x + "%";

      item.element.style.top =
        y + "%";

      item.element.style.transform =
        "translate(-50%,-50%) scale(" +
        scale +
        ")";

      if(
        p > .88 &&
        !item.hit &&
        collision(x,playerX)
      ){

        item.hit = true;

        if(item.type === "coin"){

          coins++;

          score += 100;

          nitro =
            Math.min(
              100,
              nitro + 12
            );

          item.element.remove();

          items.splice(index,1);

        }else{

          lives--;

          score =
            Math.max(
              0,
              score - 100
            );

          item.element.style.opacity = ".2";

          if(lives <= 0){

            gameEnd();

          }

        }

      }

      if(p > 1.08){

        item.element.remove();

        items.splice(index,1);

      }

    });

    best =
      Math.max(
        best,
        Math.floor(score)
      );

    updateHUD();

  }

  function gameLoop(now){

    const dt =
      Math.min(
        .035,
        (now - lastTime) / 1000
      );

    lastTime = now;

    update(dt);

    requestAnimationFrame(gameLoop);

  }

  function holdButton(button,value){

    button.addEventListener(
      "pointerdown",
      event => {

        event.preventDefault();

        direction = value;

      }
    );

    button.addEventListener(
      "pointerup",
      event => {

        event.preventDefault();

        if(direction === value){

          direction = 0;

        }

      }
    );

    button.addEventListener(
      "pointercancel",
      () => {

        if(direction === value){

          direction = 0;

        }

      }
    );

    button.addEventListener(
      "pointerleave",
      () => {

        if(direction === value){

          direction = 0;

        }

      }
    );

  }

  holdButton(
    document.getElementById("left"),
    -1
  );

  holdButton(
    document.getElementById("right"),
    1
  );

  const nitroButton =
    document.getElementById("nitro");

  nitroButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      boosting = true;

    }
  );

  nitroButton.addEventListener(
    "pointerup",
    () => {

      boosting = false;

    }
  );

  nitroButton.addEventListener(
    "pointercancel",
    () => {

      boosting = false;

    }
  );

  nitroButton.addEventListener(
    "pointerleave",
    () => {

      boosting = false;

    }
  );

  /* KEYBOARD */

  window.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
      ){

        direction = -1;

      }

      if(
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
      ){

        direction = 1;

      }

      if(event.code === "Space"){

        boosting = true;

      }

    }
  );

  window.addEventListener(
    "keyup",
    event => {

      if(
        event.key === "ArrowLeft" ||
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "a" ||
        event.key.toLowerCase() === "d"
      ){

        direction = 0;

      }

      if(event.code === "Space"){

        boosting = false;

      }

    }
  );

  /* RESTART */

  document.getElementById("game")
    .addEventListener(
      "pointerdown",
      () => {

        if(ended){

          restartGame();

        }

      }
    );

  /* START */

  createObject("car");

  createObject("coin");

  createObject("coin");

  updateHUD();

  requestAnimationFrame(gameLoop);

})();
</script>

</body>
</html>
