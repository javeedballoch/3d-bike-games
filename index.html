<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mountain Highway Racing</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
margin:0;width:100%;height:100%;overflow:hidden;
background:#111;font-family:Arial,sans-serif;
touch-action:none
}

#game{
position:relative;width:100vw;height:100vh;
overflow:hidden
}

#bg{
position:absolute;inset:0;
background:
linear-gradient(#dceff533,#0004),
url("https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Mountain_highway_%28Unsplash%29.jpg/1280px-Mountain_highway_%28Unsplash%29.jpg")
center/cover no-repeat
}

#road{
position:absolute;
left:50%;
bottom:-5%;
width:63%;
height:78%;
transform:translateX(-50%);
background:linear-gradient(90deg,#20252a,#444a4e 50%,#20252a);
clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
box-shadow:0 0 35px #0009
}

#road:after{
content:"";
position:absolute;
left:50%;
top:0;
width:7px;
height:100%;
transform:translateX(-50%);
background:repeating-linear-gradient(
to bottom,
white 0 40px,
transparent 40px 82px
)
}

/* HUD */

#hud{
position:absolute;
top:18px;
left:14px;
right:14px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
z-index:50
}

.box{
background:#10212de8;
border:1px solid #ffffff55;
border-radius:15px;
padding:9px 2px;
text-align:center;
color:white;
box-shadow:0 5px 14px #0008
}

.box span{
display:block;
font-size:11px;
color:#bac7cc
}

.box b{
font-size:25px
}

#speed{
position:absolute;
top:145px;
width:100%;
text-align:center;
color:white;
font-size:34px;
font-weight:900;
text-shadow:0 3px 9px #000;
z-index:50
}

/* OBJECTS */

#objects{
position:absolute;
inset:0;
z-index:30;
pointer-events:none
}

.car,.coin{
position:absolute;
left:50%;
top:20%;
transform:translate(-50%,-50%)
}

.car{
width:55px;
height:95px;
border-radius:13px;
background:linear-gradient(
90deg,#1b1e21,#737a7f,#1b1e21
);
border:2px solid #111;
box-shadow:0 12px 18px #0009
}

.car:before{
content:"";
position:absolute;
left:7px;
right:7px;
top:13px;
height:32px;
border-radius:8px;
background:linear-gradient(#9dd0dc,#26373d);
border:2px solid #111
}

.car:after{
content:"";
position:absolute;
left:10px;
right:10px;
bottom:9px;
height:11px;
background:
linear-gradient(
90deg,
#f22 0 34%,
transparent 34% 66%,
#f22 66%
);
box-shadow:0 0 8px red
}

.coin{
width:30px;
height:30px;
border-radius:50%;
background:
radial-gradient(
circle,
#fff8a0,
#ffd21a 50%,
#ff8500 70%
);
border:4px solid #ffac00;
box-shadow:0 0 20px #ff9d00
}

/* BIKE */

#bike{
position:absolute;
left:50%;
bottom:150px;
width:145px;
height:235px;
transform:translateX(-50%);
z-index:40;
filter:drop-shadow(0 13px 10px #000b)
}

.wheel{
position:absolute;
left:50%;
width:43px;
height:76px;
transform:translateX(-50%);
border-radius:50%;
background:
radial-gradient(
circle,
#aaa 0 10%,
#111 12% 43%,
#555 45% 49%,
#070707 51%
);
border:5px solid #111
}

.front{top:2px}
.back{bottom:0}

.fork{
position:absolute;
left:50%;
top:47px;
width:9px;
height:82px;
background:linear-gradient(#aaa,#444);
border-radius:8px;
transform:translateX(-50%) rotate(7deg)
}

.handle{
position:absolute;
left:50%;
top:36px;
width:84px;
height:8px;
transform:translateX(-50%);
background:#111;
border-radius:8px
}

.head{
position:absolute;
left:50%;
top:11px;
width:26px;
height:32px;
transform:translateX(-50%);
background:#111;
border-radius:50%
}

.seat{
position:absolute;
left:50%;
top:49px;
width:58px;
height:36px;
transform:translateX(-50%);
background:#111;
border-radius:22px
}

.tank{
position:absolute;
left:50%;
top:67px;
width:91px;
height:72px;
transform:translateX(-50%);
background:
linear-gradient(
105deg,
#79000c,
#ff203c 50%,
#7e000d
);
border-radius:42px 42px 20px 20px;
box-shadow:
inset -10px -7px 13px #430006,
inset 8px 0 9px #ff5665
}

.body{
position:absolute;
left:50%;
top:101px;
width:80px;
height:99px;
transform:translateX(-50%);
background:
linear-gradient(
100deg,
#87000f,
#ff1737 50%,
#82000e
);
border-radius:30px 30px 20px 20px;
box-shadow:
inset -10px 0 12px #4b0007
}

.light{
position:absolute;
left:50%;
top:105px;
width:27px;
height:14px;
transform:translateX(-50%);
border-radius:50%;
background:#fff7a2;
box-shadow:0 0 14px #fff
}

/* NITRO */

#nitro{
position:absolute;
right:25px;
bottom:195px;
width:120px;
height:65px;
border:2px solid #ffbd67;
border-radius:20px;
background:
linear-gradient(#ff9c18,#f24d00);
color:white;
font-size:19px;
font-weight:900;
z-index:65;
box-shadow:0 5px 14px #0008
}

#nitroBar{
position:absolute;
right:25px;
bottom:180px;
width:120px;
height:9px;
background:#222;
border-radius:20px;
z-index:65;
overflow:hidden
}

#nitroFill{
height:100%;
width:100%;
background:linear-gradient(
90deg,#ff5c00,#ffd000
)
}

/* CONTROLS */

#controls{
position:absolute;
left:0;
right:0;
bottom:22px;
display:flex;
justify-content:space-between;
padding:0 28px;
z-index:60
}

.btn{
width:110px;
height:110px;
border-radius:50%;
border:3px solid white;
background:#081827e8;
color:white;
font-size:65px;
line-height:92px;
text-align:center
}

.btn:active,#nitro:active{
transform:scale(.94)
}

/* GAME OVER */

#over{
display:none;
position:absolute;
inset:0;
z-index:100;
background:#000b;
color:white;
text-align:center;
padding-top:42vh;
font-size:31px;
font-weight:900
}

#over small{
font-size:15px
}
</style>
</head>

<body>

<div id="game">

<div id="bg"></div>
<div id="road"></div>

<div id="hud">

<div class="box">
<span>SCORE</span>
<b id="score">0</b>
</div>

<div class="box">
<span>COINS</span>
<b id="coins">0</b>
</div>

<div class="box">
<span>LIVES</span>
<b id="lives">3</b>
</div>

<div class="box">
<span>BEST</span>
<b id="best">0</b>
</div>

</div>

<div id="speed">100 KM/H</div>

<div id="objects"></div>

<!-- BIKE -->

<div id="bike">

<div class="wheel front"></div>

<div class="wheel back"></div>

<div class="fork"></div>

<div class="handle"></div>

<div class="head"></div>

<div class="seat"></div>

<div class="tank"></div>

<div class="body"></div>

<div class="light"></div>

</div>

<!-- NITRO -->

<button id="nitro">NITRO</button>

<div id="nitroBar">
<div id="nitroFill"></div>
</div>

<!-- CONTROLS -->

<div id="controls">

<button id="left" class="btn">‹</button>

<button id="right" class="btn">›</button>

</div>

<div id="over">
GAME OVER
<br>
<small>Tap screen to restart</small>
</div>

</div>

<script>

(() => {

const objects=document.getElementById("objects");

const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const livesEl=document.getElementById("lives");
const bestEl=document.getElementById("best");
const speedEl=document.getElementById("speed");
const nitroFill=document.getElementById("nitroFill");
const over=document.getElementById("over");

let score=0;
let coins=0;
let lives=3;
let nitro=100;

let playerX=50;
let direction=0;
let boosting=false;
let ended=false;

let best=Number(
localStorage.getItem("mountainBest") || 0
);

let last=performance.now();
let carTimer=0;
let coinTimer=0;

let items=[];

bestEl.textContent=best;

function hud(){

scoreEl.textContent=Math.floor(score);

coinsEl.textContent=coins;

livesEl.textContent=lives;

bestEl.textContent=best;

speedEl.textContent=
(boosting && nitro>0 ? 190 : 100)
+" KM/H";

nitroFill.style.width=
Math.max(0,nitro)+"%";

}

function createObject(type){

const el=document.createElement("div");

el.className=type;

objects.appendChild(el);

items.push({

el:el,

type:type,

progress:0,

lane:(Math.random()-.5)*1.25,

hit:false

});

}

function gameOver(){

ended=true;

best=Math.max(
best,
Math.floor(score)
);

localStorage.setItem(
"mountainBest",
best
);

over.style.display="block";

hud();

}

function restart(){

items.forEach(item=>{
item.el.remove();
});

items=[];

score=0;
coins=0;
lives=3;
nitro=100;

playerX=50;
direction=0;
boosting=false;
ended=false;

over.style.display="none";

hud();

}

function update(dt){

if(ended)return;

const multiplier=
boosting && nitro>0
?1.85
:1;

if(boosting && nitro>0){

nitro-=40*dt;

}else{

nitro=Math.min(
100,
nitro+8*dt
);

}

playerX+=
direction*38*dt;

playerX=Math.max(
27,
Math.min(73,playerX)
);

score+=
dt*16*multiplier;

carTimer+=dt;
coinTimer+=dt;

if(carTimer>.9/multiplier){

carTimer=0;

createObject("car");

}

if(coinTimer>.7){

coinTimer=0;

createObject("coin");

}

items.forEach((item,index)=>{

item.progress+=
dt*(.25+.27*multiplier);

const p=item.progress;

const y=
18+p*77;

/*
 IMPORTANT:
 Objects stay inside road.
 They no longer reach the bike
 at the wrong screen position.
*/

const roadWidth=
3+p*28;

const xx=
50+item.lane*roadWidth;

const scale=
.22+p*1.2;

item.el.style.left=
xx+"%";

item.el.style.top=
y+"%";

item.el.style.transform=
"translate(-50%,-50%) scale("
+scale+
")";

if(
p>.89 &&
!item.hit &&
Math.abs(xx-playerX)<7
){

item.hit=true;

if(item.type==="coin"){

coins++;

score+=100;

nitro=Math.min(
100,
nitro+12
);

item.el.remove();

items.splice(index,1);

return;

}

if(item.type==="car"){

lives--;

score=Math.max(
0,
score-90
);

item.el.style.opacity=".2";

if(lives<=0){

gameOver();

}

}

}

if(p>1.07){

item.el.remove();

items.splice(index,1);

}

});

best=Math.max(
best,
Math.floor(score)
);

hud();

}

function loop(now){

const dt=Math.min(
.035,
(now-last)/1000
);

last=now;

update(dt);

requestAnimationFrame(loop);

}

/* MOBILE BUTTONS */

function holdButton(button,value){

button.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
direction=value;
}
);

["pointerup","pointercancel","pointerleave"]
.forEach(event=>{

button.addEventListener(
event,
e=>{
e.preventDefault();

if(direction===value){
direction=0;
}

}
);

});

}

holdButton(
document.getElementById("left"),
-1
);

holdButton(
document.getElementById("right"),
1
);

/* NITRO */

const nitroButton=
document.getElementById("nitro");

nitroButton.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
boosting=true;
}
);

["pointerup","pointercancel","pointerleave"]
.forEach(event=>{

nitroButton.addEventListener(
event,
()=>{
boosting=false;
}
);

});

/* KEYBOARD */

window.addEventListener(
"keydown",
e=>{

if(
e.key==="ArrowLeft" ||
e.key.toLowerCase()==="a"
){

direction=-1;

}

if(
e.key==="ArrowRight" ||
e.key.toLowerCase()==="d"
){

direction=1;

}

if(e.code==="Space"){

boosting=true;

}

});

window.addEventListener(
"keyup",
e=>{

if(
e.key==="ArrowLeft" ||
e.key==="ArrowRight" ||
e.key.toLowerCase()==="a" ||
e.key.toLowerCase()==="d"
){

direction=0;

}

if(e.code==="Space"){

boosting=false;

}

});

/* SWIPE */

let startX=0;

document.getElementById("game")
.addEventListener(
"touchstart",
e=>{

if(ended){

restart();

return;

}

if(e.touches[0]){

startX=
e.touches[0].clientX;

}

},
{passive:true}
);

document.getElementById("game")
.addEventListener(
"touchmove",
e=>{

if(
ended ||
!e.touches[0]
)return;

const dx=
e.touches[0].clientX-startX;

if(Math.abs(dx)>10){

direction=
dx>0 ? 1 : -1;

startX=
e.touches[0].clientX;

}

},
{passive:true}
);

document.getElementById("game")
.addEventListener(
"touchend",
()=>{
direction=0;
},
{passive:true}
);

/* START */

createObject("car");

createObject("coin");

createObject("coin");

hud();

requestAnimationFrame(loop);

})();

</script>

</body>
</html>
