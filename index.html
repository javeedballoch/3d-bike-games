<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mountain Bike Racer</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050b10;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    linear-gradient(#65c8ed 0 47%,#45b84d 47% 100%);
}

/* SKY */
.sky{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 15%,#fff 0 2%,transparent 3%),
    radial-gradient(circle at 70% 18%,#fff 0 1.5%,transparent 3%),
    linear-gradient(#55bde5,#a7e7f7 55%,#4ab94e 56%);
}

/* MOUNTAINS */
.mountains{
  position:absolute;
  top:16%;
  width:100%;
  height:40%;
  overflow:hidden;
}

.mountain{
  position:absolute;
  bottom:0;
  width:0;
  height:0;
  border-left:100px solid transparent;
  border-right:100px solid transparent;
  border-bottom:260px solid #527d91;
  filter:drop-shadow(8px 10px 5px #355564);
}

.mountain:after{
  content:"";
  position:absolute;
  left:-45px;
  top:0;
  width:0;
  height:0;
  border-left:45px solid transparent;
  border-right:45px solid transparent;
  border-bottom:90px solid #eafcff;
}

.m1{left:-70px;transform:scale(1.3)}
.m2{left:120px;transform:scale(.85)}
.m3{left:260px;transform:scale(1.2)}
.m4{left:430px;transform:scale(.8)}
.m5{right:40px;transform:scale(1.4)}
.m6{right:-160px;transform:scale(1.1)}

/* ROAD */
.road{
  position:absolute;
  left:50%;
  bottom:-10%;
  transform:translateX(-50%);
  width:92%;
  height:75%;
  background:
    linear-gradient(90deg,
      transparent 0 8%,
      #34383d 8% 92%,
      transparent 92%),
    #292d31;
  clip-path:polygon(34% 0,66% 0,100% 100%,0 100%);
  overflow:hidden;
}

.road:before,
.road:after{
  content:"";
  position:absolute;
  top:0;
  height:100%;
  width:8px;
  background:white;
}

.road:before{left:33%}
.road:after{right:33%}

/* MOVING ROAD LINES */
.line{
  position:absolute;
  width:7px;
  height:70px;
  background:white;
  left:50%;
  transform:translateX(-50%);
  animation:roadMove .55s linear infinite;
}

.line.l1{top:5%;animation-delay:0s}
.line.l2{top:25%;animation-delay:.12s}
.line.l3{top:45%;animation-delay:.24s}
.line.l4{top:65%;animation-delay:.36s}
.line.l5{top:85%;animation-delay:.48s}

@keyframes roadMove{
  from{transform:translate(-50%,-130px)}
  to{transform:translate(-50%,250px)}
}

/* SIDE TREES */
.tree{
  position:absolute;
  width:55px;
  height:100px;
  z-index:3;
}

.tree:before{
  content:"";
  position:absolute;
  left:22px;
  bottom:0;
  width:12px;
  height:40px;
  background:#70452d;
}

.tree:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:55px;
  height:70px;
  background:#087d35;
  clip-path:polygon(50% 0,100% 75%,72% 65%,88% 100%,12% 100%,28% 65%,0 75%);
}

.t1{left:3%;bottom:34%}
.t2{left:12%;bottom:47%;transform:scale(.7)}
.t3{right:4%;bottom:37%}
.t4{right:13%;bottom:50%;transform:scale(.75)}
.t5{left:1%;bottom:58%;transform:scale(.55)}
.t6{right:1%;bottom:62%;transform:scale(.55)}

/* HUD */
.hud{
  position:absolute;
  top:14px;
  left:2%;
  width:96%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  z-index:20;
}

.box{
  min-height:80px;
  border:3px solid #55d9ff;
  border-radius:20px;
  background:rgba(7,22,31,.88);
  color:white;
  text-align:center;
  padding:8px 3px;
  box-shadow:0 5px 18px #0008;
}

.box small{
  display:block;
  font-size:15px;
  margin-bottom:3px;
}

.box b{
  font-size:30px;
}

/* BIKE */
#bike{
  position:absolute;
  width:115px;
  height:210px;
  left:50%;
  bottom:7%;
  transform:translateX(-50%);
  z-index:15;
  transition:left .12s;
}

.bike-body{
  position:absolute;
  left:25px;
  bottom:20px;
  width:65px;
  height:125px;
  border-radius:45px 45px 28px 28px;
  background:
    linear-gradient(90deg,#800000,#f21d2e 45%,#9d0010);
  box-shadow:0 10px 25px #000b;
}

.bike-seat{
  position:absolute;
  left:33px;
  top:35px;
  width:50px;
  height:45px;
  border-radius:50%;
  background:#080c11;
}

.bike-rider{
  position:absolute;
  left:36px;
  top:5px;
  width:44px;
  height:65px;
  border-radius:50% 50% 35% 35%;
  background:#090d12;
}

.visor{
  position:absolute;
  top:28px;
  left:5px;
  width:34px;
  height:14px;
  border-radius:8px;
  background:#57dfff;
}

.wheel{
  position:absolute;
  left:44px;
  width:27px;
  height:55px;
  border-radius:50%;
  background:#090909;
  border:5px solid #30343a;
}

.wheel.front{top:-2px}
.wheel.back{bottom:-5px}

.handle{
  position:absolute;
  top:65px;
  left:8px;
  width:100px;
  height:8px;
  background:#aaa;
  border-radius:8px;
}

/* TRAFFIC */
.car{
  position:absolute;
  width:62px;
  height:105px;
  border-radius:15px;
  z-index:10;
  box-shadow:0 8px 15px #0009;
}

.car:before{
  content:"";
  position:absolute;
  top:13px;
  left:9px;
  width:44px;
  height:30px;
  border-radius:10px;
  background:#b9eafa;
}

.car:after{
  content:"";
  position:absolute;
  bottom:12px;
  left:10px;
  width:42px;
  height:9px;
  border-radius:5px;
  background:#111;
}

.red{background:#e50918}
.yellow{background:#f4d000}
.blue{background:#087de0}
.white{background:#eee}

/* COINS */
.coin{
  position:absolute;
  width:38px;
  height:38px;
  border-radius:50%;
  background:radial-gradient(circle,#ffe55b,#eaa900 65%,#a86b00);
  border:3px solid #ffd84b;
  box-shadow:0 0 22px #ffd000;
  z-index:11;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  animation:coinSpin .7s linear infinite;
}

@keyframes coinSpin{
  50%{transform:rotateY(180deg) scale(1.1)}
}

/* SPEED */
.speed{
  position:absolute;
  left:5%;
  bottom:15%;
  width:175px;
  height:175px;
  border-radius:50%;
  background:rgba(3,18,27,.94);
  border:10px solid #16d9ff;
  color:white;
  z-index:25;
  text-align:center;
  padding-top:25px;
  box-shadow:0 0 30px #00d9ff66;
}

.speed span{
  display:block;
  font-size:16px;
}

#speed{
  font-size:48px;
  font-weight:bold;
}

.speed small{
  font-size:15px;
}

/* NITRO */
#nitro{
  position:absolute;
  right:5%;
  bottom:16%;
  width:290px;
  max-width:43%;
  height:90px;
  border:none;
  border-radius:50px;
  background:linear-gradient(#ff8b22,#ff5000);
  color:white;
  font-size:30px;
  font-weight:bold;
  z-index:30;
  box-shadow:0 8px 25px #0008;
}

#nitro:active{
  transform:scale(.94);
}

/* CONTROLS */
.controls{
  position:absolute;
  left:5%;
  right:5%;
  bottom:2%;
  display:flex;
  justify-content:space-between;
  z-index:30;
}

.control{
  width:210px;
  max-width:38vw;
  height:105px;
  border:4px solid #9eeeff;
  border-radius:55px;
  background:rgba(5,16,25,.82);
  color:white;
  font-size:52px;
  box-shadow:0 5px 20px #0008;
}

.control:active{
  transform:scale(.94);
}

/* START / GAME OVER */
.overlay{
  position:absolute;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  text-align:center;
}

.overlay h1{
  font-size:42px;
  margin-bottom:15px;
}

.overlay p{
  font-size:20px;
  margin-bottom:25px;
}

#start{
  border:none;
  border-radius:40px;
  padding:18px 50px;
  background:#ff5b00;
  color:white;
  font-size:25px;
  font-weight:bold;
}

.hidden{display:none}

/* MOBILE */
@media(max-width:600px){
  .hud{gap:7px}
  .box{
    min-height:72px;
    border-radius:17px;
  }
  .box small{font-size:12px}
  .box b{font-size:25px}

  #bike{
    width:100px;
    height:190px;
  }

  .speed{
    width:165px;
    height:165px;
    bottom:16%;
  }

  #nitro{
    width:270px;
    height:85px;
    font-size:27px;
    bottom:17%;
  }

  .control{
    height:100px;
    font-size:45px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div class="sky"></div>

  <div class="mountains">
    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>
    <div class="mountain m4"></div>
    <div class="mountain m5"></div>
    <div class="mountain m6"></div>
  </div>

  <div class="tree t1"></div>
  <div class="tree t2"></div>
  <div class="tree t3"></div>
  <div class="tree t4"></div>
  <div class="tree t5"></div>
  <div class="tree t6"></div>

  <div class="road" id="road">
    <div class="line l1"></div>
    <div class="line l2"></div>
    <div class="line l3"></div>
    <div class="line l4"></div>
    <div class="line l5"></div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="box">
      <small>🏆 SCORE</small>
      <b id="score">0</b>
    </div>

    <div class="box">
      <small>❤️ LIVES</small>
      <b id="lives">3</b>
    </div>

    <div class="box">
      <small>🪙 COINS</small>
      <b id="coins">0</b>
    </div>

    <div class="box">
      <small>BEST</small>
      <b id="best">0</b>
    </div>
  </div>

  <!-- TRAFFIC -->
  <div id="traffic"></div>

  <!-- COINS -->
  <div id="coinLayer"></div>

  <!-- BIKE -->
  <div id="bike">

    <div class="wheel front"></div>
    <div class="wheel back"></div>

    <div class="bike-rider">
      <div class="visor"></div>
    </div>

    <div class="bike-body"></div>
    <div class="bike-seat"></div>
    <div class="handle"></div>

  </div>

  <!-- SPEED -->
  <div class="speed">
    <span>SPEED</span>
    <strong id="speed">100</strong>
    <small>KM/H</small>
  </div>

  <!-- NITRO -->
  <button id="nitro">🔥 NITRO</button>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="control" id="left">←</button>
    <button class="control" id="right">→</button>
  </div>

  <!-- START -->
  <div class="overlay" id="menu">
    <h1>🏍️ MOUNTAIN RACER</h1>
    <p>Collect coins • Avoid traffic • Use Nitro</p>
    <button id="start">START RACE</button>
  </div>

</div>

<script>

const game = document.getElementById("game");
const bike = document.getElementById("bike");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const coinsEl = document.getElementById("coins");
const bestEl = document.getElementById("best");
const speedEl = document.getElementById("speed");

const traffic = document.getElementById("traffic");
const coinLayer = document.getElementById("coinLayer");

const menu = document.getElementById("menu");
const startBtn = document.getElementById("start");
const nitroBtn = document.getElementById("nitro");

let running = false;

let score = 0;
let lives = 3;
let coins = 0;
let speed = 100;

let best = Number(localStorage.getItem("bikeBest") || 0);

let bikeX = 50;
let nitro = false;

let cars = [];
let coinObjects = [];

bestEl.textContent = best;

/* LANES */
const lanes = [35,50,65];

/* START GAME */
function startGame(){

  running = true;

  score = 0;
  lives = 3;
  coins = 0;
  speed = 100;

  bikeX = 50;

  cars.forEach(c => c.el.remove());
  coinObjects.forEach(c => c.el.remove());

  cars = [];
  coinObjects = [];

  menu.classList.add("hidden");

  updateHUD();

  for(let i=0;i<5;i++){
    createCar(-100 - i*180);
  }

  for(let i=0;i<5;i++){
    createCoin(-150 - i*230);
  }

  requestAnimationFrame(gameLoop);
}

/* CAR */
function createCar(y){

  const el = document.createElement("div");

  el.className =
    "car " +
    ["red","yellow","blue","white"]
    [Math.floor(Math.random()*4)];

  const lane =
    lanes[Math.floor(Math.random()*lanes.length)];

  el.style.left = lane + "%";
  el.style.top = y + "px";

  traffic.appendChild(el);

  cars.push({
    el:el,
    x:lane,
    y:y,
    hit:false
  });
}

/* COIN */
function createCoin(y){

  const el = document.createElement("div");

  el.className = "coin";
  el.textContent = "🪙";

  const lane =
    lanes[Math.floor(Math.random()*lanes.length)];

  el.style.left = `calc(${lane}% - 19px)`;
  el.style.top = y + "px";

  coinLayer.appendChild(el);

  coinObjects.push({
    el:el,
    x:lane,
    y:y,
    collected:false
  });
}

/* COLLISION */
function collision(a,b){

  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();

  return !(
    r1.right < r2.left ||
    r1.left > r2.right ||
    r1.bottom < r2.top ||
    r1.top > r2.bottom
  );
}

/* UPDATE HUD */
function updateHUD(){

  scoreEl.textContent = Math.floor(score);
  livesEl.textContent = lives;
  coinsEl.textContent = coins;
  bestEl.textContent = best;
  speedEl.textContent = Math.floor(speed);

}

/* GAME LOOP */
function gameLoop(){

  if(!running) return;

  const gameHeight = game.clientHeight;

  /* SPEED */
  let targetSpeed = 100 + score * .04;

  if(nitro){
    targetSpeed += 80;
  }

  speed += (targetSpeed-speed)*.03;

  if(speed > 220) speed=220;

  /* SCORE */
  score += nitro ? .28 : .14;

  /* CARS */
  cars.forEach(car => {

    car.y +=
      (nitro ? 11 : 6)
      + speed/90;

    car.el.style.top = car.y + "px";

    if(car.y > gameHeight + 150){

      car.y = -120 - Math.random()*300;

      car.x =
        lanes[Math.floor(Math.random()*lanes.length)];

      car.el.style.left =
        car.x + "%";

      car.hit = false;
    }

    if(!car.hit && collision(bike,car.el)){

      car.hit = true;

      lives--;

      score = Math.max(0,score-30);

      if(lives <= 0){

        gameOver();

      }
    }

  });

  /* COINS */
  coinObjects.forEach(c => {

    c.y += nitro ? 10 : 6;

    c.el.style.top = c.y + "px";

    if(c.y > gameHeight + 80){

      c.y = -100 - Math.random()*400;

      c.x =
        lanes[Math.floor(Math.random()*lanes.length)];

      c.el.style.left =
        `calc(${c.x}% - 19px)`;

      c.collected = false;
    }

    if(!c.collected && collision(bike,c.el)){

      c.collected = true;

      coins++;
      score += 25;

      c.y = -200;

      c.el.style.top = "-200px";
    }

  });

  /* BEST */
  if(score > best){

    best = Math.floor(score);

    localStorage.setItem(
      "bikeBest",
      best
    );
  }

  updateHUD();

  requestAnimationFrame(gameLoop);
}

/* GAME OVER */
function gameOver(){

  running = false;

  if(score > best){

    best = Math.floor(score);

    localStorage.setItem(
      "bikeBest",
      best
    );
  }

  menu.classList.remove("hidden");

  menu.querySelector("h1").textContent =
    "💥 GAME OVER";

  menu.querySelector("p").textContent =
    "Score: " +
    Math.floor(score) +
    "   Coins: " +
    coins;

  startBtn.textContent =
    "PLAY AGAIN";

  updateHUD();
}

/* BIKE MOVEMENT */
function moveLeft(){

  if(!running) return;

  bikeX -= 7;

  if(bikeX < 35)
    bikeX = 35;

  bike.style.left =
    bikeX + "%";
}

function moveRight(){

  if(!running) return;

  bikeX += 7;

  if(bikeX > 65)
    bikeX = 65;

  bike.style.left =
    bikeX + "%";
}

/* TOUCH */
document.getElementById("left")
.addEventListener("touchstart",e=>{
  e.preventDefault();
  moveLeft();
});

document.getElementById("right")
.addEventListener("touchstart",e=>{
  e.preventDefault();
  moveRight();
});

/* CLICK */
document.getElementById("left")
.addEventListener("click",moveLeft);
document.getElementById("right")
.addEventListener("click",moveRight);

/* KEYBOARD */
document.addEventListener("keydown",e=>{

  if(e.key === "ArrowLeft")
    moveLeft();

  if(e.key === "ArrowRight")
    moveRight();

  if(e.code === "Space"){
    nitro = true;
  }

});

document.addEventListener("keyup",e=>{

  if(e.code === "Space"){
    nitro = false;
  }

});

/* NITRO TOUCH */
nitroBtn.addEventListener("touchstart",e=>{
  e.preventDefault();
  nitro = true;
});

nitroBtn.addEventListener("touchend",e=>{
  e.preventDefault();
  nitro = false;
});

/* NITRO CLICK */
nitroBtn.addEventListener("mousedown",()=>{
  nitro=true;
});

nitroBtn.addEventListener("mouseup",()=>{
  nitro=false;
});

nitroBtn.addEventListener("mouseleave",()=>{
  nitro=false;
});

/* START */
startBtn.addEventListener("click",startGame);

</script>

</body>
</html>
