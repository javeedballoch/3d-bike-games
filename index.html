<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mountain Highway Bike 3D</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#72c9ed;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}

#hud{
 position:absolute;
 top:12px;
 left:2%;
 right:2%;
 z-index:20;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
}
.box{
 background:rgba(7,20,30,.9);
 border:3px solid #55dcff;
 border-radius:18px;
 color:white;
 text-align:center;
 padding:7px 2px;
 box-shadow:0 5px 18px #0009;
}
.box small{display:block;font-size:12px}
.box b{font-size:27px}

#speed{
 position:absolute;
 left:4%;
 bottom:15%;
 width:155px;
 height:155px;
 border-radius:50%;
 z-index:25;
 background:rgba(3,18,27,.94);
 border:9px solid #12d8ff;
 color:#fff;
 text-align:center;
 padding-top:25px;
 box-shadow:0 0 25px #00d9ff77;
}
#speed small{font-size:14px}
#speed strong{display:block;font-size:45px}
#speed span{font-size:15px}

#nitro{
 position:absolute;
 right:5%;
 bottom:18%;
 width:260px;
 max-width:42%;
 height:78px;
 border:3px solid #ffd05b;
 border-radius:45px;
 background:linear-gradient(#ff8d22,#f34c00);
 color:#fff;
 font-size:26px;
 font-weight:bold;
 z-index:30;
 box-shadow:0 7px 22px #0009;
}
#nitro:active{transform:scale(.94)}

.controls{
 position:absolute;
 left:5%;
 right:5%;
 bottom:3%;
 z-index:30;
 display:flex;
 justify-content:space-between;
}
.ctrl{
 width:190px;
 max-width:35vw;
 height:95px;
 border-radius:55px;
 border:4px solid #b9f3ff;
 background:rgba(4,17,27,.84);
 color:white;
 font-size:48px;
 box-shadow:0 5px 20px #0009;
}
.ctrl:active{transform:scale(.94)}

#menu{
 position:absolute;
 inset:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 background:rgba(0,0,0,.68);
 color:white;
 text-align:center;
}
#menu h1{font-size:34px;margin:0 0 12px}
#menu p{font-size:18px;margin:0 0 25px}
#start{
 border:0;
 border-radius:40px;
 padding:17px 45px;
 background:#ff5a00;
 color:white;
 font-size:23px;
 font-weight:bold;
}
.hide{display:none!important}

@media(max-width:600px){
 #hud{gap:5px}
 .box{border-radius:16px;padding:6px 1px}
 .box small{font-size:11px}
 .box b{font-size:24px}
 #speed{
   width:155px;
   height:155px;
   bottom:16%;
 }
 #nitro{
   bottom:18%;
   height:78px;
   font-size:25px;
 }
 .ctrl{
   height:95px;
   font-size:45px;
 }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
 <div class="box">
  <small>🏆 SCORE</small>
  <b id="score">0</b>
 </div>
 <div class="box">
  <small>❤️ LIVES</small>
  <b id="lives">3</b>
 </div>
 <div class="box">
  <small>🪙 COINS</small>
  <b id="coins">0</b>
 </div>
 <div class="box">
  <small>BEST</small>
  <b id="best">0</b>
 </div>
</div>

<div id="speed">
 <small>SPEED</small>
 <strong id="speedNum">0</strong>
 <span>KM/H</span>
</div>

<button id="nitro">🔥 NITRO</button>

<div class="controls">
 <button class="ctrl" id="left">←</button>
 <button class="ctrl" id="right">→</button>
</div>

<div id="menu">
 <h1 id="title">🏍️ MOUNTAIN HIGHWAY 3D</h1>
 <p id="message">
  Real 3D Highway Racing<br>
  Avoid traffic • Collect coins • Nitro
 </p>
 <button id="start">START RACE</button>
</div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene,camera,renderer;

let bike;
let traffic=[];
let coins3d=[];
let trees=[];
let roadLines=[];

let running=false;
let nitro=false;

let score=0;
let lives=3;
let coinCount=0;
let best=Number(localStorage.getItem("bike3DBest")||0);

let speed=90;
let targetSpeed=90;

let playerX=0;

const lanes=[-4,0,4];

const clock=new THREE.Clock();

/* HUD */
const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");
const coinsEl=document.getElementById("coins");
const bestEl=document.getElementById("best");
const speedEl=document.getElementById("speedNum");

bestEl.textContent=best;


/* ---------------- SCENE ---------------- */

scene=new THREE.Scene();

scene.background=new THREE.Color(0x72cbed);

scene.fog=new THREE.Fog(0x72cbed,55,260);


/* CAMERA */

camera=new THREE.PerspectiveCamera(
 62,
 innerWidth/innerHeight,
 .1,
 500
);

camera.position.set(0,5.5,13);
camera.lookAt(0,2,-60);


/* RENDERER */

renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.getElementById("game").appendChild(renderer.domElement);


/* LIGHT */

const hemi=new THREE.HemisphereLight(
 0xcceeff,
 0x405040,
 2.2
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
 0xffffff,
 3
);

sun.position.set(-40,70,40);
sun.castShadow=true;
scene.add(sun);


/* ---------------- MATERIALS ---------------- */

const roadMat=new THREE.MeshStandardMaterial({
 color:0x292d32,
 roughness:.95
});

const grassMat=new THREE.MeshStandardMaterial({
 color:0x35aa4b,
 roughness:1
});

const whiteMat=new THREE.MeshStandardMaterial({
 color:0xffffff
});

const mountainMat=new THREE.MeshStandardMaterial({
 color:0x5d8492,
 roughness:1
});

const snowMat=new THREE.MeshStandardMaterial({
 color:0xeafaff
});


/* ---------------- ROAD ---------------- */

const road=new THREE.Mesh(
 new THREE.PlaneGeometry(18,600),
 roadMat
);

road.rotation.x=-Math.PI/2;
road.position.y=-.05;
road.position.z=-130;
road.receiveShadow=true;

scene.add(road);


/* SIDE GRASS */

const grass1=new THREE.Mesh(
 new THREE.PlaneGeometry(70,600),
 grassMat
);

grass1.rotation.x=-Math.PI/2;
grass1.position.set(-44,-.08,-130);

scene.add(grass1);

const grass2=grass1.clone();
grass2.position.x=44;
scene.add(grass2);


/* ROAD EDGE */

function addRoadEdge(x){

 const edge=new THREE.Mesh(
  new THREE.BoxGeometry(.18,.04,600),
  whiteMat
 );

 edge.position.set(x,.03,-130);

 scene.add(edge);
}

addRoadEdge(-9);
addRoadEdge(9);


/* LANE LINES */

for(let z=0;z>-300;z-=12){

 for(let x of [-3,3]){

  const line=new THREE.Mesh(
   new THREE.BoxGeometry(.18,.05,6),
   whiteMat
  );

  line.position.set(x,.04,z);

  scene.add(line);
  roadLines.push(line);
 }
}


/* ---------------- MOUNTAINS ---------------- */

function mountain(x,z,s){

 const group=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.ConeGeometry(16*s,32*s,7),
  mountainMat
 );

 body.position.y=16*s;
 body.castShadow=true;

 group.add(body);

 const snow=new THREE.Mesh(
  new THREE.ConeGeometry(7*s,11*s,7),
  snowMat
 );

 snow.position.y=30*s;

 group.add(snow);

 group.position.set(x,0,z);

 scene.add(group);
}


/* BACKGROUND MOUNTAINS */

mountain(-35,-110,1.5);
mountain(0,-130,1.8);
mountain(35,-120,1.4);
mountain(-55,-175,1.3);
mountain(50,-180,1.7);
mountain(-15,-210,1.5);
mountain(25,-230,1.3);


/* ---------------- TREES ---------------- */

function createTree(x,z,scale=1){

 const g=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.5,3,8),
  new THREE.MeshStandardMaterial({color:0x70442b})
 );

 trunk.position.y=1.5;
 trunk.castShadow=true;

 g.add(trunk);

 for(let i=0;i<3;i++){

  const leaves=new THREE.Mesh(
   new THREE.ConeGeometry(
    2.8-i*.45,
    4,
    8
   ),
   new THREE.MeshStandardMaterial({
    color:0x087d38,
    roughness:1
   })
  );

  leaves.position.y=3+i*1.9;
  leaves.castShadow=true;

  g.add(leaves);
 }

 g.position.set(x,0,z);
 g.scale.setScalar(scale);

 scene.add(g);

 trees.push(g);
}


/* trees on both sides */

for(let i=0;i<45;i++){

 const z=-10-i*7-Math.random()*7;

 createTree(
  -12-Math.random()*13,
  z,
  .65+Math.random()*.8
 );

 createTree(
  12+Math.random()*13,
  z-3,
  .65+Math.random()*.8
 );
}


/* ---------------- BIKE ---------------- */

function createBike(){

 const g=new THREE.Group();

 /* rear wheel */

 const wheelMat=new THREE.MeshStandardMaterial({
  color:0x080808,
  roughness:.8
 });

 const wheel1=new THREE.Mesh(
  new THREE.CylinderGeometry(1.05,1.05,.55,24),
  wheelMat
 );

 wheel1.rotation.z=Math.PI/2;
 wheel1.position.z=1.7;
 wheel1.position.y=1;

 wheel1.castShadow=true;
 g.add(wheel1);


 /* front wheel */

 const wheel2=wheel1.clone();

 wheel2.position.z=-1.7;

 g.add(wheel2);


 /* red body */

 const body=new THREE.Mesh(
  new THREE.SphereGeometry(1.25,24,16),
  new THREE.MeshStandardMaterial({
   color:0xd7192a,
   metalness:.25,
   roughness:.3
  })
 );

 body.scale.set(.72,.8,1.7);
 body.position.y=1.55;

 body.castShadow=true;

 g.add(body);


 /* seat */

 const seat=new THREE.Mesh(
  new THREE.BoxGeometry(1.05,.3,1.8),
  new THREE.MeshStandardMaterial({
   color:0x090b0e,
   roughness:.5
  })
 );

 seat.position.set(0,2.15,.25);
 seat.rotation.x=-.08;

 g.add(seat);


 /* fuel tank */

 const tank=new THREE.Mesh(
  new THREE.SphereGeometry(1,20,12),
  new THREE.MeshStandardMaterial({
   color:0xef233c,
   metalness:.35,
   roughness:.28
  })
 );

 tank.scale.set(.7,.55,.9);
 tank.position.set(0,2.3,-.35);

 g.add(tank);


 /* rider */

 const rider=new THREE.Mesh(
  new THREE.SphereGeometry(.75,20,16),
  new THREE.MeshStandardMaterial({
   color:0x080b10,
   roughness:.7
  })
 );

 rider.scale.set(.8,1.25,.7);
 rider.position.set(0,3.2,.4);

 g.add(rider);


 /* helmet visor */

 const visor=new THREE.Mesh(
  new THREE.BoxGeometry(.7,.25,.08),
  new THREE.MeshStandardMaterial({
   color:0x63e1ff,
   metalness:.4,
   roughness:.2
  })
 );

 visor.position.set(0,3.35,-.3);

 g.add(visor);


 /* handle */

 const handle=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,.15,.15),
  new THREE.MeshStandardMaterial({
   color:0x999999,
   metalness:.8
  })
 );

 handle.position.set(0,2.6,-1.25);

 g.add(handle);


 /* exhaust */

 const exhaust=new THREE.Mesh(
  new THREE.CylinderGeometry(.13,.18,1.5,12),
  new THREE.MeshStandardMaterial({
   color:0x999999,
   metalness:.8
  })
 );

 exhaust.rotation.z=Math.PI/2;
 exhaust.position.set(.7,1.2,1.35);

 g.add(exhaust);


 g.scale.setScalar(1.15);

 g.position.set(0,0,8);

 scene.add(g);

 return g;
}

bike=createBike();


/* ---------------- TRAFFIC CAR ---------------- */

function createCar(){

 const g=new THREE.Group();

 const colors=[
  0xe31b23,
  0x087be5,
  0xf2c300,
  0xffffff,
  0x151a20
 ];

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(2.7,1.2,5),
  new THREE.MeshStandardMaterial({
   color:colors[Math.floor(Math.random()*colors.length)],
   metalness:.15,
   roughness:.35
  })
 );

 body.position.y=.85;
 body.castShadow=true;

 g.add(body);


 /* windows */

 const glass=new THREE.Mesh(
  new THREE.BoxGeometry(2.15,.65,1.8),
  new THREE.MeshStandardMaterial({
   color:0x9eddf2,
   metalness:.1,
   roughness:.2
  })
 );

 glass.position.set(0,1.6,-.35);

 g.add(glass);


 /* wheels */

 for(let x of [-1.45,1.45]){

  for(let z of [-1.55,1.55]){

   const w=new THREE.Mesh(
    new THREE.CylinderGeometry(.48,.48,.35,16),
    new THREE.MeshStandardMaterial({
     color:0x080808
    })
   );

   w.rotation.z=Math.PI/2;
   w.position.set(x,.45,z);

   g.add(w);
  }
 }


 g.scale.setScalar(.9);

 g.position.set(
  lanes[Math.floor(Math.random()*3)],
 0,
 -50-Math.random()*130
 );

 scene.add(g);

 traffic.push(g);
}


/* ---------------- COIN ---------------- */

function createCoin(){

 const coin=new THREE.Mesh(
  new THREE.CylinderGeometry(.6,.6,.18,32),
  new THREE.MeshStandardMaterial({
   color:0xffc400,
   metalness:.75,
   roughness:.2,
   emissive:0x5c3d00
  })
 );

 coin.rotation.x=Math.PI/2;

 coin.position.set(
  lanes[Math.floor(Math.random()*3)],
 1.4,
 -45-Math.random()*160
 );

 scene.add(coin);
 coins3d.push(coin);
}


/* initial traffic */

for(let i=0;i<10;i++) createCar();

for(let i=0;i<14;i++) createCoin();


/* ---------------- CONTROLS ---------------- */

function leftMove(){

 if(!running)return;

 playerX-=2.5;

 if(playerX<-5)
  playerX=-5;
}

function rightMove(){

 if(!running)return;

 playerX+=2.5;

 if(playerX>5)
  playerX=5;
}

document.getElementById("left").addEventListener("pointerdown",e=>{
 e.preventDefault();
 leftMove();
});

document.getElementById("right").addEventListener("pointerdown",e=>{
 e.preventDefault();
 rightMove();
});


/* keyboard */

document.addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft"||e.key==="a")
  leftMove();

 if(e.key==="ArrowRight"||e.key==="d")
  rightMove();

 if(e.code==="Space")
  nitro=true;
});

document.addEventListener("keyup",e=>{

 if(e.code==="Space")
  nitro=false;
});


/* swipe */

let touchX=null;

renderer.domElement.addEventListener("touchstart",e=>{
 touchX=e.touches[0].clientX;
},{passive:true});

renderer.domElement.addEventListener("touchmove",e=>{

 if(touchX===null)return;

 const x=e.touches[0].clientX;
 const diff=x-touchX;

 if(Math.abs(diff)>15){

  if(diff>0)
   rightMove();
  else
   leftMove();

  touchX=x;
 }

},{passive:true});

renderer.domElement.addEventListener("touchend",()=>{
 touchX=null;
});


/* NITRO */

const nitroBtn=document.getElementById("nitro");

nitroBtn.addEventListener("pointerdown",e=>{
 e.preventDefault();
 nitro=true;
});

nitroBtn.addEventListener("pointerup",()=>{
 nitro=false;
});

nitroBtn.addEventListener("pointercancel",()=>{
 nitro=false;
});

nitroBtn.addEventListener("pointerleave",()=>{
 nitro=false;
});


/* ---------------- COLLISION ---------------- */

function checkCollision(a,b){

 const dx=a.position.x-b.position.x;
 const dz=a.position.z-b.position.z;

 return Math.abs(dx)<2.1 &&
        Math.abs(dz)<3.2;
}


/* ---------------- HUD ---------------- */

function updateHUD(){

 scoreEl.textContent=Math.floor(score);
 livesEl.textContent=lives;
 coinsEl.textContent=coinCount;
 bestEl.textContent=best;
 speedEl.textContent=Math.floor(speed);

}


/* ---------------- START ---------------- */

function startGame(){

 running=true;

 score=0;
 lives=3;
 coinCount=0;

 speed=90;
 targetSpeed=90;

 playerX=0;
 bike.position.x=0;

 traffic.forEach((car,i)=>{
  car.position.z=-40-i*28-Math.random()*25;
  car.position.x=lanes[Math.floor(Math.random()*3)];
 });

 coins3d.forEach((coin,i)=>{
  coin.position.z=-30-i*25-Math.random()*30;
  coin.position.x=lanes[Math.floor(Math.random()*3)];
 });

 document.getElementById("menu").classList.add("hide");

 updateHUD();

 clock.start();

 animate();
}


/* ---------------- GAME OVER ---------------- */

function gameOver(){

 running=false;

 if(score>best){

  best=Math.floor(score);

  localStorage.setItem(
   "bike3DBest",
   best
  );
 }

 document.getElementById("title").textContent=
  "💥 GAME OVER";

 document.getElementById("message").innerHTML=
  "Score: "+Math.floor(score)+
  "<br>Coins: "+coinCount+
  "<br>Best: "+best;

 document.getElementById("start").textContent=
  "🏍️ PLAY AGAIN";

 document.getElementById("menu").classList.remove("hide");

 updateHUD();
}


/* ---------------- ANIMATION ---------------- */

function animate(){

 if(!running)return;

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.05);

 /* speed */

 targetSpeed=
   nitro ? 190 : 105;

 speed+=(targetSpeed-speed)*dt*2;

 /* score */

 score+=dt*(nitro?1.2:.55);

 /* bike */

 bike.position.x+=(playerX-bike.position.x)*dt*8;

 bike.rotation.z+=(-
   (playerX-bike.position.x)*.035
   -bike.rotation.z
  )*dt*8;


 /* camera follows bike */

 camera.position.x=
   bike.position.x*.25;

 camera.position.y=
   5.5;

 camera.lookAt(
   bike.position.x*.15,
   1.8,
   -65
 );


 /* road movement */

 const movement=
   dt*(nitro?48:26);

 roadLines.forEach(line=>{

  line.position.z+=movement;

  if(line.position.z>15)
   line.position.z-=300;
 });


 /* trees */

 trees.forEach(tree=>{

  tree.position.z+=movement*.9;

  if(tree.position.z>25)
   tree.position.z=-300;
 });


 /* traffic */

 traffic.forEach(car=>{

  car.position.z+=movement;

  if(car.position.z>25){

   car.position.z=
    -180-Math.random()*100;

   car.position.x=
    lanes[Math.floor(Math.random()*3)];
  }

  if(checkCollision(bike,car)){

   car.position.z=-220;

   lives--;

   score=Math.max(0,score-35);

   speed=70;

   if(lives<=0){

    gameOver();
    return;
   }
  }

 });


 /* coins */

 coins3d.forEach(coin=>{

  coin.position.z+=movement;

  coin.rotation.y+=dt*6;

  if(coin.position.z>20){

   coin.position.z=
    -170-Math.random()*130;

   coin.position.x=
    lanes[Math.floor(Math.random()*3)];
  }

  if(checkCollision(bike,coin)){

   coinCount++;
   score+=30;

   coin.position.z=-220;
  }

 });


 /* best */

 if(score>best){

  best=Math.floor(score);

  localStorage.setItem(
   "bike3DBest",
   best
  );
 }


 updateHUD();

 renderer.render(scene,camera);
}


/* START BUTTON */

document.getElementById("start")
.addEventListener("click",startGame);


/* RESIZE */

window.addEventListener("resize",()=>{

 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight
);

});


/* INITIAL RENDER */

renderer.render(scene,camera);

</script>

</body>
</html>
