<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mountain Highway 3D</title>

<style>
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#101820;
 font-family:Arial,sans-serif;
 touch-action:none;
}
canvas{
 display:block;
}
#hud{
 position:fixed;
 top:12px;
 left:8px;
 right:8px;
 z-index:5;
 display:flex;
 justify-content:space-between;
 gap:5px;
}
.box{
 min-width:65px;
 padding:7px 8px;
 text-align:center;
 color:white;
 background:rgba(8,18,25,.78);
 border:1px solid #70818a;
 border-radius:10px;
 box-shadow:0 3px 10px #0008;
}
.box small{
 display:block;
 font-size:9px;
 color:#b9c7ce;
}
.box b{
 font-size:17px;
}
#speed{
 position:fixed;
 top:82px;
 left:50%;
 transform:translateX(-50%);
 color:white;
 font-size:20px;
 font-weight:bold;
 text-shadow:0 3px 6px #000;
 z-index:5;
}
.controls{
 position:fixed;
 left:0;
 right:0;
 bottom:18px;
 z-index:10;
 display:flex;
 justify-content:space-between;
 padding:0 25px;
}
button{
 touch-action:none;
}
.steer{
 width:88px;
 height:88px;
 border-radius:50%;
 border:2px solid #dbe4e8;
 background:#0c151dcc;
 color:white;
 font-size:50px;
}
#nitro{
 position:fixed;
 right:35px;
 bottom:120px;
 z-index:10;
 width:85px;
 height:85px;
 border:0;
 border-radius:50%;
 background:linear-gradient(#ff921e,#df3000);
 color:white;
 font-weight:bold;
 box-shadow:0 0 25px #ff4c0088;
}
#start{
 position:fixed;
 inset:0;
 z-index:20;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#0008;
}
.panel{
 width:85%;
 max-width:330px;
 padding:25px;
 text-align:center;
 color:white;
 border-radius:18px;
 background:#071119ed;
 border:1px solid #ffffff33;
}
.panel h1{
 margin:0 0 10px;
}
.panel p{
 color:#cbd6db;
 font-size:14px;
}
#startBtn{
 padding:14px 30px;
 border:0;
 border-radius:12px;
 background:#e53935;
 color:white;
 font-weight:bold;
 font-size:18px;
}
.hide{
 display:none!important;
}
</style>
</head>

<body>

<div id="hud">
 <div class="box"><small>SCORE</small><b id="score">0</b></div>
 <div class="box"><small>COINS</small><b id="coins">0</b></div>
 <div class="box"><small>LIVES</small><b id="lives">3</b></div>
 <div class="box"><small>BEST</small><b id="best">0</b></div>
</div>

<div id="speed">0 KM/H</div>

<div class="controls">
 <button class="steer" id="left">‹</button>
 <button class="steer" id="right">›</button>
</div>

<button id="nitro">NITRO</button>

<div id="start">
 <div class="panel">
  <h1>🏍️ Mountain Highway 3D</h1>
  <p>
   Real 3D mountain road racing.<br>
   Avoid traffic and collect coins.
  </p>
  <button id="startBtn">START RACE</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene,camera,renderer;
let bike;
let road=[];
let traffic=[];
let coins=[];
let scenery=[];

let running=false;
let playerX=0;
let score=0;
let coinCount=0;
let lives=3;
let best=Number(localStorage.getItem("mhr3dBest")||0);

let nitro=false;
let left=false;
let right=false;

const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const livesEl=document.getElementById("lives");
const bestEl=document.getElementById("best");
const speedEl=document.getElementById("speed");

bestEl.textContent=best;

/* ---------------- SCENE ---------------- */

scene=new THREE.Scene();

scene.fog=new THREE.Fog(0x9db9c8,45,220);

camera=new THREE.PerspectiveCamera(
 60,
 innerWidth/innerHeight,
 .1,
 500
);

camera.position.set(0,4.4,10);
camera.lookAt(0,1,-35);

renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);

/* LIGHT */

const hemi=new THREE.HemisphereLight(
 0xbfe3ff,
 0x263020,
 2
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
 0xffffff,
 3
);

sun.position.set(-30,50,20);
sun.castShadow=true;

scene.add(sun);

/* SKY */

const skyGeo=new THREE.SphereGeometry(240,32,16);

const skyMat=new THREE.MeshBasicMaterial({
 color:0x82acc3,
 side:THREE.BackSide
});

scene.add(
 new THREE.Mesh(skyGeo,skyMat)
);

/* MOUNTAINS */

function mountain(x,z,s){

 const geo=new THREE.ConeGeometry(
  18*s,
  32*s,
  6
 );

 const mat=new THREE.MeshStandardMaterial({
  color:0x536b72,
  roughness:1
 });

 const m=new THREE.Mesh(geo,mat);

 m.position.set(x,10*s,z);
 m.rotation.y=Math.random();

 scene.add(m);

 const snowGeo=new THREE.ConeGeometry(
  7*s,
  10*s,
  6
 );

 const snowMat=new THREE.MeshStandardMaterial({
  color:0xf0f4f2
 });

 const snow=new THREE.Mesh(snowGeo,snowMat);

 snow.position.set(x,25*s,z);
 snow.rotation.y=m.rotation.y;

 scene.add(snow);
}

for(let i=0;i<14;i++){

 mountain(
  (i%2?1:-1)*(25+Math.random()*25),
  -40-i*22,
  .8+Math.random()*.7
 );
}

/* ROAD */

const roadMat=new THREE.MeshStandardMaterial({
 color:0x292d31,
 roughness:.9
});

for(let i=0;i<35;i++){

 const g=new THREE.BoxGeometry(
  13,.25,12
 );

 const r=new THREE.Mesh(g,roadMat);

 r.position.set(0,-.15,-i*12);

 r.receiveShadow=true;

 scene.add(r);

 road.push(r);

 /* LANE MARK */

 const lineGeo=new THREE.BoxGeometry(
  .18,.04,4
 );

 const lineMat=new THREE.MeshBasicMaterial({
  color:0xffffff
 });

 const line=new THREE.Mesh(
  lineGeo,lineMat
 );

 line.position.set(0,.02,-i*12-2);

 scene.add(line);
}

/* GRASS */

const grassMat=new THREE.MeshStandardMaterial({
 color:0x345d39
});

for(let i=0;i<35;i++){

 for(const side of [-1,1]){

  const g=new THREE.BoxGeometry(
   25,.3,12
  );

  const grass=new THREE.Mesh(g,grassMat);

  grass.position.set(
   side*19,
   -.2,
   -i*12
  );

  scene.add(grass);
 }
}

/* TREES */

function tree(x,z){

 const group=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.22,.3,2.2,7),
  new THREE.MeshStandardMaterial({color:0x60402a})
 );

 trunk.position.y=1.1;

 group.add(trunk);

 const crown=new THREE.Mesh(
  new THREE.ConeGeometry(1.3,3.2,8),
  new THREE.MeshStandardMaterial({color:0x194b29})
 );

 crown.position.y=3;

 group.add(crown);

 group.position.set(x,0,z);

 scene.add(group);

 scenery.push(group);
}

for(let i=0;i<45;i++){

 tree(
  (Math.random()>.5?1:-1)*
  (8+Math.random()*10),
  -20-Math.random()*390
 );
}

/* GUARD RAILS */

const railMat=new THREE.MeshStandardMaterial({
 color:0xbcc4c7,
 metalness:.7,
 roughness:.35
});

for(let i=0;i<35;i++){

 for(const side of [-1,1]){

  const rail=new THREE.Mesh(
   new THREE.BoxGeometry(.18,.45,12),
   railMat
  );

  rail.position.set(
   side*6.8,
   .65,
   -i*12
  );

  scene.add(rail);
 }
}

/* ---------------- BIKE ---------------- */

function makeBike(){

 const group=new THREE.Group();

 const red=new THREE.MeshStandardMaterial({
  color:0xd80018,
  metalness:.4,
  roughness:.3
 });

 const black=new THREE.MeshStandardMaterial({
  color:0x101214,
  metalness:.5,
  roughness:.25
 });

 const tire=new THREE.MeshStandardMaterial({
  color:0x050505,
  roughness:.9
 });

 /* wheels */

 for(const z of [1.7,-1.4]){

  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(
    .43,.43,.22,24
   ),
   tire
  );

  wheel.rotation.z=Math.PI/2;
  wheel.position.z=z;
  wheel.position.y=.48;

  wheel.castShadow=true;

  group.add(wheel);
 }

 /* body */

 const body=new THREE.Mesh(
  new THREE.SphereGeometry(
   .78,24,16
  ),
  red
 );

 body.scale.set(.75,.65,1.35);
 body.position.y=1.05;
 body.position.z=.05;

 body.castShadow=true;

 group.add(body);

 /* fuel tank */

 const tank=new THREE.Mesh(
  new THREE.SphereGeometry(.55,24,16),
  red
 );

 tank.scale.set(.9,.55,1.1);
 tank.position.set(0,1.45,.45);

 group.add(tank);

 /* seat */

 const seat=new THREE.Mesh(
  new THREE.BoxGeometry(.65,.18,1.25),
  black
 );

 seat.position.set(0,1.42,-.55);

 group.add(seat);

 /* handle */

 const handle=new THREE.Mesh(
  new THREE.CylinderGeometry(.055,.055,1.6,12),
  black
 );

 handle.rotation.z=Math.PI/2;
 handle.position.set(0,1.72,.85);

 group.add(handle);

 /* rider */

 const rider=new THREE.Mesh(
  new THREE.SphereGeometry(.38,20,16),
  black
 );

 rider.position.set(0,2.05,-.25);
 rider.scale.y=1.25;

 group.add(rider);

 /* helmet */

 const helmet=new THREE.Mesh(
  new THREE.SphereGeometry(.3,20,16),
  black
 );

 helmet.position.set(0,2.55,-.25);

 group.add(helmet);

 /* headlight */

 const light=new THREE.Mesh(
  new THREE.SphereGeometry(.13,16,12),
  new THREE.MeshBasicMaterial({
   color:0xffffaa
  })
 );

 light.position.set(0,1.42,1.35);

 group.add(light);

 group.position.set(0,.1,4);

 return group;
}

bike=makeBike();

scene.add(bike);

/* ---------------- TRAFFIC ---------------- */

function makeCar(){

 const group=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(1.35,.7,2.4),
  new THREE.MeshStandardMaterial({
   color:[
    0xc62828,
    0xeeeeee,
    0x1976d2,
    0x252525
   ][Math.floor(Math.random()*4)],
   metalness:.25,
   roughness:.35
  })
 );

 body.position.y=.55;
 body.castShadow=true;

 group.add(body);

 const glass=new THREE.Mesh(
  new THREE.BoxGeometry(.95,.35,.8),
  new THREE.MeshStandardMaterial({
   color:0x182d36,
   metalness:.3,
   roughness:.2
  })
 );

 glass.position.set(0,.98,-.25);

 group.add(glass);

 group.position.y=.05;

 scene.add(group);

 traffic.push({
  mesh:group,
  x:0,
  z:-170-Math.random()*100
 });

}

function spawnTraffic(){

 const lanes=[-3,0,3];

 makeCar();

 const c=traffic[traffic.length-1];

 c.x=lanes[
  Math.floor(Math.random()*lanes.length)
 ];

 c.mesh.position.set(
  c.x,
  .05,
  c.z
 );
}

/* ---------------- COINS ---------------- */

function spawnCoin(){

 const geo=new THREE.TorusGeometry(
  .38,.11,12,24
 );

 const mat=new THREE.MeshStandardMaterial({
  color:0xffd21c,
  emissive:0xffa500,
  emissiveIntensity:.5,
  metalness:.7
 });

 const c=new THREE.Mesh(geo,mat);

 const lanes=[-3,0,3];

 c.position.set(
  lanes[Math.floor(Math.random()*3)],
  1.1,
  -150-Math.random()*100
 );

 scene.add(c);

 coins.push(c);
}

/* ---------------- GAME ---------------- */

let lastTime=0;
let trafficTimer=0;
let coinTimer=0;

function update(time){

 if(!running)return;

 const dt=Math.min(
  .04,
  (time-lastTime)/1000
 );

 lastTime=time;

 const boost=nitro?2.0:1;

 /* PLAYER */

 if(left)playerX-=dt*7;
 if(right)playerX+=dt*7;

 playerX=THREE.MathUtils.clamp(
  playerX,-4.1,4.1
 );

 bike.position.x=THREE.MathUtils.lerp(
  bike.position.x,
  playerX,
  .12
 );

 bike.rotation.z=THREE.MathUtils.lerp(
  bike.rotation.z,
  (right?.15:0)+(left?-.15:0),
  .12
 );

 /* WORLD */

 road.forEach(r=>{
  r.position.z+=dt*35*boost;

  if(r.position.z>12)
   r.position.z-=420;
 });

 scenery.forEach(t=>{
  t.position.z+=dt*35*boost;

  if(t.position.z>15)
   t.position.z-=430;
 });

 traffic.forEach(c=>{

  c.mesh.position.z+=
   dt*35*boost;

  if(c.mesh.position.z>8){

   c.mesh.position.z=
    -220-Math.random()*100;

   c.x=[-3,0,3][
    Math.floor(Math.random()*3)
   ];

   c.mesh.position.x=c.x;
  }

  /* collision */

  if(
   Math.abs(c.mesh.position.x-bike.position.x)<1.15 &&
   Math.abs(c.mesh.position.z-bike.position.z)<1.7
  ){

   c.mesh.position.z=-300;

   lives--;

   livesEl.textContent=lives;

   bike.rotation.z=.25;

   setTimeout(()=>{
    bike.rotation.z=0;
   },180);

   if(lives<=0)
    endGame();
  }
 });

 coins.forEach(c=>{

  c.position.z+=dt*35*boost;
  c.rotation.y+=dt*5;

  if(c.position.z>8)
   c.position.z=-300;

  if(
   Math.abs(c.position.x-bike.position.x)<1 &&
   Math.abs(c.position.z-bike.position.z)<1.7
  ){

   c.position.z=-300;

   coinCount++;
   score+=250;

   coinsEl.textContent=coinCount;
  }
 });

 trafficTimer-=dt*boost;
 coinTimer-=dt*boost;

 if(trafficTimer<=0){
  spawnTraffic();
  trafficTimer=.9;
 }

 if(coinTimer<=0){
  spawnCoin();
  coinTimer=.65;
 }

 score+=dt*100*boost;

 scoreEl.textContent=Math.floor(score);

 speedEl.textContent=
  Math.floor(105*boost)+" KM/H";

 /* CAMERA */

 camera.position.x=
  THREE.MathUtils.lerp(
   camera.position.x,
   playerX*.35,
   .05
  );

 camera.lookAt(
  playerX*.25,
  1.2,
  -35
 );

 renderer.render(scene,camera);

 requestAnimationFrame(update);
}

function startGame(){

 score=0;
 coinCount=0;
 lives=3;
 playerX=0;

 scoreEl.textContent=0;
 coinsEl.textContent=0;
 livesEl.textContent=3;

 traffic.forEach(c=>{
  c.mesh.position.z=-500;
 });

 coins.forEach(c=>{
  c.position.z=-500;
 });

 running=true;

 document
  .getElementById("start")
  .classList.add("hide");

 lastTime=performance.now();

 requestAnimationFrame(update);
}

function endGame(){

 running=false;

 best=Math.max(
  best,
  Math.floor(score)
 );

 localStorage.setItem(
  "mhr3dBest",
  best
 );

 bestEl.textContent=best;

 document.querySelector(".panel h1")
  .textContent="🏁 GAME OVER";

 document.querySelector(".panel p")
  .innerHTML=
   "Score: "+Math.floor(score)+
   "<br>Coins: "+coinCount;

 document.getElementById("startBtn")
  .textContent="PLAY AGAIN";

 document.getElementById("start")
  .classList.remove("hide");
}

/* CONTROLS */

document.getElementById("left")
 .addEventListener("pointerdown",()=>{
  left=true;
 });

document.getElementById("left")
 .addEventListener("pointerup",()=>{
  left=false;
 });

document.getElementById("right")
 .addEventListener("pointerdown",()=>{
  right=true;
 });

document.getElementById("right")
 .addEventListener("pointerup",()=>{
  right=false;
 });

const nitroBtn=document.getElementById("nitro");

nitroBtn.addEventListener(
 "pointerdown",()=>{
  nitro=true;
 });

nitroBtn.addEventListener(
 "pointerup",()=>{
  nitro=false;
 });

nitroBtn.addEventListener(
 "pointercancel",()=>{
  nitro=false;
 });

document.addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft"||e.key==="a")
  left=true;

 if(e.key==="ArrowRight"||e.key==="d")
  right=true;

 if(e.code==="Space")
  nitro=true;
});

document.addEventListener("keyup",e=>{

 if(e.key==="ArrowLeft"||e.key==="a")
  left=false;

 if(e.key==="ArrowRight"||e.key==="d")
  right=false;

 if(e.code==="Space")
  nitro=false;
});

document.getElementById("startBtn")
 .onclick=startGame;

/* RESIZE */

window.addEventListener("resize",()=>{

 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight
 );
});

/* START RENDER */

renderer.render(scene,camera);

</script>
</body>
</html>
