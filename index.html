<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mountain Highway Bike Racing</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06131d;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#5fc4e7 0 38%,#55bd72 38% 100%)}
.sky{position:absolute;inset:0 0 35%;background:
radial-gradient(circle at 18% 20%,#fff9 0 2%,transparent 3%),
radial-gradient(circle at 72% 14%,#fff8 0 2%,transparent 3%),
linear-gradient(#4db9e5,#b8eaff)}
.mountain{position:absolute;bottom:34%;width:0;height:0;border-left:100px solid transparent;border-right:100px solid transparent;border-bottom:260px solid #527c8d;filter:drop-shadow(8px 5px 4px #234)}
.mountain:after{content:"";position:absolute;left:-65px;top:0;border-left:65px solid transparent;border-right:65px solid transparent;border-bottom:100px solid #efffff}
.m1{left:3%;transform:scale(1.1)}.m2{left:25%;transform:scale(1.4)}.m3{left:48%;transform:scale(1.7)}.m4{right:2%;transform:scale(1.25)}
.trees{position:absolute;inset:28% 0 0;pointer-events:none}
.tree{position:absolute;bottom:10%;width:0;height:0;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:105px solid #087b39;filter:drop-shadow(4px 5px 3px #064d2b)}
.tree:after{content:"";position:absolute;left:-25px;top:42px;border-left:25px solid transparent;border-right:25px solid transparent;border-bottom:70px solid #099d49}
.t1{left:5%;transform:scale(1.4)}.t2{left:17%;bottom:18%}.t3{right:8%;transform:scale(1.4)}.t4{right:20%;bottom:18%}
.road{position:absolute;left:50%;bottom:-2%;width:100%;height:68%;transform:translateX(-50%);background:#292e34;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);box-shadow:inset 0 0 50px #0008}
.edge{position:absolute;bottom:0;width:7px;height:67%;background:#fff;z-index:1}
.el{left:calc(50% - 21%);transform:skewX(25deg)}.er{right:calc(50% - 21%);transform:skewX(-25deg)}
.lane{position:absolute;bottom:0;width:6px;height:64%;background:repeating-linear-gradient(to top,#fff 0 48px,transparent 48px 100px);z-index:2}
.l1{left:38%;transform:skewX(12deg)}.l2{left:62%;transform:skewX(-12deg)}
.lights{position:absolute;z-index:2;inset:30% 0 15%;pointer-events:none}
.light{position:absolute;width:5px;height:90px;background:#333;transform-origin:bottom}
.light:before{content:"";position:absolute;top:-8px;left:-10px;width:25px;height:12px;border-radius:10px;background:#ffeeb0;box-shadow:0 0 18px #fff}
.lights .a{left:12%;transform:rotate(-12deg)}.lights .b{right:12%;transform:rotate(12deg)}
.hud{position:absolute;z-index:8;top:12px;left:2%;right:2%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.card{padding:7px 2px;text-align:center;color:#fff;border:2px solid #65dfff;border-radius:12px;background:#071a2bea;box-shadow:0 5px 15px #0008}
.card small{display:block;font-size:10px}.card b{font-size:25px}
#speed{position:absolute;z-index:9;left:4%;bottom:16%;width:130px;height:130px;border-radius:50%;background:#06141eee;border:7px solid #15dfff;color:white;text-align:center;padding-top:20px;box-shadow:0 0 25px #00dfff66}
#speed small{font-size:11px}#speed b{display:block;font-size:32px}#speed span{font-size:10px}
#nitro{position:absolute;z-index:10;right:4%;bottom:17%;border:2px solid #ffb333;border-radius:40px;padding:17px 27px;background:linear-gradient(#ff7a20,#f12c0b);color:#fff;font-size:21px;font-weight:900;box-shadow:0 0 25px #ff481088}
#nitro.on{transform:scale(1.06);filter:brightness(1.3)}
.controls{position:absolute;z-index:10;left:4%;right:4%;bottom:2%;display:flex;justify-content:space-between}
.ctrl{width:112px;height:78px;border-radius:50%;border:3px solid #a9eaff;background:#061521dd;color:#fff;font-size:48px;box-shadow:0 0 20px #00dfff55}
#bike{position:absolute;z-index:7;left:50%;bottom:3%;width:150px;height:245px;transform:translateX(-50%);transition:left .08s linear;filter:drop-shadow(0 14px 8px #000b)}
.wheel{position:absolute;left:50%;transform:translateX(-50%);width:42px;height:125px;border:9px solid #111;border-radius:50%;background:#222}
.w1{top:0}.w2{bottom:0}
.body{position:absolute;left:50%;top:55px;transform:translateX(-50%);width:75px;height:135px;border-radius:40% 40% 25% 25%;background:linear-gradient(90deg,#8d0710,#ef1829,#680009);box-shadow:inset 12px 0 15px #ff6670aa}
.seat{position:absolute;left:50%;top:42px;transform:translateX(-50%);width:52px;height:82px;border-radius:40%;background:#090c11}
.helmet{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:58px;height:64px;border-radius:50%;background:linear-gradient(120deg,#303b48,#02060a);border:3px solid #111}
.visor{position:absolute;left:7px;right:7px;top:27px;height:15px;background:#67dcff;border-radius:5px;box-shadow:0 0 10px #5de6ff}
.handle{position:absolute;top:58px;left:15px;width:120px;height:9px;background:#aaa;border-radius:10px}
.exhaust{position:absolute;right:22px;top:140px;width:18px;height:55px;background:#777;border-radius:15px}
.flame{display:none;position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);width:35px;height:90px;background:linear-gradient(#fff,#ffdf00,#ff4500,transparent);clip-path:polygon(35% 0,65% 0,100% 75%,50% 100%,0 75%);filter:blur(1px)}
#bike.boost .flame{display:block}
.car{position:absolute;z-index:5;width:62px;height:92px;border-radius:16px;background:var(--c);box-shadow:0 12px 10px #0008;transform:translate(-50%,-50%)}
.car:before{content:"";position:absolute;left:9px;right:9px;top:10px;height:30px;border-radius:9px;background:#bdefff}
.car:after{content:"";position:absolute;left:8px;right:8px;bottom:12px;height:9px;background:#111;border-radius:8px}
.coin{position:absolute;z-index:6;width:34px;height:34px;border-radius:50%;background:radial-gradient(#fff39b 0 10%,#ffd000 12% 60%,#b77a00 62%);box-shadow:0 0 22px #ffd000;transform:translate(-50%,-50%);color:#fff;text-align:center;font-weight:bold;padding-top:8px}
#flash{position:absolute;inset:0;z-index:15;background:#f00;opacity:0;pointer-events:none}
#menu{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:#02101acc}
.panel{width:90%;max-width:430px;padding:28px 20px;text-align:center;color:#fff;border:2px solid #4bdfff;border-radius:25px;background:#061827f5}
.panel h1{font-size:30px}.panel p{line-height:1.5}.start{border:0;border-radius:30px;padding:16px 30px;background:#12c85c;color:#fff;font-size:20px;font-weight:bold}
.hide{display:none!important}
</style>
</head>
<body>
<div id="game">
<div class="sky"></div>
<div class="mountain m1"></div><div class="mountain m2"></div><div class="mountain m3"></div><div class="mountain m4"></div>
<div class="trees"><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div></div>
<div class="road"></div><div class="edge el"></div><div class="edge er"></div>
<div class="lane l1"></div><div class="lane l2"></div>
<div class="lights"><div class="light a"></div><div class="light b"></div></div>

<div class="hud">
<div class="card">🏆<small>SCORE</small><b id="score">0</b></div>
<div class="card">❤️<small>LIVES</small><b id="lives">3</b></div>
<div class="card">🪙<small>COINS</small><b id="coins">0</b></div>
<div class="card"><small>BEST</small><b id="best">0</b></div>
</div>

<div id="speed"><small>SPEED</small><b id="sv">96</b><span>KM/H</span></div>
<button id="nitro">🔥 NITRO</button>

<div id="bike">
<div class="wheel w1"></div><div class="wheel w2"></div>
<div class="handle"></div><div class="helmet"><div class="visor"></div></div>
<div class="seat"></div><div class="body"></div><div class="exhaust"></div><div class="flame"></div>
</div>

<div class="controls">
<button class="ctrl" id="left">←</button>
<button class="ctrl" id="right">→</button>
</div>

<div id="flash"></div>

<div id="menu">
<div class="panel">
<h1 id="title">🏍️ MOUNTAIN HIGHWAY</h1>
<p id="info">Realistic highway racing<br>🚗 Traffic • 🪙 Coins • 🔥 Nitro<br>💥 Crash • ❤️ 3 Lives<br><br>Swipe or use the buttons.</p>
<button class="start" id="start">START RACE</button>
</div>
</div>
</div>

<script>
(()=>{
const $=x=>document.getElementById(x);
let running=false,score=0,coins=0,lives=3,speed=96,best=+localStorage.mhrBest2||0;
let pos=.5,left=false,right=false,boost=false,last=0,spawn=0,cspawn=0;
let cars=[],coinList=[];

function hud(){
 $("score").textContent=Math.floor(score);
 $("lives").textContent=lives;
 $("coins").textContent=coins;
 $("best").textContent=best;
 $("sv").textContent=Math.floor(speed);
}

function roadPos(lane,z){
 let q=(z+1)/2;
 return {
  x:innerWidth/2+lane*innerWidth*.30*(.15+.85*q),
  y:innerHeight*.37+innerHeight*.63*q,
  s:.25+1.3*q
 };
}

function makeCar(){
 let lanes=[-.72,0,.72];
 let e=document.createElement("div");
 e.className="car";
 e.style.setProperty("--c",["#e51d2a","#0877e8","#ffd000","#fff","#20252b"][Math.random()*5|0]);
 $("game").appendChild(e);
 cars.push({el:e,lane:lanes[Math.random()*3|0],z:-1,hit:false});
}

function makeCoin(){
 let lanes=[-.72,0,.72];
 let e=document.createElement("div");
 e.className="coin";
 e.textContent="₿";
 $("game").appendChild(e);
 coinList.push({el:e,lane:lanes[Math.random()*3|0],z:-1,hit:false});
}

function crash(){
 lives--;
 $("flash").style.opacity=.45;
 setTimeout(()=>$("flash").style.opacity=0,180);
 if(navigator.vibrate)navigator.vibrate([80,50,100]);
 speed=Math.max(55,speed*.55);
 if(lives<=0)gameOver();
}

function gameOver(){
 running=false;
 $("title").textContent="💥 RACE OVER";
 $("info").innerHTML="🏆 Score: <b>"+Math.floor(score)+"</b><br>🪙 Coins: <b>"+coins+"</b><br>⭐ Best: <b>"+best+"</b><br><br>Race again!";
 $("start").textContent="🏍️ RACE AGAIN";
 $("menu").classList.remove("hide");
}

function update(dt){
 let steer=(right?1:0)-(left?1:0);
 pos+=steer*dt*.48;
 pos=Math.max(.15,Math.min(.85,pos));

 speed=boost?Math.min(250,speed+dt*65):Math.min(185,speed+dt*2);
 let move=dt*(speed/145)*.72;

 spawn+=dt;cspawn+=dt;
 if(spawn>.65){spawn=0;makeCar()}
 if(cspawn>.8){cspawn=0;makeCoin()}

 let playerLane=(pos-.5)/.44;

 cars.forEach(o=>{
  o.z+=move;
  let p=roadPos(o.lane,o.z);
  o.el.style.left=p.x+"px";
  o.el.style.top=p.y+"px";
  o.el.style.transform="translate(-50%,-50%) scale("+p.s*.7+")";

  if(!o.hit&&o.z>.68&&o.z<1.03&&Math.abs(o.lane-playerLane)<.27){
   o.hit=true;o.z=2;crash();
  }
 });

 coinList.forEach(o=>{
  o.z+=move;
  let p=roadPos(o.lane,o.z);
  o.el.style.left=p.x+"px";
  o.el.style.top=p.y+"px";
  o.el.style.transform="translate(-50%,-50%) scale("+p.s+") rotate("+performance.now()/8+"deg)";

  if(!o.hit&&o.z>.66&&o.z<1.03&&Math.abs(o.lane-playerLane)<.25){
   o.hit=true;o.z=2;coins++;score+=35;
  }
 });

 cars=cars.filter(o=>{
  if(o.z>1.5){o.el.remove();return false}
  return true;
 });
 coinList=coinList.filter(o=>{
  if(o.z>1.5){o.el.remove();return false}
  return true;
 });

 score+=dt*speed*.12;
 if(score>best){best=Math.floor(score);localStorage.mhrBest2=best}
 $("bike").style.left=(pos*100)+"%";
 $("bike").classList.toggle("boost",boost);
 $("nitro").classList.toggle("on",boost);
 hud();
}

function loop(t){
 if(!running)return;
 let dt=Math.min(.035,(t-last)/1000);
 last=t;
 update(dt);
 requestAnimationFrame(loop);
}

function start(){
 cars.forEach(o=>o.el.remove());
 coinList.forEach(o=>o.el.remove());
 cars=[];coinList=[];
 score=0;coins=0;lives=3;speed=96;pos=.5;
 running=true;
 $("menu").classList.add("hide");
 hud();
 last=performance.now();
 requestAnimationFrame(loop);
}

$("start").onclick=start;

function hold(el,fn){
 el.addEventListener("pointerdown",e=>{e.preventDefault();fn(true)});
 ["pointerup","pointercancel","pointerleave"].forEach(x=>el.addEventListener(x,()=>fn(false)));
}
hold($("left"),v=>left=v);
hold($("right"),v=>right=v);

$("nitro").addEventListener("pointerdown",e=>{e.preventDefault();boost=true});
["pointerup","pointercancel","pointerleave"].forEach(x=>$("nitro").addEventListener(x,()=>boost=false));

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")left=true;
 if(e.key==="ArrowRight"||e.key==="d")right=true;
 if(e.code==="Space")boost=true;
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")left=false;
 if(e.key==="ArrowRight"||e.key==="d")right=false;
 if(e.code==="Space")boost=false;
});

let sx=null;
$("game").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
$("game").addEventListener("touchmove",e=>{
 if(sx===null)return;
 pos+=(e.touches[0].clientX-sx)/innerWidth*.8;
 pos=Math.max(.15,Math.min(.85,pos));
 sx=e.touches[0].clientX;
},{passive:true});
$("game").addEventListener("touchend",()=>sx=null);

hud();
})();
</script>
</body>
</html>
