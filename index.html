<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Street Bike Racing 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

  <div id="sky">
    <div class="mountain mountain1"></div>
    <div class="mountain mountain2"></div>
  </div>

  <div id="hud">
    <span>🏆 <b id="score">0</b></span>
    <span>❤️ <b id="lives">3</b></span>
    <span>🪙 <b id="coins">0</b></span>
    <span>BEST <b id="best">0</b></span>
  </div>

  <div id="road">

    <div class="roadLine line1"></div>
    <div class="roadLine line2"></div>

    <div class="tree t1">🌳</div>
    <div class="tree t2">🌲</div>
    <div class="tree t3">🌳</div>
    <div class="tree t4">🌲</div>
    <div class="tree t5">🌳</div>
    <div class="tree t6">🌲</div>

    <div id="coin1" class="coin">🪙</div>
    <div id="coin2" class="coin">🪙</div>

    <div id="car1" class="car red">
      <div class="carWindow"></div>
      <div class="headlight leftLight"></div>
      <div class="headlight rightLight"></div>
    </div>

    <div id="car2" class="car blue">
      <div class="carWindow"></div>
      <div class="headlight leftLight"></div>
      <div class="headlight rightLight"></div>
    </div>

    <div id="car3" class="car yellow">
      <div class="carWindow"></div>
      <div class="headlight leftLight"></div>
      <div class="headlight rightLight"></div>
    </div>

    <div id="bike">

      <div class="wheel frontWheel"></div>
      <div class="wheel backWheel"></div>

      <div class="handle"></div>
      <div class="seat"></div>
      <div class="bodyBike"></div>
      <div class="engine"></div>

      <div class="rider"></div>
      <div class="helmet"></div>

      <div id="nitroFire"></div>

    </div>

  </div>

  <div id="speedBox">
    ⚡ SPEED <b id="speed">1</b>
  </div>

  <button id="nitro">🔥 NITRO</button>

  <div id="controls">
    <button id="left">⬅</button>
    <button id="right">➡</button>
  </div>

  <div id="gameOver">
    <h1>💥 CRASH!</h1>
    <p>Score: <b id="finalScore">0</b></p>
    <p>Coins: <b id="finalCoins">0</b></p>
    <p>Best: <b id="finalBest">0</b></p>
    <button id="restart">🏍️ RACE AGAIN</button>
  </div>

</div>

<script src="script.js"></script>
</body>
  </html>
