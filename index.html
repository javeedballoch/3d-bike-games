<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mountain Highway Bike Racing 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080a;font-family:Arial}
#game{position:relative;width:100%;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}

#hud{position:absolute;top:9px;left:7px;right:7px;z-index:5;
display:flex;justify-content:space-between;gap:5px}
.box{background:#101c27ed;color:#fff;border:3px solid #ffffff44;
border-radius:14px;padding:4px 7px;min-width:63px;text-align:center;
box-shadow:0 5px 15px #0008}
.box small{display:block;font-size:9px}
.box b{font-size:20px}

#speed{position:absolute;z-index:6;left:17px;bottom:112px;
width:120px;height:120px;border-radius:50%;background:#07171df5;
border:7px solid #20ddff;color:white;text-align:center;padding-top:16px;
box-shadow:0 0 22px #20ddff77}
#speed small{font-size:11px}
#speed b{display:block;font-size:32px}
#speed span{font-size:10px}

#nitro{position:absolute;right:18px;bottom:137px;z-index:7;
border:0;border-radius:40px;padding:18px 29px;
background:linear-gradient(#ff982a,#ed4008);color:#fff;
font-size:21px;font-weight:bold;box-shadow:0 7px 18px #0008}

#controls{position:absolute;z-index:7;left:18px;right:18px;
bottom:12px;display:flex;justify-content:space-between}
.control{width:112px;height:73px;border-radius:40px;
border:3px solid #fff9;background:#07131dd9;color:white;
font-size:43px;font-weight:bold;box-shadow:0 5px 15px #0008}

#menu{position:absolute;inset:0;z-index:20;background:#03111acc;
display:flex;align-items:center;justify-content:center}
.panel{width:90%;max-width:430px;padding:29px;text-align:center;
color:#fff;background:#101c27f7;border:2px solid #fff5;border-radius:28px}
.panel h1{margin:0 0 15px;font-size:30px}
.panel p{line-height:1.5;font-size:17px}
.start{border:0;border-radius:32px;padding:16px 32px;
background:#13c55d;color:white;font-size:21px;font-weight:bold}
.hide{display:none!important}
</style>
</head>

<body>
<div id="game">
<canvas id="canvas"></canvas>

<div id="hud">
<div class="box">🏆<small>SCORE</small><b id="score">0</b></div>
<div class="box">❤️<small>LIVES</small><b id="lives">3</b></div>
<div class="box">🪙<small>COINS</small><b id="coins">0</b></div>
<div class="box"><small>BEST</small><b id="best">0</b></div>
</div>

<div id="speed">
<small>SPEED</small>
<b id="speedValue">0</b>
<span>KM/H</span>
</div>

<button id="nitro">🔥 NITRO</button>

<div id="controls">
<button class="control" id="left">←</button>
<button class="control" id="right">→</button>
</div>

<div id="menu">
<div class="panel">
<h1 id="title">🏍️ MOUNTAIN RACING</h1>
<p id="info">
🏔️ Realistic Highway<br>
🚗 Traffic Cars<br>
🪙 Golden Coins<br>
🔥 Nitro Boost<br>
💥 Crash System<br><br>
Use buttons or swipe to steer.
</p>
<button class="start" id="start">START RACE</button>
</div>
</div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
let running=false,score=0,coins=0,lives=3;
let player=.5,speed=85,best=+localStorage.getItem("bikeBest")||0;
let left=false,right=false,nitro=false;
let cars=[],coinList=[],particles=[];
let carTimer=0,coinTimer=0,roadMove=0,last=0;
let shake=0;

function resize(){
 W=innerWidth;H=innerHeight;
 let d=Math.min(devicePixelRatio||1,2);
 canvas.width=W*d;canvas.height=H*d;
 ctx.setTransform(d,0,0,d,0,0);
}
addEventListener("resize",resize);resize();

const $=id=>document.getElementById(id);

function hud(){
 $("score").textContent=Math.floor(score);
 $("coins").textContent=coins;
 $("lives").textContent=lives;
 $("best").textContent=best;
 $("speedValue").textContent=Math.floor(speed);
}

$("start").onclick=()=>{
 score=0;coins=0;lives=3;player=.5;speed=85;
 cars=[];coinList=[];particles=[];
 carTimer=coinTimer=roadMove=0;
 shake=0;
 running=true;
 $("menu").classList.add("hide");
 last=performance.now();
 requestAnimationFrame(loop);
};

function hold(btn,type){
 btn.onpointerdown=e=>{
  e.preventDefault();
  if(type==="l")left=true;
  else right=true;
 };
 btn.onpointerup=btn.onpointercancel=btn.onpointerleave=()=>{
  if(type==="l")left=false;
  else right=false;
 };
}
hold($("left"),"l");
hold($("right"),"r");

document.onkeydown=e=>{
 if(e.key==="ArrowLeft"||e.key==="a")left=true;
 if(e.key==="ArrowRight"||e.key==="d")right=true;
 if(e.code==="Space")nitro=true;
};
document.onkeyup=e=>{
 if(e.key==="ArrowLeft"||e.key==="a")left=false;
 if(e.key==="ArrowRight"||e.key==="d")right=false;
 if(e.code==="Space")nitro=false;
};

$("nitro").onpointerdown=()=>nitro=true;
$("nitro").onpointerup=()=>nitro=false;
$("nitro").onpointercancel=()=>nitro=false;

let touchX=null;
canvas.ontouchstart=e=>touchX=e.touches[0].clientX;
canvas.ontouchmove=e=>{
 if(touchX===null)return;
 let nx=e.touches[0].clientX;
 player+=(nx-touchX)/W*.9;
 player=Math.max(.08,Math.min(.92,player));
 touchX=nx;
};
canvas.ontouchend=()=>touchX=null;

function round(x,y,w,h,r){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}

function background(){
 let h=H*.30;

 let sky=ctx.createLinearGradient(0,0,0,h);
 sky.addColorStop(0,"#319dd8");
 sky.addColorStop(.55,"#8ed8f0");
 sky.addColorStop(1,"#e8f8ff");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,h);

 /* clouds */
 ctx.fillStyle="#fff9";
 for(let i=0;i<7;i++){
  let x=(i*180+50)%W,y=45+(i%3)*42;
  ctx.beginPath();
  ctx.arc(x,y,16,0,Math.PI*2);
  ctx.arc(x+20,y-5,22,0,Math.PI*2);
  ctx.arc(x+43,y,15,0,Math.PI*2);
  ctx.fill();
 }

 /* far mountains */
 ctx.fillStyle="#708b98";
 ctx.beginPath();
 ctx.moveTo(0,h);
 for(let x=0;x<=W;x+=45)
  ctx.lineTo(x,h-35-Math.abs(Math.sin(x*.014))*110);
 ctx.lineTo(W,h);ctx.fill();

 /* snow peaks */
 ctx.fillStyle="#eef8fa";
 ctx.beginPath();
 for(let x=0;x<W;x+=150){
  let y=h-55-Math.abs(Math.sin(x*.014))*100;
  ctx.moveTo(x,y+30);
  ctx.lineTo(x+35,y);
  ctx.lineTo(x+65,y+35);
 }
 ctx.fill();

 /* water */
 ctx.fillStyle="#43b4d0";
 ctx.fillRect(0,h,W,H*.11);

 /* grass */
 ctx.fillStyle="#38a948";
 ctx.fillRect(0,h+H*.075,W,H);
}

function road(){
 background();

 let h=H*.30,c=W/2;
 let top=W*.22,bottom=W*.94;

 ctx.fillStyle="#292d31";
 ctx.beginPath();
 ctx.moveTo(c-top/2,h);
 ctx.lineTo(c+top/2,h);
 ctx.lineTo(c+bottom/2,H);
 ctx.lineTo(c-bottom/2,H);
 ctx.closePath();ctx.fill();

 /* road highlights */
 ctx.fillStyle="#363b3f";
 ctx.beginPath();
 ctx.moveTo(c-top/2+8,h);
 ctx.lineTo(c+top/2-8,h);
 ctx.lineTo(c+bottom/2-25,H);
 ctx.lineTo(c-bottom/2+25,H);
 ctx.closePath();ctx.fill();

 /* edges */
 ctx.strokeStyle="#fff";
 ctx.lineWidth=7;
 ctx.beginPath();
 ctx.moveTo(c-top/2-8,h);
 ctx.lineTo(c-bottom/2-15,H);
 ctx.moveTo(c+top/2+8,h);
 ctx.lineTo(c+bottom/2+15,H);
 ctx.stroke();

 /* lane marks */
 ctx.strokeStyle="#fff";
 ctx.lineWidth=5;
 ctx.setLineDash([48,48]);
 ctx.lineDashOffset=-roadMove;

 for(let lane of [-.33,.33]){
  ctx.beginPath();
  ctx.moveTo(c+lane*top,h);
  ctx.lineTo(c+lane*bottom,H);
  ctx.stroke();
 }
 ctx.setLineDash([]);

 /* roadside trees */
 for(let i=0;i<12;i++){
  let t=(i*.115+roadMove/950)%1;
  let y=h+(H-h)*t;
  let side=i%2?-1:1;
  let x=c+side*(bottom*.54);
  tree(x,y,25+42*t);
 }
}

function tree(x,y,s){
 ctx.save();ctx.translate(x,y);

 ctx.fillStyle="#704b37";
 ctx.fillRect(-s*.07,0,s*.14,s*.65);

 ctx.fillStyle="#075d2b";
 for(let i=0;i<3;i++){
  ctx.beginPath();
  ctx.moveTo(0,-s*.85+i*s*.25);
  ctx.lineTo(-s*.58,s*.08);
  ctx.lineTo(s*.58,s*.08);
  ctx.fill();
 }
 ctx.fillStyle="#12943d";
 ctx.beginPath();
 ctx.arc(-s*.16,-s*.42,s*.15,0,7);
 ctx.fill();
 ctx.restore();
}

function project(l,t){
 let h=H*.30;
 let top=W*.22,bottom=W*.94;
 return{
  x:W/2+l*(top+(bottom-top)*t),
  y:h+(H-h)*t,
  s:.18+1.55*t
 };
}

function car(o){
 let q=project(o.lane,o.y);
 ctx.save();
 ctx.translate(q.x,q.y);
 ctx.scale(q.s,q.s);

 ctx.fillStyle="#0009";
 ctx.beginPath();
 ctx.ellipse(0,58,42,11,0,0,7);ctx.fill();

 /* body */
 ctx.fillStyle=o.color;
 round(-35,-62,70,115,18);

 /* roof */
 ctx.fillStyle=o.color;
 round(-28,-72,56,45,18);

 /* windows */
 ctx.fillStyle="#bdefff";
 round(-23,-49,46,32,8);

 /* bumper */
 ctx.fillStyle="#17191c";
 round(-29,40,58,13,6);

 /* lights */
 ctx.fillStyle="#ffe56b";
 ctx.fillRect(-27,52,12,7);
 ctx.fillRect(15,52,12,7);

 ctx.restore();
}

function coin(o){
 let q=project(o.lane,o.y);
 let r=18*q.s;

 ctx.save();
 ctx.translate(q.x,q.y);
 ctx.rotate(Math.sin(o.rot)*.15);
 ctx.scale(.35+.65*Math.abs(Math.cos(o.rot)),1);

 ctx.shadowBlur=20;
 ctx.shadowColor="#ffd21a";
 ctx.fillStyle="#ffd21a";
 ctx.beginPath();
 ctx.arc(0,0,r,0,7);ctx.fill();

 ctx.shadowBlur=0;
 ctx.fillStyle="#fff0a0";
 ctx.beginPath();
 ctx.arc(0,0,r*.68,0,7);ctx.fill();

 ctx.fillStyle="#b77d00";
 ctx.font="bold "+Math.max(10,r*.7)+"px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText("★",0,1);

 ctx.restore();
}

function bike(){
 let x=W/2+(player-.5)*W*.65;
 let y=H*.80;
 let s=Math.min(W/300,1.25);

 ctx.save();
 ctx.translate(x,y);
 ctx.scale(s,s);

 /* shadow */
 ctx.fillStyle="#000a";
 ctx.beginPath();
 ctx.ellipse(0,86,62,17,0,0,7);ctx.fill();

 /* rear wheel */
 ctx.fillStyle="#08090b";
 ctx.beginPath();
 ctx.ellipse(0,30,24,78,0,0,7);ctx.fill();

 ctx.strokeStyle="#777";
 ctx.lineWidth=6;
 ctx.beginPath();
 ctx.ellipse(0,30,10,67,0,0,7);ctx.stroke();

 /* front wheel */
 ctx.fillStyle="#08090b";
 ctx.beginPath();
 ctx.ellipse(0,-65,21,62,0,0,7);ctx.fill();

 ctx.strokeStyle="#777";
 ctx.lineWidth=5;
 ctx.beginPath();
 ctx.ellipse(0,-65,9,51,0,0,7);ctx.stroke();

 /* front fork */
 ctx.strokeStyle="#aaa";
 ctx.lineWidth=7;
 ctx.beginPath();
 ctx.moveTo(-12,-70);
 ctx.lineTo(-30,15);
 ctx.moveTo(12,-70);
 ctx.lineTo(30,15);
 ctx.stroke();

 /* handle */
 ctx.strokeStyle="#ccc";
 ctx.lineWidth=8;
 ctx.beginPath();
 ctx.moveTo(-48,-72);
 ctx.lineTo(48,-72);
 ctx.stroke();

 /* rider body */
 ctx.fillStyle="#11151a";
 round(-28,-50,56,65,20);

 /* fuel tank */
 ctx.fillStyle="#d71928";
 round(-38,-15,76,58,22);

 /* side fairing */
 ctx.fillStyle="#f12b38";
 ctx.beginPath();
 ctx.moveTo(-37,0);
 ctx.lineTo(-54,38);
 ctx.lineTo(-25,55);
 ctx.lineTo(25,55);
 ctx.lineTo(54,38);
 ctx.lineTo(37,0);
 ctx.closePath();ctx.fill();

 /* helmet */
 ctx.fillStyle="#111820";
 round(-27,-105,54,52,22);

 /* visor */
 ctx.fillStyle="#71dcf6";
 round(-19,-92,38,15,7);

 /* headlight */
 ctx.fillStyle="#fff";
 ctx.shadowBlur=15;
 ctx.shadowColor="#fff";
 ctx.beginPath();
 ctx.arc(0,-7,9,0,7);ctx.fill();
 ctx.shadowBlur=0;

 /* red tail */
 ctx.fillStyle="#ff2020";
 ctx.beginPath();
 ctx.arc(0,43,8,0,7);ctx.fill();

 /* nitro flame */
 if(nitro){
  ctx.fillStyle="#ff7100";
  ctx.beginPath();
  ctx.moveTo(-15,55);
  ctx.lineTo(0,130+Math.random()*25);
  ctx.lineTo(15,55);
  ctx.fill();

  ctx.fillStyle="#fff4a0";
  ctx.beginPath();
  ctx.moveTo(-6,58);
  ctx.lineTo(0,105+Math.random()*15);
  ctx.lineTo(6,58);
  ctx.fill();
 }

 ctx.restore();
}

function spawnCar(){
 let lanes=[-.34,0,.34];
 cars.push({
  lane:lanes[Math.floor(Math.random()*3)],
  y:-.03,
  color:["#e51d2a","#1680e8","#f4c515","#eee","#161a20"]
  [Math.floor(Math.random()*5)]
 });
}

function spawnCoin(){
 let lanes=[-.34,0,.34];
 coinList.push({
  lane:lanes[Math.floor(Math.random()*3)],
  y:-.02,
  rot:Math.random()*7
 });
}

function crash(x,y){
 for(let i=0;i<25;i++){
  particles.push({
   x:x,y:y,
   vx:(Math.random()-.5)*180,
   vy:(Math.random()-.5)*180,
   life:.7
  });
 }
 shake=.35;
}

function drawParticles(dt){
 for(let p of particles){
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;

  ctx.fillStyle="#ff9d00";
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.beginPath();
  ctx.arc(p.x,p.y,4,0,7);
  ctx.fill();
 }
 ctx.globalAlpha=1;
 particles=particles.filter(p=>p.life>0);
}

function update(dt){

 let dir=(right?1:0)-(left?1:0);
 player+=dir*dt*.72;
 player=Math.max(.08,Math.min(.92,player));

 if(nitro)
  speed=Math.min(250,speed+dt*55);
 else
  speed=Math.min(180,speed+dt*4);

 let move=dt*(speed/120)*.29;
 roadMove=(roadMove+move*900)%96;

 score+=dt*speed*.075;

 carTimer+=dt;
 coinTimer+=dt;

 if(carTimer>.68){
  carTimer=0;
  spawnCar();
 }

 if(coinTimer>.82){
  coinTimer=0;
  spawnCoin();
 }

 cars.forEach(c=>c.y+=move);
 coinList.forEach(c=>{
  c.y+=move;
  c.rot+=dt*8;
 });

 let lane=(player-.5)*1.5;

 for(let c of cars){
  if(!c.hit&&c.y>.75&&c.y<1.03&&Math.abs(c.lane-lane)<.22){
   c.hit=true;
   lives--;
   speed=Math.max(55,speed*.55);

   let q=project(c.lane,c.y);
   crash(q.x,q.y);

   if(navigator.vibrate)navigator.vibrate(220);
  }
 }

 for(let c of coinList){
  if(!c.hit&&c.y>.75&&c.y<1.03&&Math.abs(c.lane-lane)<.22){
   c.hit=true;
   coins++;
   score+=20;
  }
 }

 cars=cars.filter(c=>c.y<1.3);
 coinList=coinList.filter(c=>c.y<1.3);

 if(score>best){
  best=Math.floor(score);
  localStorage.setItem("bikeBest",best);
 }

 hud();

 if(lives<=0)gameOver();
}

function gameOver(){
 running=false;
 $("title").textContent="💥 GAME OVER";
 $("info").innerHTML=
 "🏆 Score: <b>"+Math.floor(score)+"</b><br>"+
 "🪙 Coins: <b>"+coins+"</b><br>"+
 "⭐ Best: <b>"+best+"</b><br><br>"+
 "Try again!";
 $("start").textContent="🏍️ RACE AGAIN";
 $("menu").classList.remove("hide");
}

function draw(){
 road();
 cars.forEach(car);
 coinList.forEach(coin);
 bike();
 drawParticles(.016);
}

function loop(t){
 if(!running)return;

 let dt=Math.min(.035,(t-last)/1000);
 last=t;

 update(dt);
 draw();

 requestAnimationFrame(loop);
}

hud();
draw();
</script>
</body>
</html>
