<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Street Bike Racing 3D</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:Arial,sans-serif;background:#111;
}
body{touch-action:none}

#game{
  position:relative;width:100%;height:100%;
  overflow:hidden;background:linear-gradient(#55b9ee,#9de4ff 45%,#31a943 46%);
}

#road{
  position:absolute;top:0;bottom:0;left:12%;right:12%;
  background:
    linear-gradient(90deg,#333,#3d3d3d 50%,#333);
  border-left:12px solid white;
  border-right:12px solid white;
  box-shadow:0 0 30px #111 inset;
  overflow:hidden;
}

#road:before,#road:after{
  content:"";position:absolute;top:0;bottom:0;width:7px;
  background:repeating-linear-gradient(
    to bottom,#fff 0 80px,transparent 80px 145px
  );
  opacity:.9;
}
#road:before{left:33.33%}
#road:after{left:66.66%}

#hud{
  position:absolute;z-index:20;top:10px;left:2%;right:2%;
  display:flex;justify-content:space-between;gap:7px;
}
.hudBox{
  min-width:70px;padding:8px 10px;text-align:center;
  color:#fff;background:#101820dd;border:2px solid #555;
  border-radius:12px;font-size:15px;box-shadow:0 3px 10px #0008;
}
.hudBox b{display:block;font-size:21px;margin-top:2px}

#bike{
  position:absolute;z-index:10;
  width:74px;height:150px;
  left:calc(50% - 37px);bottom:75px;
  transition:left .08s;
  filter:drop-shadow(0 8px 6px #000);
}

.wheel{
  position:absolute;width:30px;height:58px;
  background:#111;border:5px solid #777;border-radius:50%;
  left:22px;
}
.frontWheel{top:0}
.backWheel{bottom:0}

.bikeBody{
  position:absolute;left:12px;top:40px;width:50px;height:70px;
  background:linear-gradient(90deg,#8b0000,#ff2020,#8b0000);
  border-radius:22px 22px 16px 16px;
  box-shadow:inset 0 0 8px #fff5;
}
.bikeBody:after{
  content:"";position:absolute;left:9px;top:15px;width:32px;height:28px;
  background:#111;border-radius:10px;
}
.seat{
  position:absolute;left:18px;top:73px;width:38px;height:20px;
  background:#080808;border-radius:12px;z-index:3;
}
.handle{
  position:absolute;z-index:5;left:2px;top:35px;width:70px;height:8px;
  background:#aaa;border-radius:8px;transform:rotate(-5deg);
}
.light{
  position:absolute;z-index:6;left:29px;top:44px;
  width:16px;height:12px;background:#dffaff;border-radius:50%;
  box-shadow:0 0 15px #fff;
}
.rider{
  position:absolute;z-index:7;left:25px;top:67px;
  width:25px;height:35px;background:#111;border-radius:13px;
}
.helmet{
  position:absolute;z-index:8;left:24px;top:48px;
  width:27px;height:25px;background:#222;border-radius:50%;
  border:3px solid #aaa;
}
.engine{
  position:absolute;left:21px;top:98px;width:32px;height:22px;
  background:#555;border-radius:7px;border:2px solid #aaa;
}

.traffic,.coin{
  position:absolute;z-index:8;
  transform:translateY(-180px);
}
.traffic{
  width:58px;height:105px;border-radius:18px;
  box-shadow:0 8px 10px #0008;
}
.traffic:before{
  content:"";position:absolute;left:8px;right:8px;top:14px;height:30px;
  background:#bdefff;border-radius:8px;
}
.traffic:after{
  content:"";position:absolute;left:8px;right:8px;bottom:12px;height:8px;
  background:#111;border-radius:5px;
}
.red{background:linear-gradient(90deg,#900,#f22,#900)}
.blue{background:linear-gradient(90deg,#064a9c,#158cff,#064a9c)}
.yellow{background:linear-gradient(90deg,#b88700,#ffe100,#b88700)}

.coin{
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle,#fff38a 0 15%,#ffd21a 17% 65%,#a66b00 68%);
  border:3px solid #fff2a0;
  display:flex;align-items:center;justify-content:center;
  font-size:23px;box-shadow:0 0 15px #ffd700;
}

.tree{
  position:absolute;z-index:5;font-size:55px;
  filter:drop-shadow(0 5px 4px #0008);
}
.t1{left:-5%;top:20%}.t2{right:-5%;top:30%}
.t3{left:-3%;top:60%}.t4{right:-4%;top:72%}
.t5{left:-5%;top:88%}.t6{right:-4%;top:50%}

#speed{
  position:absolute;z-index:30;left:20px;bottom:150px;
  width:105px;height:105px;border-radius:50%;
  background:#101820ee;border:5px solid #555;
  color:#fff;text-align:center;padding-top:18px;
  box-shadow:0 5px 15px #0008;
}
#speed strong{display:block;font-size:30px;margin-top:5px}

#nitro{
  position:absolute;z-index:40;right:22px;bottom:150px;
  border:0;border-radius:30px;padding:18px 30px;
  color:white;background:linear-gradient(#ff7415,#f04400);
  font-size:19px;font-weight:bold;box-shadow:0 6px 12px #0008;
}
#nitro:active{transform:scale(.94)}

#controls{
  position:absolute;z-index:40;bottom:20px;left:0;right:0;
  display:flex;justify-content:space-between;padding:0 25px;
}
.control{
  width:125px;height:65px;border-radius:20px;
  border:3px solid #aaa;background:#111d;color:white;
  font-size:35px;font-weight:bold;
}
.control:active{background:#555}

.overlay{
  position:absolute;z-index:100;inset:0;
  background:#06111dcc;display:flex;
  align-items:center;justify-content:center;padding:25px;
}
.panel{
  width:100%;max-width:430px;padding:30px 20px;
  border-radius:28px;background:#101a23f5;
  color:#fff;text-align:center;border:2px solid #667;
  box-shadow:0 15px 40px #000;
}
.panel h1{font-size:35px;margin:0 0 20px}
.panel p{font-size:19px;line-height:1.6}
.start,.restart{
  margin-top:15px;padding:18px 35px;border:0;border-radius:35px;
  background:#12c65b;color:white;font-size:22px;font-weight:bold;
}
#gameOver{display:none}

#nitroFire{
  display:none;position:absolute;z-index:1;
  left:25px;bottom:-25px;width:25px;height:45px;
  background:linear-gradient(#fff,#ff0,#f00,transparent);
  border-radius:50%;
  animation:fire .1s infinite alternate;
}
@keyframes fire{to{height:65px;opacity:.6}}

@media(max-width:500px){
  #road{left:12%;right:12%}
  .hudBox{min-width:60px;padding:5px;font-size:12px}
  .hudBox b{font-size:19px}
  #nitro{right:15px;bottom:145px;padding:17px 27px}
}
</style>
</head>

<body>

<div id="game">

  <div id="hud">
    <div class="hudBox">🏆<b id="score">0</b></div>
    <div class="hudBox">❤️<b id="lives">3</b></div>
    <div class="hudBox">🪙<b id="coins">0</b></div>
    <div class="hudBox">BEST<b id="best">0</b></div>
  </div>

  <div id="road">

    <div class="tree t1">🌳</div>
    <div class="tree t2">🌲</div>
    <div class="tree t3">🌳</div>
    <div class="tree t4">🌲</div>
    <div class="tree t5">🌳</div>
    <div class="tree t6">🌲</div>

    <div id="coin1" class="coin">🪙</div>
    <div id="coin2" class="coin">🪙</div>

    <div id="car1" class="traffic red"></div>
    <div id="car2" class="traffic blue"></div>
    <div id="car3" class="traffic yellow"></div>

    <div id="bike">
      <div class="wheel frontWheel"></div>
      <div class="wheel backWheel"></div>
      <div class="handle"></div>
      <div class="bikeBody"></div>
      <div class="seat"></div>
      <div class="engine"></div>
      <div class="light"></div>
      <div class="rider"></div>
      <div class="helmet"></div>
      <div id="nitroFire"></div>
    </div>

  </div>

  <div id="speed">
    SPEED
    <strong id="speedValue">0</strong>
    KM/H
  </div>

  <button id="nitro">🔥 NITRO</button>

  <div id="controls">
    <button class="control" id="left">⬅</button>
    <button class="control" id="right">➡</button>
  </div>

  <!-- START -->
  <div class="overlay" id="startScreen">
    <div class="panel">
      <h1>🏍️ STREET RACING</h1>
      <p>
        🏔️ Mountain Highway<br>
        🚗 Real Traffic<br>
        🪙 Collect Coins<br>
        🔥 Nitro Boost<br>
        ⬅️➡️ Move Bike
      </p>
      <button class="start" id="startButton">START RACE</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay" id="gameOver">
    <div class="panel">
      <h1>💥 CRASH!</h1>
      <p>Score: <b id="finalScore">0</b></p>
      <p>Coins: <b id="finalCoins">0</b></p>
      <p>Best: <b id="finalBest">0</b></p>
      <button class="restart" id="restartButton">🏍️ RACE AGAIN</button>
    </div>
  </div>

</div>

<script>
(function(){

"use strict";

/* =========================
   GAME VARIABLES
========================= */

const road = document.getElementById("road");
const bike = document.getElementById("bike");

const startScreen = document.getElementById("startScreen");
const gameOver = document.getElementById("gameOver");

const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");

const leftButton = document.getElementById("left");
const rightButton = document.getElementById("right");
const nitroButton = document.getElementById("nitro");

const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");
const coinsText = document.getElementById("coins");
const bestText = document.getElementById("best");
const speedText = document.getElementById("speedValue");

const finalScore = document.getElementById("finalScore");
const finalCoins = document.getElementById("finalCoins");
const finalBest = document.getElementById("finalBest");

const nitroFire = document.getElementById("nitroFire");

const cars = [
  document.getElementById("car1"),
  document.getElementById("car2"),
  document.getElementById("car3")
];

const coinObjects = [
  document.getElementById("coin1"),
  document.getElementById("coin2")
];

let running = false;
let animationId = null;

let lane = 1;
let score = 0;
let coins = 0;
let lives = 3;

let speed = 4;
let nitro = false;

let carData = [];
let coinData = [];

let best = Number(localStorage.getItem("bikeBest") || 0);
bestText.textContent = best;


/* =========================
   LANE POSITION
========================= */

function laneX(n){

  const roadWidth = road.clientWidth;
  const laneWidth = roadWidth / 3;

  return laneWidth * n + laneWidth / 2 - bike.offsetWidth / 2;
}

function moveBike(){

  const maxLane = 2;

  if(lane < 0) lane = 0;
  if(lane > maxLane) lane = maxLane;

  bike.style.left = laneX(lane) + "px";
}


/* =========================
   MOVE LEFT / RIGHT
========================= */

function moveLeft(){
  if(!running) return;
  lane--;
  moveBike();
}

function moveRight(){
  if(!running) return;
  lane++;
  moveBike();
}

leftButton.addEventListener("pointerdown",function(e){
  e.preventDefault();
  moveLeft();
});

rightButton.addEventListener("pointerdown",function(e){
  e.preventDefault();
  moveRight();
});


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",function(e){

  if(e.key === "ArrowLeft"){
    e.preventDefault();
    moveLeft();
  }

  if(e.key === "ArrowRight"){
    e.preventDefault();
    moveRight();
  }

  if(e.code === "Space"){
    e.preventDefault();
    nitroOn();
  }
});

document.addEventListener("keyup",function(e){

  if(e.code === "Space"){
    nitroOff();
  }
});


/* =========================
   SWIPE CONTROL
========================= */

let touchStartX = 0;

road.addEventListener("touchstart",function(e){

  if(e.touches.length){
    touchStartX = e.touches[0].clientX;
  }

},{passive:true});

road.addEventListener("touchend",function(e){

  if(!running) return;

  const endX = e.changedTouches[0].clientX;
  const difference = endX - touchStartX;

  if(Math.abs(difference) > 40){

    if(difference < 0){
      moveLeft();
    }else{
      moveRight();
    }
  }

},{passive:true});


/* =========================
   NITRO
========================= */

function nitroOn(){

  if(!running) return;

  nitro = true;
  nitroFire.style.display = "block";
}

function nitroOff(){

  nitro = false;
  nitroFire.style.display = "none";
}

nitroButton.addEventListener("pointerdown",function(e){
  e.preventDefault();
  nitroOn();
});

nitroButton.addEventListener("pointerup",nitroOff);
nitroButton.addEventListener("pointercancel",nitroOff);
nitroButton.addEventListener("pointerleave",nitroOff);


/* =========================
   RANDOM LANE
========================= */

function randomLane(){
  return Math.floor(Math.random()*3);
}


/* =========================
   RESET TRAFFIC
========================= */

function resetCar(obj,index){

  const data = carData[index];

  data.lane = randomLane();
  data.y = -180 - Math.random()*600;
  data.speed = 2.5 + Math.random()*2;

  obj.style.left =
    ((road.clientWidth/3)*data.lane +
    road.clientWidth/6 -
    obj.offsetWidth/2) + "px";

  obj.style.transform =
    "translateY(" + data.y + "px)";
}


/* =========================
   RESET COINS
========================= */

function resetCoin(obj,index){

  const data = coinData[index];

  data.lane = randomLane();
  data.y = -300 - Math.random()*900;

  obj.style.left =
    ((road.clientWidth/3)*data.lane +
    road.clientWidth/6 -
    obj.offsetWidth/2) + "px";

  obj.style.transform =
    "translateY(" + data.y + "px)";
}


/* =========================
   COLLISION
========================= */

function hit(a,b){

  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();

  return !(
    r1.right < r2.left ||
    r1.left > r2.right ||
    r1.bottom < r2.top ||
    r1.top > r2.bottom
  );
}


/* =========================
   HUD
========================= */

function updateHUD(){

  scoreText.textContent = score;
  livesText.textContent = lives;
  coinsText.textContent = coins;
  bestText.textContent = best;

  speedText.textContent =
    Math.round(speed * 22);
}


/* =========================
   START GAME
========================= */

function startGame(){

  cancelAnimationFrame(animationId);

  running = true;

  score = 0;
  coins = 0;
  lives = 3;

  speed = 4;
  nitro = false;

  lane = 1;

  startScreen.style.display = "none";
  gameOver.style.display = "none";

  nitroFire.style.display = "none";

  moveBike();

  carData = cars.map(function(){
    return {
      lane:0,
      y:-300,
      speed:3
    };
  });

  coinData = coinObjects.map(function(){
    return {
      lane:0,
      y:-400
    };
  });

  cars.forEach(function(car,index){
    resetCar(car,index);
  });

  coinObjects.forEach(function(coin,index){
    resetCoin(coin,index);
  });

  updateHUD();

  gameLoop();
}


/* =========================
   GAME OVER
========================= */

function endGame(){

  running = false;

  nitroOff();

  cancelAnimationFrame(animationId);

  if(score > best){

    best = score;

    localStorage.setItem(
      "bikeBest",
      best
    );
  }

  finalScore.textContent = score;
  finalCoins.textContent = coins;
  finalBest.textContent = best;

  gameOver.style.display = "flex";

  updateHUD();
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

  if(!running) return;

  const currentSpeed =
    nitro ? speed + 5 : speed;

  if(score > 0 && score % 300 === 0){
    speed = Math.min(speed + 0.002,8);
  }

  /* TRAFFIC */

  cars.forEach(function(car,index){

    const data = carData[index];

    data.y += currentSpeed + data.speed;

    car.style.transform =
      "translateY(" + data.y + "px)";

    if(data.y > road.clientHeight + 150){

      score += 1;

      resetCar(car,index);
    }

    if(hit(bike,car)){

      lives--;

      resetCar(car,index);

      if(lives <= 0){

        endGame();
        return;
      }

      updateHUD();
    }
  });


  /* COINS */

  coinObjects.forEach(function(coin,index){

    const data = coinData[index];

    data.y += currentSpeed;

    coin.style.transform =
      "translateY(" + data.y + "px)";

    if(data.y > road.clientHeight + 100){

      resetCoin(coin,index);
    }

    if(hit(bike,coin)){

      coins++;
      score += 5;

      resetCoin(coin,index);

      updateHUD();
    }
  });


  updateHUD();

  animationId =
    requestAnimationFrame(gameLoop);
}


/* =========================
   BUTTONS
========================= */

startButton.addEventListener(
  "click",
  startGame
);

restartButton.addEventListener(
  "click",
  startGame
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  moveBike
);


/* =========================
   INITIAL
========================= */

moveBike();
updateHUD();

})();
</script>

</body>
</html>
