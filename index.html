<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mountain Bike Racing</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 font-family:Arial,sans-serif;background:#222
}
#game{
 position:fixed;inset:0;overflow:hidden;
 background:#6fa0bd
}

/* REAL MOUNTAIN BACKGROUND */
.mountains{
 position:absolute;inset:0;
 background:
 url("https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Mountain_highway_%28Unsplash%29.jpg/1280px-Mountain_highway_%28Unsplash%29.jpg")
 center/cover no-repeat;
}
.mountains:after{
 content:"";
 position:absolute;inset:0;
 background:linear-gradient(
  rgba(20,40,50,.05),
  rgba(5,10,15,.18) 50%,
  rgba(5,8,12,.55)
 );
}

/* ROAD */
.road{
 position:absolute;
 left:50%;bottom:-5%;
 transform:translateX(-50%);
 width:88%;height:73%;
 background:linear-gradient(
  90deg,#24282b,#505357 50%,#24282b
 );
 clip-path:polygon(39% 0,61% 0,100% 100%,0 100%);
 box-shadow:0 -5px 30px #111;
}
.roadLine{
 position:absolute;
 left:50%;bottom:0;
 width:7px;height:72%;
 transform:translateX(-50%);
 background:repeating-linear-gradient(
  to bottom,
  #fff 0 45px,
  transparent 45px 95px
 );
 opacity:.9;
}

/* SIDE RAILS */
.rail{
 position:absolute;
 height:5px;width:55%;
 bottom:30%;
 background:#d8dde0;
 box-shadow:0 0 8px white;
}
.rail.left{left:-10%;transform:rotate(-8deg)}
.rail.right{right:-10%;transform:rotate(8deg)}

/* HUD */
.hud{
 position:absolute;top:12px;left:10px;right:10px;
 display:flex;gap:7px;justify-content:space-between;
 z-index:20
}
.stat{
 background:rgba(12,22,29,.88);
 border:1px solid #687983;
 border-radius:10px;
 min-width:72px;
 padding:7px 5px;
 text-align:center;color:white;
 box-shadow:0 3px 10px #0008
}
.stat small{
 display:block;color:#bbc7cd;font-size:9px
}
.stat b{font-size:18px}

.speed{
 position:absolute;
 top:91px;left:50%;
 transform:translateX(-50%);
 color:#fff;font-size:21px;
 font-weight:bold;
 text-shadow:0 3px 6px #000;
 z-index:20
}

/* BIKE */
.bike{
 position:absolute;
 z-index:15;
 left:50%;bottom:3%;
 width:145px;height:265px;
 transform:translateX(-50%);
 filter:drop-shadow(0 18px 10px #000b)
}
.wheel{
 position:absolute;
 left:50%;transform:translateX(-50%);
 width:43px;height:82px;
 border-radius:50%;
 background:
 radial-gradient(circle,#888 0 13%,#111 15% 34%,
 #777 36% 42%,#050505 44%);
 border:4px solid #111
}
.wheel.front{top:30px}
.wheel.back{bottom:0}
.fairing{
 position:absolute;
 left:50%;top:78px;
 transform:translateX(-50%);
 width:83px;height:118px;
 border-radius:38px 38px 25px 25px;
 background:linear-gradient(
  90deg,#69000a,#f00018 45%,#7a000c
 );
 box-shadow:
 inset 7px 0 12px #ff6870,
 inset -8px 0 12px #350006
}
.tail{
 position:absolute;
 left:50%;top:69px;
 transform:translateX(-50%);
 width:91px;height:39px;
 background:linear-gradient(#ef1020,#650009);
 border-radius:50%
}
.seat{
 position:absolute;
 left:50%;top:103px;
 transform:translateX(-50%);
 width:48px;height:65px;
 border-radius:50%;
 background:#101214
}
.handle{
 position:absolute;
 left:50%;top:57px;
 transform:translateX(-50%);
 width:108px;height:8px;
 border-radius:8px;background:#111
}
.rider{
 position:absolute;
 left:50%;top:8px;
 transform:translateX(-50%);
 width:38px;height:57px;
 border-radius:50% 50% 40% 40%;
 background:linear-gradient(#111,#292929)
}
.helmet{
 position:absolute;
 left:50%;top:10px;
 transform:translateX(-50%);
 width:31px;height:27px;
 border-radius:50%;
 background:#111;
 box-shadow:inset 0 -7px 0 #233a46
}
.light{
 position:absolute;
 left:50%;top:80px;
 transform:translateX(-50%);
 width:20px;height:12px;
 border-radius:50%;
 background:#fff8a0;
 box-shadow:0 0 18px #fff
}

/* CARS */
.car{
 position:absolute;
 z-index:10;
 width:60px;height:96px;
 border-radius:13px;
 background:linear-gradient(
  90deg,#222,#999 45%,#292929
 );
 box-shadow:0 10px 15px #0009
}
.car:before{
 content:"";
 position:absolute;
 left:9px;right:9px;top:14px;
 height:29px;
 border-radius:7px;
 background:linear-gradient(#17242a,#9fb5bd)
}
.car:after{
 content:"";
 position:absolute;
 left:13px;right:13px;bottom:9px;
 height:11px;
 border-radius:4px;
 background:#e60014;
 box-shadow:0 0 12px #f00
}

/* COINS */
.coin{
 position:absolute;
 z-index:12;
 width:25px;height:25px;
 border-radius:50%;
 background:#ffe95b;
 border:4px solid #ffad00;
 box-shadow:0 0 18px #ffc400;
}

/* BUTTONS */
.controls{
 position:absolute;
 z-index:30;
 left:0;right:0;bottom:22px;
 display:flex;
 justify-content:space-between;
 padding:0 35px
}
.control{
 width:88px;height:88px;
 border-radius:50%;
 border:2px solid #dbe1e5;
 background:#101820aa;
 color:white;
 font-size:52px;
 line-height:70px;
 touch-action:none
}
#nitro{
 position:absolute;
 right:45px;bottom:132px;
 width:86px;height:86px;
 border:0;border-radius:50%;
 background:linear-gradient(#ff8619,#e53200);
 color:white;font-weight:bold;
 font-size:16px;
 box-shadow:0 0 25px #ff4d00aa;
 z-index:31;
 touch-action:none
}

/* START */
.start{
 position:absolute;inset:0;
 z-index:50;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#0007
}
.panel{
 width:88%;max-width:350px;
 padding:25px;
 text-align:center;
 color:white;
 border-radius:18px;
 background:#071018eF;
 border:1px solid #ffffff33
}
.panel h1{margin:0 0 10px}
.panel p{color:#cbd4d9;font-size:14px}
#startBtn{
 border:0;
 padding:14px 30px;
 border-radius:12px;
 background:#e53935;
 color:white;
 font-weight:bold;
 font-size:18px
}
.hide{display:none}
</style>
</head>

<body>

<div id="game">

<div class="mountains"></div>

<div class="road">
 <div class="roadLine"></div>
</div>

<div class="rail left"></div>
<div class="rail right"></div>

<div class="hud">
 <div class="stat"><small>SCORE</small><b id="score">0</b></div>
 <div class="stat"><small>COINS</small><b id="coins">0</b></div>
 <div class="stat"><small>LIVES</small><b id="lives">3</b></div>
 <div class="stat"><small>BEST</small><b id="best">0</b></div>
</div>

<div class="speed" id="speed">105 KM/H</div>

<!-- BIKE -->
<div class="bike" id="bike">
 <div class="wheel front"></div>
 <div class="wheel back"></div>
 <div class="rider"></div>
 <div class="helmet"></div>
 <div class="handle"></div>
 <div class="tail"></div>
 <div class="seat"></div>
 <div class="fairing"></div>
 <div class="light"></div>
</div>

<button id="nitro">NITRO</button>

<div class="controls">
 <button class="control" id="left">‹</button>
 <button class="control" id="right">›</button>
</div>

<div class="start" id="start">
 <div class="panel">
  <h1>🏍️ Mountain Highway</h1>
  <p>
   Race through the mountains.<br>
   Avoid traffic and collect coins.
  </p>
  <button id="startBtn">START RACE</button>
 </div>
</div>

</div>

<script>
const game=document.getElementById("game");
const bike=document.getElementById("bike");

const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const livesEl=document.getElementById("lives");
const bestEl=document.getElementById("best");
const speedEl=document.getElementById("speed");

let running=false;
let playerX=50;
let score=0;
let coins=0;
let lives=3;
let best=Number(localStorage.getItem("bikeBest")||0);
let nitro=false;

let cars=[];
let coinList=[];

let last=0;
let carTimer=0;
let coinTimer=0;

bestEl.textContent=best;

function move(dir){
 if(!running)return;

 playerX+=dir*5;

 if(playerX<28)playerX=28;
 if(playerX>72)playerX=72;

 bike.style.left=playerX+"%";
}

function createCar(){

 const car=document.createElement("div");
 car.className="car";

 const lanes=[35,50,65];
 const lane=lanes[Math.floor(Math.random()*lanes.length)];

 car.style.left=lane+"%";
 car.style.top="-100px";

 game.appendChild(car);

 cars.push({
  el:car,
  x:lane,
  y:-100
 });
}

function createCoin(){

 const coin=document.createElement("div");
 coin.className="coin";

 const lanes=[39,50,61];
 const lane=lanes[Math.floor(Math.random()*lanes.length)];

 coin.style.left=lane+"%";
 coin.style.top="-30px";

 game.appendChild(coin);

 coinList.push({
  el:coin,
  x:lane,
  y:-30
 });
}

function collision(x1,y1,x2,y2){
 return Math.abs(x1-x2)<8 &&
        Math.abs(y1-y2)<75;
}

function gameLoop(time){

 if(!running)return;

 const dt=Math.min(.035,(time-last)/1000);
 last=time;

 const boost=nitro?1.8:1;

 score+=dt*100*boost;
 scoreEl.textContent=Math.floor(score);

 speedEl.textContent=
   Math.floor(105*boost)+" KM/H";

 carTimer-=dt*boost;
 coinTimer-=dt*boost;

 if(carTimer<=0){
  createCar();
  carTimer=.75+Math.random()*.65;
 }

 if(coinTimer<=0){
  createCoin();
  coinTimer=.55+Math.random()*.55;
 }

 cars.forEach(c=>{

  c.y+=dt*360*boost;
  c.el.style.top=c.y+"px";

  const scale=.45+c.y/1000;
  c.el.style.transform=
    "translateX(-50%) scale("+scale+")";

  if(c.y>window.innerHeight*.60 &&
     c.y<window.innerHeight*.95 &&
     collision(c.x,playerX,c.y,window.innerHeight*.80)){

    c.y=window.innerHeight+200;
    lives--;

    livesEl.textContent=lives;

    bike.animate(
     [
      {transform:"translateX(-50%) rotate(-9deg)"},
      {transform:"translateX(-50%) rotate(9deg)"},
      {transform:"translateX(-50%) rotate(0)"}
     ],
     {duration:300}
    );

    if(lives<=0){
     endGame();
    }
  }
 });

 cars=cars.filter(c=>{
  if(c.y>window.innerHeight+150){
   c.el.remove();
   return false;
  }
  return true;
 });

 coinList.forEach(c=>{

  c.y+=dt*330*boost;
  c.el.style.top=c.y+"px";

  const scale=.5+c.y/1000;
  c.el.style.transform="scale("+scale+")";

  if(c.y>window.innerHeight*.60 &&
     c.y<window.innerHeight*.90 &&
     Math.abs(c.x-playerX)<9){

    coins++;
    score+=250;

    coinsEl.textContent=coins;

    c.y=window.innerHeight+200;
  }
 });

 coinList=coinList.filter(c=>{
  if(c.y>window.innerHeight+100){
   c.el.remove();
   return false;
  }
  return true;
 });

 requestAnimationFrame(gameLoop);
}

function startGame(){

 score=0;
 coins=0;
 lives=3;
 playerX=50;

 cars.forEach(c=>c.el.remove());
 coinList.forEach(c=>c.el.remove());

 cars=[];
 coinList=[];

 scoreEl.textContent="0";
 coinsEl.textContent="0";
 livesEl.textContent="3";

 bike.style.left="50%";

 document.getElementById("start")
   .classList.add("hide");

 running=true;
 last=performance.now();

 requestAnimationFrame(gameLoop);
}

function endGame(){

 running=false;

 best=Math.max(best,Math.floor(score));

 localStorage.setItem("bikeBest",best);

 bestEl.textContent=best;

 document.querySelector(".panel h1")
   .textContent="🏁 GAME OVER";

 document.querySelector(".panel p")
   .innerHTML=
    "Score: "+Math.floor(score)+
    "<br>Coins: "+coins;

 document.getElementById("startBtn")
   .textContent="PLAY AGAIN";

 document.getElementById("start")
   .classList.remove("hide");
}

/* MOBILE */
document.getElementById("left")
 .addEventListener("pointerdown",()=>move(-1));

document.getElementById("right")
 .addEventListener("pointerdown",()=>move(1));

/* KEYBOARD */
document.addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
  move(-1);

 if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
  move(1);

 if(e.code==="Space")
  nitro=true;
});

document.addEventListener("keyup",e=>{
 if(e.code==="Space")
  nitro=false;
});

/* NITRO */
const nitroBtn=document.getElementById("nitro");

nitroBtn.addEventListener("pointerdown",()=>{
 nitro=true;
});

nitroBtn.addEventListener("pointerup",()=>{
 nitro=false;
});

nitroBtn.addEventListener("pointercancel",()=>{
 nitro=false;
});

/* START */
document.getElementById("startBtn")
 .addEventListener("click",startGame);
</script>

</body>
</html>
