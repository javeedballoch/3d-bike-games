<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mountain Highway Racing</title>

<style>
*{
 box-sizing:border-box;
}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#111;
 font-family:Arial,sans-serif;
 touch-action:none;
}
#game{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:#6d9eb5;
}

/* BACKGROUND */
#mountain{
 position:absolute;
 inset:0;
 background:
 linear-gradient(
  rgba(50,100,125,.05),
  rgba(0,0,0,.18)
 ),
 url("https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Mountain_highway_%28Unsplash%29.jpg/1280px-Mountain_highway_%28Unsplash%29.jpg")
 center center/cover no-repeat;
}

/* ROAD */
#road{
 position:absolute;
 left:50%;
 bottom:-12%;
 width:100%;
 height:72%;
 transform:translateX(-50%);
 clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
 background:
 linear-gradient(
  90deg,
  #191c20 0%,
  #44484b 48%,
  #505356 50%,
  #191c20 100%
 );
 box-shadow:0 -10px 30px #0009;
}

#roadLine{
 position:absolute;
 left:50%;
 top:0;
 width:6px;
 height:100%;
 transform:translateX(-50%);
 background:
 repeating-linear-gradient(
  to bottom,
  white 0 42px,
  transparent 42px 88px
 );
}

/* RAILS */
.rail{
 position:absolute;
 bottom:30%;
 width:60%;
 height:6px;
 background:#d7dde0;
 box-shadow:0 0 8px white;
}
.railLeft{
 left:-12%;
 transform:rotate(-9deg);
}
.railRight{
 right:-12%;
 transform:rotate(9deg);
}

/* HUD */
#hud{
 position:absolute;
 z-index:20;
 top:10px;
 left:8px;
 right:8px;
 display:flex;
 justify-content:space-between;
 gap:5px;
}
.box{
 min-width:67px;
 padding:6px;
 color:white;
 text-align:center;
 background:#07131bcc;
 border:1px solid #8999a2;
 border-radius:9px;
 box-shadow:0 3px 10px #0009;
}
.box small{
 display:block;
 color:#bdcbd1;
 font-size:8px;
}
.box b{
 font-size:17px;
}

#speed{
 position:absolute;
 z-index:20;
 top:78px;
 left:50%;
 transform:translateX(-50%);
 color:white;
 font-size:20px;
 font-weight:bold;
 text-shadow:0 3px 6px #000;
}

/* BIKE */
#bike{
 position:absolute;
 z-index:15;
 left:50%;
 bottom:2%;
 width:155px;
 height:275px;
 transform:translateX(-50%);
 filter:drop-shadow(0 18px 10px #000c);
}

.wheel{
 position:absolute;
 left:50%;
 transform:translateX(-50%);
 width:45px;
 height:86px;
 border-radius:50%;
 border:4px solid #050505;
 background:
 radial-gradient(
  circle,
  #aaa 0 12%,
  #111 14% 34%,
  #777 36% 43%,
  #050505 45%
 );
}

.frontWheel{
 top:28px;
}
.backWheel{
 bottom:0;
}

.bikeBody{
 position:absolute;
 left:50%;
 top:77px;
 transform:translateX(-50%);
 width:84px;
 height:123px;
 border-radius:40px 40px 23px 23px;
 background:
 linear-gradient(
  90deg,
  #570006,
  #f20c20 43%,
  #720009
 );
 box-shadow:
 inset 8px 0 12px #ff6670,
 inset -9px 0 13px #300004;
}

.bikeTail{
 position:absolute;
 left:50%;
 top:68px;
 transform:translateX(-50%);
 width:94px;
 height:40px;
 border-radius:50%;
 background:linear-gradient(#ee1726,#5d0007);
}

.seat{
 position:absolute;
 left:50%;
 top:106px;
 transform:translateX(-50%);
 width:50px;
 height:65px;
 border-radius:50%;
 background:#111;
}

.handle{
 position:absolute;
 left:50%;
 top:55px;
 transform:translateX(-50%);
 width:112px;
 height:8px;
 background:#111;
 border-radius:8px;
}

.rider{
 position:absolute;
 left:50%;
 top:8px;
 transform:translateX(-50%);
 width:39px;
 height:61px;
 border-radius:45%;
 background:linear-gradient(#080808,#353535);
}

.helmet{
 position:absolute;
 left:50%;
 top:9px;
 transform:translateX(-50%);
 width:32px;
 height:29px;
 border-radius:50%;
 background:#090909;
 box-shadow:inset 0 -7px 0 #29414c;
}

.headLight{
 position:absolute;
 left:50%;
 top:79px;
 transform:translateX(-50%);
 width:21px;
 height:12px;
 border-radius:50%;
 background:#fff8a5;
 box-shadow:0 0 20px #fff;
}

/* TRAFFIC */
.car{
 position:absolute;
 z-index:12;
 width:60px;
 height:96px;
 border-radius:14px;
 background:
 linear-gradient(
  90deg,
  #202020,
  #aaa 45%,
  #292929
 );
 box-shadow:0 12px 16px #000a;
}

.carWindow{
 position:absolute;
 left:9px;
 right:9px;
 top:14px;
 height:30px;
 border-radius:7px;
 background:linear-gradient(#17262d,#a5bac2);
}

.carLight{
 position:absolute;
 left:12px;
 right:12px;
 bottom:8px;
 height:11px;
 border-radius:4px;
 background:#e50015;
 box-shadow:0 0 12px red;
}

/* COINS */
.coin{
 position:absolute;
 z-index:13;
 width:25px;
 height:25px;
 border-radius:50%;
 background:#ffe65a;
 border:4px solid #ffac00;
 box-shadow:0 0 18px #ffc400;
}

/* CONTROLS */
.controls{
 position:absolute;
 z-index:30;
 left:0;
 right:0;
 bottom:18px;
 display:flex;
 justify-content:space-between;
 padding:0 25px;
}

.steer{
 width:88px;
 height:88px;
 border-radius:50%;
 border:2px solid white;
 background:#08131dcc;
 color:white;
 font-size:50px;
}

#nitro{
 position:absolute;
 z-index:30;
 right:35px;
 bottom:120px;
 width:86px;
 height:86px;
 border:0;
 border-radius:50%;
 background:linear-gradient(#ff941e,#df3000);
 color:white;
 font-weight:900;
 box-shadow:0 0 25px #ff4d00aa;
}

/* START */
#start{
 position:absolute;
 z-index:50;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#0008;
}

.panel{
 width:88%;
 max-width:350px;
 padding:25px;
 text-align:center;
 color:white;
 border-radius:18px;
 background:#061019ef;
 border:1px solid #ffffff33;
}

.panel h1{
 margin:0 0 10px;
}

.panel p{
 color:#cbd6dc;
 font-size:14px;
 line-height:1.5;
}

#startBtn{
 padding:14px 30px;
 border:0;
 border-radius:12px;
 background:#e53935;
 color:white;
 font-size:18px;
 font-weight:900;
}

.hide{
 display:none!important;
}
</style>
</head>

<body>

<div id="game">

<div id="mountain"></div>

<div id="road">
 <div id="roadLine"></div>
</div>

<div class="rail railLeft"></div>
<div class="rail railRight"></div>

<div id="hud">
 <div class="box">
  <small>SCORE</small>
  <b id="score">0</b>
 </div>

 <div class="box">
  <small>COINS</small>
  <b id="coins">0</b>
 </div>

 <div class="box">
  <small>LIVES</small>
  <b id="lives">3</b>
 </div>

 <div class="box">
  <small>BEST</small>
  <b id="best">0</b>
 </div>
</div>

<div id="speed">105 KM/H</div>

<!-- BIKE -->
<div id="bike">

 <div class="wheel frontWheel"></div>
 <div class="wheel backWheel"></div>

 <div class="rider"></div>
 <div class="helmet"></div>

 <div class="handle"></div>
 <div class="bikeTail"></div>
 <div class="seat"></div>

 <div class="bikeBody"></div>

 <div class="headLight"></div>

</div>

<button id="nitro">NITRO</button>

<div class="controls">

 <button class="steer" id="left">
  ‹
 </button>

 <button class="steer" id="right">
  ›
 </button>

</div>

<div id="start">

 <div class="panel">

  <h1>🏍️ Mountain Highway</h1>

  <p>
   Mountain road racing<br>
   Avoid traffic and collect coins.
  </p>

  <button id="startBtn">
   START RACE
  </button>

 </div>

</div>

</div>

<script>

const game=document.getElementById("game");
const bike=document.getElementById("bike");

const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const livesEl=document.getElementById("lives");
const bestEl=document.getElementById("best");
const speedEl=document.getElementById("speed");

let running=false;

let playerX=50;

let score=0;
let coins=0;
let lives=3;

let best=
 Number(localStorage.getItem("mountainBest")||0);

let nitro=false;

let cars=[];
let coinObjects=[];

let lastTime=0;
let carTimer=0;
let coinTimer=0;

bestEl.textContent=best;


/* PLAYER */

function move(direction){

 if(!running)return;

 playerX+=direction*5;

 if(playerX<28)
  playerX=28;

 if(playerX>72)
  playerX=72;

 bike.style.left=
  playerX+"%";
}


/* CREATE CAR */

function createCar(){

 const car=
  document.createElement("div");

 car.className="car";

 const window=
  document.createElement("div");

 window.className="carWindow";

 const light=
  document.createElement("div");

 light.className="carLight";

 car.appendChild(window);
 car.appendChild(light);

 const lanes=[
  35,
  50,
  65
 ];

 const lane=
  lanes[
   Math.floor(
    Math.random()*lanes.length
   )
  ];

 car.style.left=
  lane+"%";

 car.style.top="-110px";

 game.appendChild(car);

 cars.push({
  element:car,
  lane:lane,
  y:-110
 });
}


/* CREATE COIN */

function createCoin(){

 const coin=
  document.createElement("div");

 coin.className="coin";

 const lanes=[
  40,
  50,
  60
 ];

 const lane=
  lanes[
   Math.floor(
    Math.random()*lanes.length
   )
  ];

 coin.style.left=
  lane+"%";

 coin.style.top="-30px";

 game.appendChild(coin);

 coinObjects.push({
  element:coin,
  lane:lane,
  y:-30
 });
}


/* GAME OVER */

function gameOver(){

 running=false;

 best=Math.max(
  best,
  Math.floor(score)
 );

 localStorage.setItem(
  "mountainBest",
  best
 );

 bestEl.textContent=best;

 document.querySelector(
  ".panel h1"
 ).textContent=
  "🏁 GAME OVER";

 document.querySelector(
  ".panel p"
 ).innerHTML=
  "Score: "+
  Math.floor(score)+
  "<br>Coins: "+
  coins;

 document.getElementById(
  "startBtn"
 ).textContent=
  "PLAY AGAIN";

 document.getElementById(
  "start"
 ).classList.remove("hide");
}


/* GAME LOOP */

function gameLoop(time){

 if(!running)return;

 const dt=
  Math.min(
   .035,
   (time-lastTime)/1000 || 0
  );

 lastTime=time;

 const boost=
  nitro ? 1.9 : 1;

 score+=
  dt*105*boost;

 scoreEl.textContent=
  Math.floor(score);

 speedEl.textContent=
  Math.floor(
   105*boost
  )+" KM/H";


 /* SPAWN */

 carTimer-=
  dt*boost;

 coinTimer-=
  dt*boost;

 if(carTimer<=0){

  createCar();

  carTimer=
   .7+
   Math.random()*.7;
 }

 if(coinTimer<=0){

  createCoin();

  coinTimer=
   .5+
   Math.random()*.6;
 }


 /* CARS */

 cars.forEach(car=>{

  car.y+=
   dt*350*boost;

  car.element.style.top=
   car.y+"px";

  const scale=
   .45+
   car.y/1100;

  car.element.style.transform=
   "translateX(-50%) scale("+
   scale+
   ")";


  if(
   car.y>
    innerHeight*.62 &&

   car.y<
    innerHeight*.94 &&

   Math.abs(
    car.lane-playerX
   )<8
  ){

   car.y=
    innerHeight+300;

   lives--;

   livesEl.textContent=
    lives;

   bike.animate(
    [
     {
      transform:
       "translateX(-50%) rotate(-10deg)"
     },
     {
      transform:
       "translateX(-50%) rotate(10deg)"
     },
     {
      transform:
       "translateX(-50%) rotate(0)"
     }
    ],
    {
     duration:300
    }
   );

   if(lives<=0){

    gameOver();
   }
  }

 });


 cars=
  cars.filter(car=>{

   if(
    car.y>
     innerHeight+150
   ){

    car.element.remove();

    return false;
   }

   return true;
  });


 /* COINS */

 coinObjects.forEach(coin=>{

  coin.y+=
   dt*330*boost;

  coin.element.style.top=
   coin.y+"px";

  coin.element.style.transform=
   "rotateY("+
   (coin.y*4)+
   "deg)";


  if(
   coin.y>
    innerHeight*.62 &&

   coin.y<
    innerHeight*.92 &&

   Math.abs(
    coin.lane-playerX
   )<8
  ){

   coins++;

   score+=250;

   coinsEl.textContent=
    coins;

   coin.y=
    innerHeight+300;
  }

 });


 coinObjects=
  coinObjects.filter(coin=>{

   if(
    coin.y>
     innerHeight+120
   ){

    coin.element.remove();

    return false;
   }

   return true;
  });


 requestAnimationFrame(
  gameLoop
 );
}


/* START */

function startGame(){

 score=0;
 coins=0;
 lives=3;
 playerX=50;

 scoreEl.textContent="0";
 coinsEl.textContent="0";
 livesEl.textContent="3";

 bike.style.left="50%";

 cars.forEach(
  c=>c.element.remove()
 );

 coinObjects.forEach(
  c=>c.element.remove()
 );

 cars=[];
 coinObjects=[];

 document.getElementById(
  "start"
 ).classList.add("hide");

 running=true;

 lastTime=
  performance.now();

 requestAnimationFrame(
  gameLoop
 );
}


/* BUTTONS */

document.getElementById(
 "startBtn"
).onclick=startGame;


document.getElementById(
 "left"
).addEventListener(
 "pointerdown",
 ()=>{
  move(-1);
 }
);


document.getElementById(
 "right"
).addEventListener(
 "pointerdown",
 ()=>{
  move(1);
 }
);


/* NITRO */

const nitroBtn=
 document.getElementById("nitro");

nitroBtn.addEventListener(
 "pointerdown",
 ()=>{
  nitro=true;
 }
);

nitroBtn.addEventListener(
 "pointerup",
 ()=>{
  nitro=false;
 }
);

nitroBtn.addEventListener(
 "pointercancel",
 ()=>{
  nitro=false;
 }
);


/* KEYBOARD */

document.addEventListener(
 "keydown",
 e=>{

  if(
   e.key==="ArrowLeft" ||
   e.key.toLowerCase()==="a"
  ){
   move(-1);
  }

  if(
   e.key==="ArrowRight" ||
   e.key.toLowerCase()==="d"
  ){
   move(1);
  }

  if(e.code==="Space"){
   nitro=true;
  }

 }
);


document.addEventListener(
 "keyup",
 e=>{

  if(e.code==="Space"){
   nitro=false;
  }

 }
);

</script>

</body>
</html>
