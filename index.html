<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Street Bike Racing 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#69b5e8;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:#72b9e8;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* HUD */
#hud{
  position:absolute;
  top:8px;
  left:7px;
  right:7px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  gap:5px;
  color:white;
  font-weight:bold;
  text-align:center;
  text-shadow:2px 2px 4px #000;
}

.box{
  min-width:65px;
  padding:6px 8px;
  border-radius:8px;
  background:#111c;
  border:1px solid #ffffff55;
  font-size:13px;
}

.box b{
  font-size:21px;
}

/* SPEED */
#speedBox{
  position:absolute;
  left:15px;
  bottom:115px;
  z-index:20;
  width:105px;
  height:105px;
  border-radius:50%;
  background:#111d;
  border:5px solid #62d8ff;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-shadow:1px 1px 3px #000;
}

#speed{
  font-size:28px;
  font-weight:bold;
}

/* NITRO */
#nitro{
  position:absolute;
  right:16px;
  bottom:125px;
  z-index:30;
  border:0;
  border-radius:35px;
  padding:18px 28px;
  background:linear-gradient(#ff7915,#f03b00);
  color:white;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 5px 15px #000;
  touch-action:none;
}

/* CONTROLS */
#controls{
  position:absolute;
  left:18px;
  right:18px;
  bottom:18px;
  z-index:30;
  display:flex;
  justify-content:space-between;
}

.control{
  width:92px;
  height:70px;
  border-radius:22px;
  border:3px solid #aaa;
  background:#101820dd;
  color:white;
  font-size:40px;
  font-weight:bold;
  box-shadow:0 5px 12px #000;
  touch-action:none;
  user-select:none;
}

/* SCREENS */
.screen{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0009;
  text-align:center;
}

.panel{
  width:88%;
  max-width:340px;
  padding:28px 20px;
  border-radius:22px;
  color:white;
  background:#101820ee;
  border:1px solid #ffffff55;
  box-shadow:0 10px 35px #000;
}

.panel h1{
  margin:0 0 8px;
  font-size:30px;
}

.panel p{
  line-height:1.6;
}

.play{
  border:0;
  border-radius:30px;
  padding:15px 28px;
  background:#13bb5d;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div id="game">

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="box">🏆<br><b id="score">0</b></div>
  <div class="box">❤️<br><b id="lives">3</b></div>
  <div class="box">🪙<br><b id="coins">0</b></div>
  <div class="box">BEST<br><b id="best">0</b></div>
</div>

<!-- SPEED -->
<div id="speedBox">
  SPEED
  <span id="speed">0</span>
  <small>KM/H</small>
</div>

<!-- NITRO -->
<button id="nitro">🔥 NITRO</button>

<!-- CONTROLS -->
<div id="controls">
  <button class="control" id="left">⬅</button>
  <button class="control" id="right">➡</button>
</div>

<!-- START -->
<div id="startScreen" class="screen">

  <div class="panel">

    <h1>🏍️ STREET RACING</h1>

    <p>
      🏔️ Mountain Highway<br>
      🚗 Real Traffic<br>
      🪙 Collect Coins<br>
      🔥 Nitro Boost
    </p>

    <button class="play" id="startButton">
      START RACE
    </button>

  </div>

</div>

<!-- GAME OVER -->
<div id="gameOver" class="screen hidden">

  <div class="panel">

    <h1>💥 CRASH!</h1>

    <p>
      Score: <b id="finalScore">0</b><br>
      Coins: <b id="finalCoins">0</b><br>
      Best: <b id="finalBest">0</b>
    </p>

    <button class="play" id="restartButton">
      🏍️ RACE AGAIN
    </button>

  </div>

</div>

</div>

<script>
"use strict";

/* =========================
   GAME SETUP
========================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

let running = false;

let score = 0;
let coins = 0;
let lives = 3;

let best = Number(localStorage.getItem("bikeBest") || 0);

let speed = 4;
let roadMove = 0;

let bikeX = 0;

let leftPressed = false;
let rightPressed = false;
let nitroPressed = false;

let traffic = [];
let coinObjects = [];

let spawnTimer = 0;


/* =========================
   RESIZE
========================= */

function resize(){

  W = window.innerWidth;
  H = window.innerHeight;

  const dpr = Math.min(window.devicePixelRatio || 1,2);

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);

resize();


/* =========================
   HUD
========================= */

function updateHUD(){

  document.getElementById("score").textContent = score;

  document.getElementById("coins").textContent = coins;

  document.getElementById("lives").textContent = lives;

  document.getElementById("best").textContent = best;

  document.getElementById("speed").textContent =
    Math.round(speed * 28);

}


/* =========================
   ROAD
========================= */

function roadCenter(y){

  const horizon = H * 0.35;

  let t = (y - horizon) / (H - horizon);

  t = Math.max(0,Math.min(1,t));

  return W / 2 +
    Math.sin(roadMove * 0.001 + t * 2) *
    W * 0.05 * t;
}


function roadWidth(y){

  const horizon = H * 0.35;

  let t = (y - horizon) / (H - horizon);

  t = Math.max(0,Math.min(1,t));

  return W * (0.25 + 0.62 * t);
}


/* =========================
   BACKGROUND
========================= */

function drawBackground(){

  /* Sky */

  const sky = ctx.createLinearGradient(
    0,0,0,H
  );

  sky.addColorStop(0,"#63b4e8");
  sky.addColorStop(0.5,"#bde4f5");
  sky.addColorStop(0.51,"#6caf55");
  sky.addColorStop(1,"#3d923e");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);


  /* Sun */

  ctx.fillStyle="#ffeaa0";

  ctx.beginPath();

  ctx.arc(
    W*0.78,
    H*0.18,
    42,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Mountains */

  drawMountain(
    0,
    H*.43,
    W*.22,
    H*.18,
    "#567e77"
  );

  drawMountain(
    W*.15,
    H*.43,
    W*.48,
    H*.10,
    "#668d8b"
  );

  drawMountain(
    W*.45,
    H*.43,
    W*.75,
    H*.16,
    "#4f766e"
  );

  drawMountain(
    W*.70,
    H*.43,
    W*1.05,
    H*.20,
    "#5d847c"
  );
}


function drawMountain(x1,y,x2,peak,color){

  ctx.fillStyle=color;

  ctx.beginPath();

  ctx.moveTo(x1,y);

  ctx.lineTo(
    (x1+x2)/2,
    peak
  );

  ctx.lineTo(x2,y);

  ctx.closePath();

  ctx.fill();
}


/* =========================
   ROAD
========================= */

function drawRoad(){

  const horizon = H * .35;

  const topCenter = roadCenter(horizon);

  const bottomCenter = roadCenter(H);

  const topWidth = roadWidth(horizon);

  const bottomWidth = roadWidth(H);


  /* Road */

  ctx.fillStyle="#303234";

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.closePath();

  ctx.fill();


  /* Road edge */

  ctx.strokeStyle="#ffffff";

  ctx.lineWidth=6;

  ctx.beginPath();

  ctx.moveTo(
    topCenter-topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter-bottomWidth/2,
    H
  );

  ctx.moveTo(
    topCenter+topWidth/2,
    horizon
  );

  ctx.lineTo(
    bottomCenter+bottomWidth/2,
    H
  );

  ctx.stroke();


  /* Lane lines */

  for(let i=0;i<18;i++){

    let t =
      ((i/18)+(roadMove*.002)%1);

    if(t>1)t-=1;

    let y =
      horizon +
      t*t*(H-horizon);

    let w = roadWidth(y);

    let x = roadCenter(y);

    if(i%2===0){

      ctx.strokeStyle="#eeeeee";

      ctx.lineWidth =
        Math.max(2,5*t);

      for(const lane of [-.166,.166]){

        ctx.beginPath();

        ctx.moveTo(
          x+w*lane,
          y-22*t
        );

        ctx.lineTo(
          x+w*lane,
          y+22*t
        );

        ctx.stroke();
      }
    }
  }
}


/* =========================
   TREES
========================= */

function tree(x,y,size){

  ctx.save();

  ctx.translate(x,y);

  ctx.scale(size,size);

  /* shadow */

  ctx.fillStyle="#0003";

  ctx.beginPath();

  ctx.ellipse(
    0,
    42,
    28,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* trunk */

  ctx.fillStyle="#70432c";

  ctx.fillRect(
    -6,
    5,
    12,
    40
  );


  /* leaves */

  ctx.fillStyle="#258b38";

  ctx.beginPath();

  ctx.arc(-14,5,22,0,Math.PI*2);

  ctx.arc(14,2,23,0,Math.PI*2);

  ctx.arc(0,-15,27,0,Math.PI*2);

  ctx.fill();


  ctx.fillStyle="#62bd38";

  ctx.beginPath();

  ctx.arc(-8,-12,12,0,Math.PI*2);

  ctx.arc(11,-5,10,0,Math.PI*2);

  ctx.fill();

  ctx.restore();
}


/* =========================
   CAR
========================= */

function drawCar(car){

  const y = car.y;

  let t =
    (y-H*.35)/(H*.65);

  t=Math.max(.1,Math.min(1,t));

  const w=42+55*t;

  const h=65+85*t;

  const x =
    roadCenter(y) +
    car.lane * roadWidth(y)*.30;


  ctx.save();

  ctx.translate(x,y);


  /* shadow */

  ctx.fillStyle="#0007";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.45,
    w*.55,
    10*t+3,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* car */

  ctx.fillStyle=car.color;

  ctx.beginPath();

  ctx.roundRect(
    -w/2,
    -h/2,
    w,
    h,
    10*t+5
  );

  ctx.fill();


  /* windows */

  ctx.fillStyle="#b9e4ef";

  ctx.beginPath();

  ctx.roundRect(
    -w*.31,
    -h*.32,
    w*.62,
    h*.25,
    5
  );

  ctx.fill();


  /* headlights */

  ctx.fillStyle="#fff3a0";

  ctx.fillRect(
    -w*.37,
    h*.29,
    w*.18,
    7
  );

  ctx.fillRect(
    w*.19,
    h*.29,
    w*.18,
    7
  );


  /* wheels */

  ctx.fillStyle="#111";

  ctx.fillRect(
    -w*.56,
    -h*.30,
    7,
    h*.22
  );

  ctx.fillRect(
    w*.49,
    -h*.30,
    7,
    h*.22
  );

  ctx.fillRect(
    -w*.56,
    h*.12,
    7,
    h*.22
  );

  ctx.fillRect(
    w*.49,
    h*.12,
    7,
    h*.22
  );

  ctx.restore();


  return {
    x:x,
    y:y,
    w:w,
    h:h
  };
}


/* =========================
   COIN
========================= */

function drawCoin(c){

  const y=c.y;

  let t =
    (y-H*.35)/(H*.65);

  t=Math.max(.1,Math.min(1,t));

  const r=10+16*t;

  const x =
    roadCenter(y) +
    c.lane*roadWidth(y)*.30;


  ctx.save();

  ctx.translate(x,y);

  ctx.rotate(roadMove*.015);


  ctx.fillStyle="#ffc928";

  ctx.strokeStyle="#fff1a0";

  ctx.lineWidth=3;


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.stroke();


  ctx.fillStyle="#fff1a0";

  ctx.font =
    Math.max(12,r) +
    "px Arial";

  ctx.textAlign="center";

  ctx.textBaseline="middle";

  ctx.fillText("★",0,1);

  ctx.restore();


  return {
    x:x,
    y:y,
    r:r
  };
}


/* =========================
   REALISTIC BIKE
========================= */

function drawBike(){

  const x=W/2+bikeX;

  const y=H-185;


  ctx.save();

  ctx.translate(x,y);


  /* shadow */

  ctx.fillStyle="#0008";

  ctx.beginPath();

  ctx.ellipse(
    0,
    75,
    42,
    11,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* back wheel */

  ctx.fillStyle="#101010";

  ctx.beginPath();

  ctx.ellipse(
    0,
    55,
    18,
    34,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle="#777";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.ellipse(
    0,
    55,
    12,
    28,
    0,
    0,
    Math.PI*2
  );

  ctx.stroke();


  /* front wheel */

  ctx.fillStyle="#101010";

  ctx.beginPath();

  ctx.ellipse(
    0,
    -52,
    17,
    30,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle="#777";

  ctx.beginPath();

  ctx.ellipse(
    0,
    -52,
    11,
    24,
    0,
    0,
    Math.PI*2
  );

  ctx.stroke();


  /* red body */

  const body =
    ctx.createLinearGradient(
      -25,0,25,0
    );

  body.addColorStop(0,"#680008");

  body.addColorStop(.45,"#f01620");

  body.addColorStop(.7,"#c5000b");

  body.addColorStop(1,"#500006");


  ctx.fillStyle=body;

  ctx.beginPath();

  ctx.roundRect(
    -23,
    -28,
    46,
    82,
    18
  );

  ctx.fill();


  /* fuel tank */

  ctx.fillStyle="#e51a22";

  ctx.beginPath();

  ctx.ellipse(
    0,
    -12,
    27,
    22,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* rider */

  ctx.fillStyle="#101010";

  ctx.beginPath();

  ctx.ellipse(
    0,
    10,
    19,
    28,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* helmet */

  ctx.fillStyle="#202020";

  ctx.beginPath();

  ctx.arc(
    0,
    -42,
    19,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle="#666";

  ctx.lineWidth=3;

  ctx.stroke();


  /* helmet glass */

  ctx.fillStyle="#8bd9ed";

  ctx.fillRect(
    6,
    -46,
    14,
    7
  );


  /* handle */

  ctx.strokeStyle="#aaa";

  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    -34,
    -23
  );

  ctx.lineTo(
    34,
    -29
  );

  ctx.stroke();


  /* head light */

  ctx.fillStyle="#fff";

  ctx.shadowColor="#fff";

  ctx.shadowBlur=12;

  ctx.beginPath();

  ctx.arc(
    0,
    -22,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;


  /* nitro */

  if(nitroPressed){

    ctx.fillStyle="#ff9d00";

    ctx.beginPath();

    ctx.moveTo(-9,83);

    ctx.lineTo(
      0,
      125+Math.random()*20
    );

    ctx.lineTo(9,83);

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.moveTo(-4,84);

    ctx.lineTo(
      0,
      112+Math.random()*12
    );

    ctx.lineTo(4,84);

    ctx.closePath();

    ctx.fill();
  }


  ctx.restore();
}


/* =========================
   SPAWN
========================= */

function spawnObject(){

  const lanes=[
    -.5,
    0,
    .5
  ];

  const lane=
    lanes[
      Math.floor(
        Math.random()*lanes.length
      )
    ];


  if(Math.random()<.72){

    const colors=[
      "#d71920",
      "#1478d4",
      "#f0bd16",
      "#222"
    ];

    traffic.push({

      y:H*.35-80,

      lane:lane,

      color:
        colors[
          Math.floor(
            Math.random()*colors.length
          )
        ]

    });

  }else{

    coinObjects.push({

      y:H*.35-60,

      lane:lane

    });
  }
}


/* =========================
   COLLISION
========================= */

function carCollision(car){

  const player={
    x:W/2+bikeX,
    y:H-185
  };

  return (
    Math.abs(player.x-car.x)<45 &&
    Math.abs(player.y-car.y)<70
  );
}


function coinCollision(c){

  const playerX=W/2+bikeX;
  const playerY=H-185;

  return (
    Math.abs(playerX-c.x)<38 &&
    Math.abs(playerY-c.y)<65
  );
}


/* =========================
   START
========================= */

function startGame(){

  score=0;
  coins=0;
  lives=3;

  speed=4;

  bikeX=0;

  traffic=[];
  coinObjects=[];

  spawnTimer=0;

  roadMove=0;

  running=true;

  leftPressed=false;
  rightPressed=false;
  nitroPressed=false;

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("gameOver")
    .classList.add("hidden");

  updateHUD();
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

  running=false;

  leftPressed=false;
  rightPressed=false;
  nitroPressed=false;


  if(score>best){

    best=score;

    localStorage.setItem(
      "bikeBest",
      best
    );
  }


  document.getElementById(
    "finalScore"
  ).textContent=score;


  document.getElementById(
    "finalCoins"
  ).textContent=coins;


  document.getElementById(
    "finalBest"
  ).textContent=best;


  document
    .getElementById("gameOver")
    .classList.remove("hidden");

  updateHUD();
}


/* =========================
   UPDATE
========================= */

function updateGame(){

  if(!running)return;


  /* steering */

  if(leftPressed){

    bikeX -= 1.25;
  }

  if(rightPressed){

    bikeX += 1.25;
  }


  /* road limit */

  const maxX=W*.31;

  if(bikeX<-maxX)
    bikeX=-maxX;

  if(bikeX>maxX)
    bikeX=maxX;


  /* speed */

  const boost=
    nitroPressed ? 1.8 : 1;

  speed += .008;

  if(speed>8)
    speed=8;


  roadMove +=
    speed*boost;


  /* spawn */

  spawnTimer++;

  if(spawnTimer>42){

    spawnTimer=0;

    spawnObject();
  }


  /* cars */

  for(
    let i=traffic.length-1;
    i>=0;
    i--
  ){

    traffic[i].y +=
      speed*boost*12;


    const car =
      drawCar(traffic[i]);


    if(
      carCollision(car)
    ){

      traffic.splice(i,1);

      lives--;

      updateHUD();


      if(lives<=0){

        gameOver();

        return;
      }

      continue;
    }


    if(
      traffic[i].y >
      H+150
    ){

      traffic.splice(i,1);

      score++;

      updateHUD();
    }
  }


  /* coins */

  for(
    let i=coinObjects.length-1;
    i>=0;
    i--
  ){

    coinObjects[i].y +=
      speed*boost*12;


    const c =
      drawCoin(
        coinObjects[i]
      );


    if(
      coinCollision(c)
    ){

      coinObjects.splice(i,1);

      coins++;

      score+=10;

      updateHUD();

      continue;
    }


    if(
      coinObjects[i].y >
      H+80
    ){

      coinObjects.splice(i,1);
    }
  }


  updateHUD();
}


/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawBackground();

  drawRoad();


  /* roadside trees */

  tree(
    W*.06,
    H*.47,
    .8
  );

  tree(
    W*.94,
    H*.50,
    .9
  );

  tree(
    W*.07,
    H*.73,
    .65
  );

  tree(
    W*.92,
    H*.76,
    .7
  );


  /* objects */

  for(
    const car of traffic
  ){
    drawCar(car);
  }


  for(
    const coin of coinObjects
  ){
    drawCoin(coin);
  }


  drawBike();
}


/* =========================
   MAIN LOOP
========================= */

function gameLoop(){

  updateGame();

  draw();

  requestAnimationFrame(
    gameLoop
  );
}


/* =========================
   MOBILE CONTROLS
========================= */

function holdButton(
  button,
  press,
  release
){

  button.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      press();
    }
  );


  button.addEventListener(
    "pointerup",
    function(e){

      e.preventDefault();

      release();
    }
  );


  button.addEventListener(
    "pointercancel",
    release
  );


  button.addEventListener(
    "pointerleave",
    release
  );
}


/* LEFT */

holdButton(

  document.getElementById("left"),

  function(){
    leftPressed=true;
  },

  function(){
    leftPressed=false;
  }

);


/* RIGHT */

holdButton(

  document.getElementById("right"),

  function(){
    rightPressed=true;
  },

  function(){
    rightPressed=false;
  }

);


/* NITRO */

holdButton(

  document.getElementById("nitro"),

  function(){
    nitroPressed=true;
  },

  function(){
    nitroPressed=false;
  }

);


/* KEYBOARD */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key==="ArrowLeft")
      leftPressed=true;

    if(e.key==="ArrowRight")
      rightPressed=true;

    if(e.code==="Space")
      nitroPressed=true;
  }
);


document.addEventListener(
  "keyup",
  function(e){

    if(e.key==="ArrowLeft")
      leftPressed=false;

    if(e.key==="ArrowRight")
      rightPressed=false;

    if(e.code==="Space")
      nitroPressed=false;
  }
);


/* BUTTONS */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById("restartButton")
  .addEventListener(
    "click",
    startGame
  );


/* INITIAL */

updateHUD();

gameLoop();

updateHUD();

gameLoop();

</script>

</body>
</html>
