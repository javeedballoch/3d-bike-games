<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Super Bike Racing</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#65c9e8;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;z-index:5;top:9px;left:7px;right:7px;display:flex;justify-content:space-between;gap:5px}
.box{min-width:64px;padding:5px 6px;text-align:center;color:#fff;background:#101b25ee;border:2px solid #ffffff55;border-radius:13px;box-shadow:0 4px 12px #0008}
.box small{display:block;font-size:9px}.box b{font-size:20px}
#speed{position:fixed;z-index:5;left:18px;bottom:112px;width:120px;height:120px;border-radius:50%;padding-top:17px;text-align:center;color:#fff;background:#071820f2;border:7px solid #18d9ff;box-shadow:0 0 22px #18d9ff66}
#speed small{font-size:11px}#speed b{display:block;font-size:32px}#speed span{font-size:10px}
#nitro{position:fixed;z-index:7;right:18px;bottom:138px;border:0;border-radius:42px;padding:19px 29px;color:#fff;font-size:21px;font-weight:bold;background:linear-gradient(#ff9a2d,#ed4008);box-shadow:0 7px 18px #0009}
#controls{position:fixed;z-index:7;left:18px;right:18px;bottom:12px;display:flex;justify-content:space-between}
.ctrl{width:112px;height:74px;border:3px solid #fff9;border-radius:40px;background:#07131ddd;color:#fff;font-size:43px;font-weight:bold;box-shadow:0 5px 15px #0008}
#menu{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:#03111acc}
.panel{width:90%;max-width:430px;padding:28px;text-align:center;color:#fff;background:#101c27f7;border:2px solid #fff5;border-radius:28px}
.panel h1{margin:0 0 14px;font-size:29px}.panel p{line-height:1.5;font-size:17px}
.start{border:0;border-radius:32px;padding:16px 32px;background:#12c75b;color:#fff;font-size:21px;font-weight:bold}
.hide{display:none!important}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
<div class="box">🏆<small>SCORE</small><b id="score">0</b></div>
<div class="box">❤️<small>LIVES</small><b id="lives">3</b></div>
<div class="box">🪙<small>COINS</small><b id="coins">0</b></div>
<div class="box"><small>BEST</small><b id="best">0</b></div>
</div>

<div id="speed">
<small>SPEED</small>
<b id="speedValue">0</b>
<span>KM/H</span>
</div>

<button id="nitro">🔥 NITRO</button>

<div id="controls">
<button class="ctrl" id="left">←</button>
<button class="ctrl" id="right">→</button>
</div>

<div id="menu">
<div class="panel">
<h1 id="title">🏍️ 3D SUPER BIKE</h1>
<p id="info">
🏔️ Mountain Highway<br>
🏍️ Detailed Sports Bike<br>
🚗 Traffic Cars<br>
🪙 Golden Coins<br>
🔥 Nitro Boost<br>
💥 Crash System<br><br>
Use LEFT / RIGHT to steer.
</p>
<button class="start" id="start">START RACE</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(()=>{
"use strict";

const $=id=>document.getElementById(id);

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x70c9e6);

scene.fog=new THREE.Fog(
0x70c9e6,
55,
210
);

const camera=new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
.1,
300
);

camera.position.set(0,4.8,10);

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

renderer.setSize(
innerWidth,
innerHeight
);

renderer.shadowMap.enabled=true;

$("game").appendChild(renderer.domElement);


/* LIGHTS */

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x477447,
2.2
)
);

const sun=new THREE.DirectionalLight(
0xffffff,
2.4
);

sun.position.set(-25,45,25);
sun.castShadow=true;

scene.add(sun);


/* GRASS */

const grass=new THREE.Mesh(
new THREE.PlaneGeometry(220,320),
new THREE.MeshLambertMaterial({
color:0x39ad4d
})
);

grass.rotation.x=-Math.PI/2;
grass.position.set(0,0,-80);

scene.add(grass);


/* ROAD */

const road=new THREE.Mesh(
new THREE.PlaneGeometry(16,320),
new THREE.MeshLambertMaterial({
color:0x282d32
})
);

road.rotation.x=-Math.PI/2;
road.position.set(0,.02,-80);
road.receiveShadow=true;

scene.add(road);


/* ROAD EDGES */

const whiteMat=new THREE.MeshBasicMaterial({
color:0xffffff
});

for(const x of [-8.05,8.05]){

const edge=new THREE.Mesh(
new THREE.BoxGeometry(
.18,.03,320
),
whiteMat
);

edge.position.set(x,.06,-80);

scene.add(edge);
}


/* LANE MARKS */

const marks=[];

for(let z=-4;z>-290;z-=10){

for(const x of [-2.67,2.67]){

const mark=new THREE.Mesh(
new THREE.BoxGeometry(
.2,.045,4.8
),
whiteMat
);

mark.position.set(
x,.08,z
);

scene.add(mark);

marks.push(mark);
}
}


/* MOUNTAINS */

function mountain(x,z,s){

const m=new THREE.Mesh(
new THREE.ConeGeometry(
s,
s*1.7,
7
),
new THREE.MeshLambertMaterial({
color:0x688b99
})
);

m.position.set(
x,
s*.82,
z
);

m.rotation.y=Math.random();

scene.add(m);

const snow=new THREE.Mesh(
new THREE.ConeGeometry(
s*.29,
s*.52,
7
),
new THREE.MeshLambertMaterial({
color:0xf4fafb
})
);

snow.position.set(
x,
s*1.53,
z
);

snow.rotation.y=m.rotation.y;

scene.add(snow);
}

for(let i=0;i<12;i++){

mountain(
-31+i*5,
-115-Math.random()*55,
7+Math.random()*7
);

mountain(
31-i*5,
-115-Math.random()*55,
7+Math.random()*7
);
}


/* TREES */

function tree(x,z,s){

const g=new THREE.Group();

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(
.22,.32,1.8,8
),
new THREE.MeshLambertMaterial({
color:0x70482f
})
);

trunk.position.y=.9;

g.add(trunk);

for(let i=0;i<3;i++){

const leaf=new THREE.Mesh(
new THREE.ConeGeometry(
1.55-i*.27,
2.4,
8
),
new THREE.MeshLambertMaterial({
color:i?0x078a39:0x08612d
})
);

leaf.position.y=
1.9+i*.9;

g.add(leaf);
}

g.position.set(x,0,z);

g.scale.setScalar(s);

scene.add(g);
}

for(let i=0;i<34;i++){

const side=
Math.random()<.5?-1:1;

tree(
side*(9+Math.random()*8),
-10-Math.random()*205,
.7+Math.random()*1.2
);
}


/* BIKE */

function makeBike(){

const g=new THREE.Group();

const red=new THREE.MeshStandardMaterial({
color:0xe51a2a,
metalness:.2,
roughness:.28
});

const dark=new THREE.MeshStandardMaterial({
color:0x090d12,
metalness:.1,
roughness:.3
});

const chrome=new THREE.MeshStandardMaterial({
color:0x999999,
metalness:.85,
roughness:.2
});

const blue=new THREE.MeshStandardMaterial({
color:0x55d8f4,
metalness:.2,
roughness:.15
});


/* WHEELS */

function wheel(z){

const w=new THREE.Mesh(
new THREE.CylinderGeometry(
.72,.72,.25,24
),
dark
);

w.rotation.z=Math.PI/2;
w.position.z=z;
w.castShadow=true;

g.add(w);

const rim=new THREE.Mesh(
new THREE.CylinderGeometry(
.39,.39,.28,20
),
chrome
);

rim.rotation.z=Math.PI/2;
rim.position.z=z;

g.add(rim);

const hub=new THREE.Mesh(
new THREE.CylinderGeometry(
.12,.12,.3,16
),
chrome
);

hub.rotation.z=Math.PI/2;
hub.position.z=z;

g.add(hub);
}

wheel(-1.12);
wheel(1.1);


/* ENGINE */

const engine=new THREE.Mesh(
new THREE.BoxGeometry(
.8,.58,.85
),
dark
);

engine.position.set(0,.72,0);

g.add(engine);


/* BODY */

const body=new THREE.Mesh(
new THREE.SphereGeometry(
.7,24,14
),
red
);

body.scale.set(
1,.58,1.32
);

body.position.set(
0,1.05,.05
);

body.castShadow=true;

g.add(body);


/* SIDE FAIRINGS */

const sideL=new THREE.Mesh(
new THREE.BoxGeometry(
.18,.42,1.15
),
red
);

sideL.position.set(
-.56,.93,.08
);

g.add(sideL);

const sideR=sideL.clone();

sideR.position.x=.56;

g.add(sideR);


/* SEAT */

const seat=new THREE.Mesh(
new THREE.BoxGeometry(
.62,.15,1.08
),
dark
);

seat.position.set(
0,1.5,-.3
);

g.add(seat);


/* RIDER */

const rider=new THREE.Mesh(
new THREE.CapsuleGeometry(
.33,.72,8,16
),
dark
);

rider.position.set(
0,1.83,-.02
);

rider.rotation.x=-.25;

g.add(rider);


/* HELMET */

const helmet=new THREE.Mesh(
new THREE.SphereGeometry(
.42,24,16
),
dark
);

helmet.position.set(
0,2.4,.12
);

g.add(helmet);


/* VISOR */

const visor=new THREE.Mesh(
new THREE.BoxGeometry(
.58,.16,.08
),
blue
);

visor.position.set(
0,2.4,.49
);

g.add(visor);


/* FRONT FORKS */

for(const x of [-.15,.15]){

const fork=new THREE.Mesh(
new THREE.CylinderGeometry(
.055,.07,1.35,12
),
chrome
);

fork.position.set(
x,.94,1.03
);

fork.rotation.x=.12;

g.add(fork);
}


/* HANDLEBAR */

const handle=new THREE.Mesh(
new THREE.CylinderGeometry(
.045,.045,1.55,12
),
chrome
);

handle.rotation.z=Math.PI/2;

handle.position.set(
0,1.58,1.02
);

g.add(handle);


/* HEADLIGHT */

const lamp=new THREE.Mesh(
new THREE.SphereGeometry(
.14,16,10
),
new THREE.MeshBasicMaterial({
color:0xffffff
})
);

lamp.position.set(
0,1.34,1.52
);

g.add(lamp);


/* TAIL */

const tail=new THREE.Mesh(
new THREE.BoxGeometry(
.28,.12,.1
),
new THREE.MeshBasicMaterial({
color:0xff2020
})
);

tail.position.set(
0,1.2,-1.03
);

g.add(tail);


/* EXHAUST */

const exhaust=new THREE.Mesh(
new THREE.CylinderGeometry(
.09,.13,.9,12
),
chrome
);

exhaust.rotation.x=Math.PI/2;

exhaust.position.set(
.47,.63,-.72
);

g.add(exhaust);


/* NITRO */

const flame=new THREE.Mesh(
new THREE.ConeGeometry(
.23,.9,12
),
new THREE.MeshBasicMaterial({
color:0xff7100
})
);

flame.rotation.x=Math.PI;

flame.position.set(
.47,.63,-1.3
);

flame.visible=false;

g.add(flame);

g.userData.flame=flame;

g.position.set(0,0,6);

g.scale.setScalar(1.08);

scene.add(g);

return g;
}

const bike=makeBike();


/* TRAFFIC */

const traffic=[];

function makeCar(lane,z=-105){

const g=new THREE.Group();

const colors=[
0xe51d2a,
0x1674d9,
0xf2c515,
0xffffff,
0x161a20
];

const body=new THREE.Mesh(
new THREE.BoxGeometry(
1.72,.78,2.9
),
new THREE.MeshStandardMaterial({
color:colors[
Math.floor(Math.random()*colors.length)
],
roughness:.35
})
);

body.position.y=.62;
body.castShadow=true;

g.add(body);

const roof=new THREE.Mesh(
new THREE.BoxGeometry(
1.3,.52,1.5
),
body.material
);

roof.position.y=1.13;

g.add(roof);

const glass=new THREE.Mesh(
new THREE.BoxGeometry(
1.1,.32,.62
),
new THREE.MeshStandardMaterial({
color:0x9edff0,
roughness:.2
})
);

glass.position.set(
0,1.18,.42
);

g.add(glass);

for(const xx of [-.8,.8]){

for(const zz of [-.95,.95]){

const w=new THREE.Mesh(
new THREE.CylinderGeometry(
.31,.31,.2,16
),
new THREE.MeshStandardMaterial({
color:0x111111
})
);

w.rotation.z=Math.PI/2;

w.position.set(
xx,.32,zz
);

g.add(w);
}
}

g.position.set(
lane,
.05,
z-Math.random()*25
);

scene.add(g);

traffic.push(g);
}


/* COINS */

const coinObjects=[];

function makeCoin(lane,z){

const c=new THREE.Mesh(
new THREE.CylinderGeometry(
.4,.4,.13,24
),
new THREE.MeshStandardMaterial({
color:0xffd21a,
metalness:.85,
roughness:.18,
emissive:0x4a3000
})
);

c.rotation.x=Math.PI/2;

c.position.set(
lane,1,z
);

scene.add(c);

coinObjects.push(c);
}


/* STATE */

let running=false;
let score=0;
let coins=0;
let lives=3;
let speed=88;
let playerX=0;

let left=false;
let right=false;
let nitro=false;

let spawn=0;
let coinSpawn=0;

let best=Number(
localStorage.getItem("superBikeBest")||0
);


/* HUD */

function hud(){

$("score").textContent=
Math.floor(score);

$("lives").textContent=
lives;

$("coins").textContent=
coins;

$("best").textContent=
best;

$("speedValue").textContent=
Math.floor(speed);
}


/* CONTROLS */

function hold(btn,type){

btn.addEventListener(
"pointerdown",
e=>{
e.preventDefault();

if(type==="l")
left=true;
else
right=true;
}
);

for(const ev of [
"pointerup",
"pointercancel",
"pointerleave"
]){

btn.addEventListener(
ev,
()=>{
if(type==="l")
left=false;
else
right=false;
}
);
}
}

hold($("left"),"l");
hold($("right"),"r");


/* KEYBOARD */

addEventListener("keydown",e=>{

if(e.key==="ArrowLeft"||e.key==="a")
left=true;

if(e.key==="ArrowRight"||e.key==="d")
right=true;

if(e.code==="Space")
nitro=true;
});

addEventListener("keyup",e=>{

if(e.key==="ArrowLeft"||e.key==="a")
left=false;

if(e.key==="ArrowRight"||e.key==="d")
right=false;

if(e.code==="Space")
nitro=false;
});


/* NITRO BUTTON */

$("nitro").onpointerdown=()=>{
nitro=true;
};

$("nitro").onpointerup=()=>{
nitro=false;
};

$("nitro").onpointercancel=()=>{
nitro=false;
};


/* SWIPE */

let swipeX=null;

renderer.domElement.addEventListener(
"touchstart",
e=>{
swipeX=e.touches[0].clientX;
},
{passive:true}
);

renderer.domElement.addEventListener(
"touchmove",
e=>{

if(swipeX===null)return;

const nx=e.touches[0].clientX;

playerX+=
(nx-swipeX)/
innerWidth*7;

playerX=Math.max(
-5.2,
Math.min(5.2,playerX)
);

swipeX=nx;

},
{passive:true}
);

renderer.domElement.addEventListener(
"touchend",
()=>{
swipeX=null;
}
);


/* START */

function start(){

score=0;
coins=0;
lives=3;
speed=88;
playerX=0;
spawn=0;
coinSpawn=0;

traffic.forEach(
o=>scene.remove(o)
);

traffic.length=0;

coinObjects.forEach(
o=>scene.remove(o)
);

coinObjects.length=0;

running=true;

$("menu").classList.add(
"hide"
);

hud();

last=performance.now();

requestAnimationFrame(loop);
}

$("start").onclick=start;


/* GAME OVER */

function gameOver(){

running=false;

$("title").textContent=
"💥 RACE OVER";

$("info").innerHTML=
"🏆 Score: <b>"+
Math.floor(score)+
"</b><br>🪙 Coins: <b>"+
coins+
"</b><br>⭐ Best: <b>"+
best+
"</b><br><br>Ready for another race?";

$("start").textContent=
"🏍️ RACE AGAIN";

$("menu").classList.remove(
"hide"
);
}


/* UPDATE */

function update(dt){

playerX+=
(right-left)*dt*6;

playerX=Math.max(
-5.2,
Math.min(5.2,playerX)
);

bike.position.x+=
(playerX-bike.position.x)*
dt*10;

bike.rotation.z=
(playerX-bike.position.x)*
-.07;


/* SPEED */

if(nitro){

speed=Math.min(
250,
speed+dt*55
);

bike.userData.flame.visible=true;

}else{

speed=Math.min(
180,
speed+dt*2.8
);

bike.userData.flame.visible=false;

}


/* ROAD */

const move=
dt*(speed/18);

marks.forEach(m=>{

m.position.z+=move;

if(m.position.z>14)
m.position.z-=286;

});


/* CARS */

spawn+=dt;

if(spawn>.65){

spawn=0;

makeCar(
[-5,0,5][
Math.floor(
Math.random()*3
)
]
);
}


/* COINS */

coinSpawn+=dt;

if(coinSpawn>.7){

coinSpawn=0;

makeCoin(
[-5,0,5][
Math.floor(
Math.random()*3
)
],
-105
);
}


/* MOVE */

traffic.forEach(
c=>c.position.z+=move
);

coinObjects.forEach(
c=>{
c.position.z+=move;
c.rotation.y+=dt*7;
}
);


/* COLLISION */

for(const c of traffic){

if(
!c.userData.hit&&
Math.abs(
c.position.x-bike.position.x
)<1.35&&
Math.abs(
c.position.z-bike.position.z
)<2.25
){

c.userData.hit=true;

lives--;

speed=Math.max(
50,
speed*.55
);

c.position.z=30;

if(navigator.vibrate)
navigator.vibrate(220);
}
}


/* COINS */

for(const c of coinObjects){

if(
!c.userData.hit&&
Math.abs(
c.position.x-bike.position.x
)<1.25&&
Math.abs(
c.position.z-bike.position.z
)<1.8
){

c.userData.hit=true;

coins++;

score+=30;

c.position.z=30;
}
}


/* CLEAN */

for(let i=traffic.length-1;i>=0;i--){

if(
traffic[i].position.z>22
){

scene.remove(
traffic[i]
);

traffic.splice(i,1);
}
}

for(let i=coinObjects.length-1;i>=0;i--){

if(
coinObjects[i].position.z>22
){

scene.remove(
coinObjects[i]
);

coinObjects.splice(i,1);
}
}


/* SCORE */

score+=
dt*speed*.085;

if(score>best){

best=Math.floor(score);

localStorage.setItem(
"superBikeBest",
best
);
}

hud();

if(lives<=0)
gameOver();
}


/* LOOP */

let last=performance.now();

function loop(t){

if(!running)
return;

const dt=Math.min(
.035,
(t-last)/1000
);

last=t;

update(dt);


/* CAMERA */

camera.position.x+=
(
bike.position.x*.38-
camera.position.x
)*dt*4;

camera.position.y+=
(
4.8-
camera.position.y
)*dt*3;

camera.lookAt(
bike.position.x*.18,
1.1,
-14
);

renderer.render(
scene,
camera
);

requestAnimationFrame(loop);
}


/* RESIZE */

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);
}
);

hud();

renderer.render(
scene,
camera
);

})();
</script>

</body>
</html>
