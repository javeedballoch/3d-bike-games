<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Street Bike Racing</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <!-- Sky -->
  <div class="sky">
    <div class="sun"></div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div>🏆 <span id="score">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
    <div>🪙 <span id="coinCount">0</span></div>
    <div>BEST <span id="best">0</span></div>
  </div>

  <!-- Game World -->
  <div id="world">

    <!-- Road -->
    <div id="road">
      <div class="lane-line line1"></div>
      <div class="lane-line line2"></div>
    </div>

    <!-- Player Bike -->
    <div id="bike">

      <div class="wheel front"></div>
      <div class="wheel back"></div>

      <div class="handle"></div>

      <div class="rider"></div>
      <div class="helmet"></div>

      <div class="seat"></div>
      <div class="tank"></div>
      <div class="body"></div>

      <div class="light"></div>

    </div>

    <!-- Obstacles -->
    <div id="objects"></div>

  </div>

  <!-- Speed -->
  <div id="speed">
    ⚡ SPEED <span id="speedValue">2</span>
  </div>

  <!-- Nitro -->
  <button id="nitro">🔥 NITRO</button>

  <!-- Controls -->
  <div id="controls">

    <button id="left">⬅️</button>

    <button id="right">➡️</button>

  </div>

  <!-- Game Over -->
  <div id="gameOver">

    <h1>💥 CRASH!</h1>

    <p>
      Score:
      <b id="finalScore">0</b>
    </p>

    <p>
      Coins:
      <b id="finalCoins">0</b>
    </p>

    <p>
      Best:
      <b id="finalBest">0</b>
    </p>

    <button id="restart">
      🏍️ RACE AGAIN
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
